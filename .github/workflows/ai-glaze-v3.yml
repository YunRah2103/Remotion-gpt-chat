name: AI Glaze V3 — Remotion visual production
on:
  push:
    branches:
      - feat/ai-glaze-tiktok-20261017
    paths:
      - src/tiktok/AiGlazeTikTokV3.tsx
      - src/Root.tsx
      - .github/workflows/ai-glaze-v3.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Remotion dependencies and FFmpeg
        run: |
          npm install --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: TypeScript check
        run: npm run check
      - name: Preview and registered composition verification
        run: |
          mkdir -p out
          npx remotion compositions src/index.ts > out/compositions.txt
          grep -q 'AiGlazeTikTokV3' out/compositions.txt
          npx remotion render src/index.ts AiGlazeTikTokV3 out/ai-glaze-v3-preview.mp4 --frames=200-289 --scale=0.5 --codec=h264 --pixel-format=yuv420p --concurrency=2
      - name: Final full resolution Remotion visual render
        run: |
          npx remotion render src/index.ts AiGlazeTikTokV3 out/ai-glaze-v3-remotion-visual.mp4 --codec=h264 --pixel-format=yuv420p --concurrency=2
          ffmpeg -hide_banner -loglevel error -xerror -i out/ai-glaze-v3-remotion-visual.mp4 -f null -
          ffprobe -v error -show_streams -of json out/ai-glaze-v3-remotion-visual.mp4 > out/probe.json
          python3 - <<'PY'
          import json
          p=json.load(open('out/probe.json'))
          v=next(s for s in p['streams'] if s['codec_type']=='video')
          assert v['codec_name']=='h264',v
          assert (v['width'],v['height'])==(1080,1920),v
          assert v['r_frame_rate']=='30/1',v
          assert int(v['nb_frames'])==909,v
          print('Verified 909 frames at 1080x1920, 30fps, 30.3 seconds')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: AI-GLAZE-V3-REMOTION-VISUAL-ONLY
          path: |
            out/ai-glaze-v3-remotion-visual.mp4
            out/ai-glaze-v3-preview.mp4
            out/compositions.txt
            out/probe.json
          retention-days: 30
          if-no-files-found: error

name: STO V10 Agent A - original track driving HD video
on:
  push:
    branches: [automotive-edits/huracan-sto-v10-001/a-footage]
    paths:
      - production/videos/huracan-sto-v10-001/footage/acquire_dailymotion_official_sto.py
      - .github/workflows/sto-official-track-dailymotion.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  originals:
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native footage download and visual verification
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -U --disable-pip-version-check Pillow yt-dlp
          python -m py_compile production/videos/huracan-sto-v10-001/footage/acquire_dailymotion_official_sto.py
      - name: Acquire true 1080p+ Lamborghini Huracan STO original track and launch footage
        run: python production/videos/huracan-sto-v10-001/footage/acquire_dailymotion_official_sto.py
      - name: Source-by-source accurate manifest summary
        if: always()
        run: |
          python - <<'PY'
          import json,os,pathlib
          x=pathlib.Path('out/sto-dailymotion/manifest.json')
          if x.exists():
           d=json.loads(x.read_text())
           lines=['## STO public original HD film acquisition','**Native 1920x1080 minimum, manual shot/overlay QA needed. Green CI does not mean edit footage gate passes.**']
           for r in d['sources']:
            p=r.get('ffprobe',{})
            lines.append('- '+r['id']+': **'+r['state']+'** '+str(p.get('resolution',''))+' '+str(round(p.get('duration_seconds',0),1))+'s; '+r.get('error','')[-220:])
           with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('\n'.join(lines)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: STO-ORIGINAL-TRACK-DRIVING-NATIVE-1080P
          path: |
            out/STO_DAILYMOTION_NATIVE_HD_MASTERS.zip
            out/sto-dailymotion/manifest.json
          retention-days: 5
          if-no-files-found: warn
          compression-level: 0

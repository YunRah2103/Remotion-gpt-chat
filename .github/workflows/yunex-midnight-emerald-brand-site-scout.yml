name: YUNEX Midnight Emerald - Aston Main Site Video Scout
on:
  push:
    branches: [main]
    paths: ['.github/workflows/yunex-midnight-emerald-brand-site-scout.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scout:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect official DB12 brand site for actual direct video origins
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,re,html,json
          pages={
            'DB12_MODEL':'https://www.astonmartin.com/en/models/db12',
            'DB12_BROCHURE':'https://www.astonmartin.com/en/models/brochures/db12-brochure',
            'DB12_PERTH':'https://astonmartinperth.com.au/models/astonmartin-db12/',
          }
          for label,url in pages.items():
            print('PAGE',label,url,flush=True)
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'text/html,*/*;q=.5'})
              with urllib.request.urlopen(req,timeout=22) as r:
                page=r.read(2_500_000).decode('utf-8',errors='replace')
                print('HTTP',r.status,'HTML_LENGTH',len(page),'FINAL',r.url,flush=True)
              page=html.unescape(page).replace('\\/','/')
              matches=re.findall(r'(?:https?:)?//[^\\s"\\x27<>\\\\]+?\\.(?:mp4|webm|mov|m3u8)(?:\\?[^\\s"\\x27<>\\\\]*)?',page,re.I)
              matches+=re.findall(r'["\\x27](\\/[^"\\x27<>]+?\\.(?:mp4|webm|mov|m3u8)(?:\\?[^"\\x27<>]*)?)["\\x27]',page,re.I)
              candidates=list(dict.fromkeys(matches))
              print('DIRECT_CANDIDATES',len(candidates),flush=True)
              for c in candidates[:35]:print('MEDIA',c[:380],flush=True)
              for term in ('videoUrl','video_url','videoSrc','video-src','vimeo.com','youtube.com','cloudinary','mux.com','brightcove'):
                contexts=[re.sub(r'\\s+',' ',page[max(0,m.start()-70):m.end()+150]) for m in list(re.finditer(re.escape(term),page,re.I))[:3]]
                for c in contexts:print('EMBED',term,c[:270],flush=True)
            except Exception as e:print('PAGE_ERROR',type(e).__name__,str(e)[:350],flush=True)
          PY

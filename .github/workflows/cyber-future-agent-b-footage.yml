name: Cyber Future 001 - Agent B genuine footage acquisition

on:
  push:
    branches:
      - automotive-edits/cyber-future-prototypes-001/b-europe-footage
    paths:
      - '.github/workflows/cyber-future-agent-b-footage.yml'
      - 'production/videos/cyber-future-prototypes-001/agent-b/acquire.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cyber-future-agent-b-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out this agent's own branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install authentic video decoding and acquisition tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -q yt-dlp opencv-python-headless pillow
          ffprobe -version | head -1
          python -m yt_dlp --version
      - name: Download published source media, fully decode and export candidates
        run: |
          set -o pipefail
          python production/videos/cyber-future-prototypes-001/agent-b/acquire.py 2>&1 | tee /tmp/cyber-agent-b.log
      - name: Preserve actual video ZIP, candidate contact sheets and QA diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CYBER-FUTURE-001-FOOTAGE-B
          path: |
            out/cyber-future-agent-b/CYBER-FUTURE-001-FOOTAGE-B.zip
            out/cyber-future-agent-b/manifest.json
            out/cyber-future-agent-b/rejections.json
            out/cyber-future-agent-b/README_START_HERE.md
          if-no-files-found: warn
          compression-level: 0
          retention-days: 5
      - name: Commit small genuine decoder screenshot sheets for manual visual review
        if: always()
        run: |
          if test -d production/videos/cyber-future-prototypes-001/agent-b/review; then
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git config user.name 'github-actions[bot]'
            git add production/videos/cyber-future-prototypes-001/agent-b/review/
            git diff --cached --quiet || {
              git commit -m 'qa(cyber): publish Agent B decoded source contact sheets'
              git push origin HEAD:automotive-edits/cyber-future-prototypes-001/b-europe-footage
            }
          fi

name: Turbo Indy Agent D - official player diagnostics
on:
  push:
    branches:
      - automotive-edits/turbo-indy-reality-001/d-indy-cinematic
    paths:
      - .github/workflows/turbo-indy-agent-d-player-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-player-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Validate published JW Player sources through yt-dlp
        shell: bash
        run: |
          python -m pip install -q yt-dlp
          for src in "https://cdn.jwplayer.com/players/xl5UM3Ts-Z6BVOjjc.html" "https://cdn.jwplayer.com/players/Ie7gtLpi-Z6BVOjjc.html" "https://cdn.jwplayer.com/players/6ga4Meiv-Z6BVOjjc.html"; do
            echo "=== $src ==="
            timeout 35s yt-dlp --list-formats "$src" 2>&1 | tail -22 || true
          done
      - name: Probe free license Indianapolis track and pit B-roll
        shell: bash
        run: |
          for src in "https://www.pexels.com/video/lots-of-race-cars-on-starting-line-9737951/" "https://www.pexels.com/video/large-group-of-race-cars-on-starting-line-9737952/" "https://www.pexels.com/video/footage-of-speedway-with-crew-9737840/" "https://www.pexels.com/video/crew-replacing-tires-of-race-car-9737948/"; do
            echo "=== $src ==="
            timeout 25s yt-dlp --list-formats "$src" 2>&1 | tail -18 || true
          done
      - name: Inspect HTML of publicly visible INDYCAR players
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,re,html,json
          for tail in ('2025/05/05-14-nics-helmetcam-indy500-vid','2025/05/05-23-nics-pitstop-vid','2024/05/05-28-ExtendedOnboards-Indy500','2025/05/05-23-nics-paloucam-carbday-vid'):
            url='https://www.indycar.com/videos/'+tail
            print('\n===',url,'===')
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36'})
              with urllib.request.urlopen(req,timeout=25) as r:page=r.read().decode('utf-8','replace')
              print('PAGE LENGTH',len(page))
              for pattern in (r'(?is)<iframe[^>]{1,1000}>',r'(?is)<video[^>]{1,1000}>',r'(?is)<script[^>]{0,400}src=[^>]{1,300}',r'(?i)https?[^"\\ ]{1,280}(?:m3u8|mp4|brightcove|players\.[^"\\ ]+|vimeo|iframe|kaltura)[^"\\ ]*',r'(?i).{0,180}(?:brightcove|theoplayer|videoId|wistia|mediaplayer|videoPlayer|video-url|VideoSrc|jwplayer).{0,180}'):
                hits=re.findall(pattern,page)
                print('\nPATTERN',pattern,'HITS',len(hits))
                for hit in hits[:14]:print(re.sub(r'\s+',' ',html.unescape(hit))[:480])
            except Exception as e:print('FETCH ERROR',str(e))
          PY

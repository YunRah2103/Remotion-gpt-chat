name: YUNEX RS6 G add genuine moving native4k C8 footage
on:
  push:
    branches:
      - automotive-edits/rs6-no-mercy-001/g-director-rescue
    paths:
      - .github/workflows/rs6-g-new-driving.yml
      - production/videos/rs6-no-mercy-001/g_extra_driving.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extra-driving:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Media dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -q pillow
      - name: Extract + fully decode + contact real native Audi footage
        run: |
          python production/videos/rs6-no-mercy-001/g_extra_driving.py | tee new_c8_driving.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RS6_G_NEW_REAL_COAST_ROLLING_SHOTS_OWNER_ONLY
          path: |
            rs6-g-new-driving/
            new_c8_driving.log
          retention-days: 7
          if-no-files-found: warn

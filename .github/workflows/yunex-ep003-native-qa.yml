name: YUNEX EP003 - Ten Native Department MP4s and Evidence

on:
  push:
    branches:
      - agent/ep003-native-render-qa
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    name: Agent ${{ matrix.agent }} - ${{ matrix.label }} - two native MP4s
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - agent: 1
            label: mechanics
            branch: agent/ep003-01-mechanics
            entry: production/yunex/tyre_blowout_ep003/mechanics/preview-entry.tsx
            first: EP003TyreMacro
            second: EP003TyrePortrait
          - agent: 2
            label: dynamics
            branch: agent/ep003-02-dynamics
            entry: production/yunex/tyre_blowout_ep003/dynamics/entry.tsx
            first: EP003Agent2Incident
            second: EP003Agent2Recovery
          - agent: 3
            label: cinematography
            branch: agent/ep003-03-cinema
            entry: previews/agent-3/entry.tsx
            first: EP003CameraOpening
            second: EP003CameraMontage
          - agent: 4
            label: highway-look
            branch: agent/ep003-04-look
            entry: production/yunex/tyre_blowout_ep003/previews/agent-4/entry.tsx
            first: EP003LookBeforePortrait
            second: EP003LookAfterPortrait
          - agent: 5
            label: storytelling
            branch: agent/ep003-05-story
            entry: production/yunex/tyre_blowout_ep003/previews/agent-5/integrated-entry.tsx
            first: EP003StoryHookReal
            second: EP003StoryModuleReal

    steps:
      - name: Check out exact visual department branch (never main)
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          persist-credentials: false
      - name: Record source revision
        id: source
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git show -s --format='%h %s'
          mkdir -p out/ep003-native
          printf '%s\n' "agent=${{ matrix.agent }}" "department=${{ matrix.label }}" "branch=${{ matrix.branch }}" "sha=$(git rev-parse HEAD)" "entry=${{ matrix.entry }}" > out/ep003-native/source.txt
      - name: Hydrate authoritative modules for real cinematography and story (ephemeral CI only)
        if: ${{ matrix.agent == 3 || matrix.agent == 5 }}
        shell: bash
        run: |
          set -euxo pipefail
          modules=(mechanics dynamics look)
          if [[ "${{ matrix.agent }}" == "5" ]]; then modules+=(cinema); fi
          for module in "${modules[@]}"; do
            case "$module" in
              mechanics) source_branch=agent/ep003-01-mechanics ;;
              dynamics) source_branch=agent/ep003-02-dynamics ;;
              look) source_branch=agent/ep003-04-look ;;
              cinema) source_branch=agent/ep003-03-cinema ;;
              *) exit 2 ;;
            esac
            git fetch --no-tags --depth=1 origin "refs/heads/$source_branch"
            source_sha=$(git rev-parse FETCH_HEAD)
            [[ "${#source_sha}" -eq 40 ]]
            git restore --source=FETCH_HEAD --worktree -- "production/yunex/tyre_blowout_ep003/$module/"
            printf 'overlay_%s_branch=%s\noverlay_%s_sha=%s\n' "$module" "$source_branch" "$module" "$source_sha" | tee -a out/ep003-native/source.txt
          done
          test -f production/yunex/tyre_blowout_ep003/dynamics/model.ts
          test -f production/yunex/tyre_blowout_ep003/mechanics/tyreRig.ts
          test -f production/yunex/tyre_blowout_ep003/look/world.tsx
          if [[ "${{ matrix.agent }}" == "5" ]]; then
            test -f production/yunex/tyre_blowout_ep003/cinema/cameras.ts
            test -f production/yunex/tyre_blowout_ep003/previews/agent-5/IntegratedPreview.tsx
          fi
      - name: Node 22 and npm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install real repository dependencies
        run: npm ci --no-audit --no-fund
      - name: Check TypeScript and real department tests
        shell: bash
        run: |
          set -euxo pipefail
          npm run check
          npm run partskit:test
          npm run worldkit:test
          shopt -s nullglob
          tests=(tests/agent-${{ matrix.agent }}/*.test.mjs)
          if (( ${#tests[@]} > 0 )); then
            node --experimental-strip-types --test "${tests[@]}"
          else
            echo 'No agent-specific .test.mjs files found: TEST COVERAGE MISSING' | tee out/ep003-native/test-gap.txt
          fi
          if [[ "${{ matrix.agent }}" == "4" ]]; then
            npx --no-install tsc -p tests/agent-4/tsconfig.json --noEmit
          fi
          if [[ "${{ matrix.agent }}" == "1" ]]; then
            npx --no-install tsc -p previews/agent-1/tsconfig.json --noEmit
          fi
          if [[ "${{ matrix.agent }}" == "3" ]]; then
            npx --no-install tsc -p previews/agent-3/tsconfig.json --noEmit
          fi
          if [[ "${{ matrix.agent }}" == "5" ]]; then
            npx --no-install tsc -p production/yunex/tyre_blowout_ep003/previews/agent-5/tsconfig.json --noEmit
          fi
      - name: Install system FFmpeg and confirm Remotion browser
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          npx --no-install remotion browser ensure
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Render both actual portrait compositions, full temporal range
        shell: bash
        env:
          ENTRY: ${{ matrix.entry }}
          FIRST: ${{ matrix.first }}
          SECOND: ${{ matrix.second }}
          AGENT: ${{ matrix.agent }}
        run: |
          set -euxo pipefail
          for ID in "$FIRST" "$SECOND"; do
            npx --no-install remotion render "$ENTRY" "$ID" "out/ep003-native/agent${AGENT}-${ID}.mp4" \
              --gl=swangle --scale=0.25 --codec=h264 --pixel-format=yuv420p \
              --concurrency=1 --log=verbose
          done
      - name: FFprobe all frames, full FFmpeg decode, multi-time frame hashes
        shell: bash
        env:
          AGENT: ${{ matrix.agent }}
          FIRST: ${{ matrix.first }}
          SECOND: ${{ matrix.second }}
          BRANCH: ${{ matrix.branch }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,glob,json,hashlib,subprocess,pathlib
          root=pathlib.Path('out/ep003-native')
          files=sorted(root.glob('*.mp4'))
          assert len(files)==2, f'Expected two genuine MP4s, got {files}'
          reports=[]
          def execute(command):
              return subprocess.run(command,check=True,capture_output=True,text=True).stdout
          for path in files:
              meta=json.loads(execute(['ffprobe','-v','error','-select_streams','v:0',
                  '-show_entries','stream=codec_name,pix_fmt,width,height,nb_frames,avg_frame_rate:format=duration',
                  '-of','json',str(path)]))
              video=meta['streams'][0]
              duration=float(meta['format']['duration'])
              assert video['codec_name']=='h264',meta
              assert video['pix_fmt'] in ('yuv420p','yuvj420p'),meta # FFprobe may report full-range 4:2:0 as yuvj420p
              assert (int(video['width']),int(video['height']))==(270,480),meta
              assert video['avg_frame_rate']=='30/1',meta
              assert abs(int(video['nb_frames'])-duration*30)<2,meta
              assert 3 <= duration <= 11,meta
              execute(['ffmpeg','-hide_banner','-v','error','-xerror','-i',str(path),'-f','null','-'])
              stamps=[.15,.8,duration*.4,duration*.67,duration-.2]
              hashes=[]
              for i,t in enumerate(stamps):
                  png=root/(path.stem+f'-frame{i}.png')
                  execute(['ffmpeg','-hide_banner','-v','error','-y','-ss',str(max(0,t)),
                    '-i',str(path),'-frames:v','1',str(png)])
                  digest=hashlib.sha256(png.read_bytes()).hexdigest()
                  hashes.append(digest)
              assert len(set(hashes))>=3, f'No convincing frame-to-frame changes in {path}'
              movie_hash=hashlib.sha256(path.read_bytes()).hexdigest()
              reports.append({'asset':path.name,'sha256':movie_hash,'byte_count':path.stat().st_size,
                  'source_branch':os.environ['BRANCH'],'source_sha':os.environ['SOURCE_SHA'],
                  'dependency_revisions':(root/'source.txt').read_text(),
                  'source_composition_width':1080,'source_composition_height':1920,
                  'review_scale':0.25,'metadata':meta,'full_ffmpeg_decode':'passed',
                  'frame_seconds':stamps,'frame_sha256':hashes,'distinct_frames':len(set(hashes)),
                  'artistic_approval':'NOT CHECKED: moving video requires director inspection'})
          (root/'agent-report.json').write_text(json.dumps(reports,indent=2))
          print(json.dumps(reports,indent=2))
          PY
      - name: Upload native clips, inspection PNGs, raw validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ep003-department-agent-${{ matrix.agent }}-${{ github.run_id }}
          path: out/ep003-native/
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: Assemble verified 10-video artifact (release optional)
    if: always()
    needs: [render]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout verification branch for gh
        uses: actions/checkout@v4
      - name: Download all successfully uploaded evidence packages
        uses: actions/download-artifact@v4
        with:
          pattern: ep003-department-agent-*
          path: received
          merge-multiple: false
      - name: Publish only validated files, never failed/absent renders
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          VERIFY_RESULT: ${{ needs.render.result }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,glob,pathlib,hashlib,shutil
          root=pathlib.Path('received')
          out=pathlib.Path('release-media')
          out.mkdir(exist_ok=True)
          notes=[]
          manifests=sorted(root.glob('*/agent-report.json'))
          if len(manifests)!=5:
              raise RuntimeError(f'Incomplete departmental evidence: expected 5 validation manifests, found {len(manifests)}')
          for manifest in manifests:
              rows=json.loads(manifest.read_text())
              if len(rows)!=2:
                  raise RuntimeError(f'Expected two fully validated native videos in {manifest}, got {len(rows)}')
              for entry in rows:
                  p=manifest.parent/entry['asset']
                  if not p.exists() or hashlib.sha256(p.read_bytes()).hexdigest()!=entry['sha256']:
                      raise RuntimeError(f'MP4 evidence integrity mismatch for {p}')
                  if p.stat().st_size < 100000 or not entry.get('full_ffmpeg_decode')=='passed':
                      raise RuntimeError(f'Not a fully decoded, nonempty native video: {p}')
                  if entry['metadata']['streams'][0]['codec_name']!='h264' or len(entry['frame_sha256'])!=5 or entry['distinct_frames']<3:
                      raise RuntimeError(f'Missing codec and motion evidence for {p}')
                  shutil.copyfile(p,out/entry['asset'])
                  for frame in sorted(manifest.parent.glob(p.stem+'-frame*.png')):
                      shutil.copyfile(frame,out/frame.name)
                  shutil.copyfile(manifest.parent/'source.txt',out/(p.stem+'-source.txt'))
                  notes.append(entry)
          expected={
              'agent1-EP003TyreMacro.mp4','agent1-EP003TyrePortrait.mp4',
              'agent2-EP003Agent2Incident.mp4','agent2-EP003Agent2Recovery.mp4',
              'agent3-EP003CameraOpening.mp4','agent3-EP003CameraMontage.mp4',
              'agent4-EP003LookBeforePortrait.mp4','agent4-EP003LookAfterPortrait.mp4',
              'agent5-EP003StoryHookReal.mp4','agent5-EP003StoryModuleReal.mp4',
          }
          if len(notes)!=10 or {v['asset'] for v in notes}!=expected:
              raise RuntimeError(f'Incomplete native ten-clip acceptance gate: {[v["asset"] for v in notes]}')
          (out/'machine-verification.json').write_text(json.dumps(notes,indent=2))
          (out/'summary.md').write_text('# YUNEX EP003 / actual native Remotion review media\n\n'
            'Automated QA: full FFmpeg decode, H.264 / FFprobe metadata and independent frame hashes. '
            'These are 25% resolution review copies from portrait 1080x1920 at 30fps source compositions. '
            'Source branch SHA and codec metadata are in machine-verification.json. '
            'Creative inspection and authoritative cross-department physics integration remain pending. '
            'Temporary demonstration motion MUST NOT be presented as physically approved.\n\n'
            + '\n'.join(f"- {v['asset']} — {v['byte_count']} bytes, {v['metadata']['format']['duration']}s, SHA256 {v['sha256']}, source {v['source_sha']}" for v in notes)
            + '\n')
          print(f'VALIDATED_CLIPS={len(notes)}')
          PY
          count=$(find release-media -maxdepth 1 -name '*.mp4' -type f | wc -l)
          echo "Actual native and fully decoded MP4 count: $count"
          [[ "$VERIFY_RESULT" == "success" ]] || { echo "Matrix did not fully succeed: $VERIFY_RESULT"; exit 1; }
          [[ "$count" -eq 10 ]] || { echo "Need all TEN independently decoded native MP4s, got $count; no release"; exit 1; }
          tag="ep003-native-qa-${RUN_ID}"
          run_page="https://github.com/${REPO}/actions/runs/${RUN_ID}"
          verified_artifact="ep003-ten-verified-native-mp4s-${RUN_ID}"
          published="GitHub Actions artifact (release permission restricted)"
          page="$run_page"
          # This repository's Actions integration returned HTTP 403 on
          # POST /releases in run 39287865546. Keep the verified MP4s
          # accessible as an Actions artifact without pretending a Release exists.
          if gh release create "$tag" --repo "$REPO" --target "${GITHUB_SHA}" \
              --title "YUNEX EP003 native Remotion visual QA / run ${RUN_ID}" \
              --notes-file release-media/summary.md; then
            if gh release upload "$tag" release-media/*.mp4 release-media/*.png \
                release-media/*-source.txt release-media/machine-verification.json \
                --repo "$REPO" --clobber; then
              page="https://github.com/${REPO}/releases/tag/${tag}"
              published="GitHub Release with ten MP4s"
            else
              echo "::warning::Release asset write restricted; complete media remains in Actions artifact"
            fi
          else
            echo "::warning::Release creation denied; complete native media will be uploaded as an Actions artifact"
          fi
          {
            echo "### Ten genuine fully decoded EP003 native MP4s / run ${RUN_ID}"
            echo
            echo "Source-verified native H264 previews: ${run_page}"
            echo
            echo "Download the ten-MP4 bundle under Artifacts: ${verified_artifact}"
            echo
            echo "Publication: ${published}; public release, only if actually uploaded: ${page}"
            echo
            echo "Actual verified MP4 count: ${count}. All five rendering jobs: ${VERIFY_RESULT}."
            echo
            echo "All media SHA256s, exact source branch SHAs, FFprobe metadata, full FFmpeg decode, and five distinct temporal PNG frames/video are in machine-verification.json."
            echo
            echo "Creative / physical sign-off NOT implied; Agent 0 must watch the ten genuine clips and inspect the correct-physics recovery."
          } | tee issue-comment.md >> "$GITHUB_STEP_SUMMARY"
          if ! gh issue comment 193 --repo "$REPO" --body-file issue-comment.md; then
            echo "::warning::Issue write permission restricted; report available in Actions job summary and artifacts"
          fi
          if ! gh pr comment 204 --repo "$REPO" --body-file issue-comment.md; then
            echo "::warning::PR write permission restricted; report available in Actions job summary and artifacts"
          fi
      - name: Upload COMPLETE ten-video playable QA bundle even when Releases API is forbidden
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ep003-ten-verified-native-mp4s-${{ github.run_id }}
          path: release-media/
          if-no-files-found: error
          retention-days: 30

name: YUNEX GT3 A2 Ferrari NLS9 1080p Film Recovery
on:
  push:
    branches:
      - automotive-edits/gt3-nurburgring-multicar-001/a2-ferrari-aston-mclaren
    paths:
      - .github/workflows/gt3-a2-ferrari-nls9-recovery.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ferrari-publisher-native-media:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install native video QA and browser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y ffmpeg
          python -m pip install -q --break-system-packages playwright pillow yt-dlp requests
          python -m playwright install chromium
      - name: Reacquire proven real 1920x1080 NLS9 video and contact sheets
        run: python -u production/videos/gt3-nurburgring-multicar-001/agent-a2/recover_ferrari_nls9_native.py
      - name: Independently verify actual ZIP video bytes, SHA and native resolution
        run: |
          python - <<'PY'
          import json,hashlib,zipfile,pathlib
          path=pathlib.Path("out/gt3-a2-ferrari-nls9-native/GT3_A2_BROWSER_ORIGINALS_AND_QA.zip")
          assert path.exists(),"MISSING_ZIP"
          with zipfile.ZipFile(path) as z:
            assert z.testzip() is None
            m=json.loads(z.read("SOURCE_MANIFEST.json"))
            assert m["native_hd_media_file_count"]>=1,"NO_NATIVE_1080_VIDEO"
            for s in m["sources"]:
              if s["status"]=="REAL_NATIVE_HD_FULL_DECODE_MODEL_REVIEW_PENDING":
                assert hashlib.sha256(z.read(s["file"])).hexdigest()==s["sha256"]
                assert s["resolution"][0]>=1920 and s["resolution"][1]>=1080
                print("VERIFIED_ORIGINAL_SOURCE",s["sha256"],s["resolution"],s["file"])
          PY
      - name: Upload ONE physically verified native video ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GT3-A2-FERRARI-NLS9-ACTUAL-NATIVE-1080-SOURCE-REVIEW
          path: out/gt3-a2-ferrari-nls9-native/GT3_A2_BROWSER_ORIGINALS_AND_QA.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

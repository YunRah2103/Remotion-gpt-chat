name: YUNEX GT3 Manufacturer Native Video Routes
on:
  push:
    branches:
      - automotive-edits/gt3-nurburgring-multicar-001/a-footage
    paths:
      - .github/workflows/gt3-manufacturer-probe.yml
      - production/videos/gt3-nurburgring-multicar-001/agent-a/probe_manufacturer_sites.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Install public page and extractor tools
        run: python -m pip install -q -U requests beautifulsoup4 yt-dlp
      - name: Probe BMW Audi Mercedes AMG Aston and race-org video
        run: python production/videos/gt3-nurburgring-multicar-001/agent-a/probe_manufacturer_sites.py
      - name: Publish exact URL/format metadata with clear unverified status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GT3-ADDITIONAL-MANUFACTURERS-HD-VIDEO-ROUTES
          path: out/gt3-manufacturer-alt-probe/publisher_video_routes.json
          retention-days: 7
          if-no-files-found: warn

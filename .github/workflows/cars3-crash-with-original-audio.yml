name: YUNEX Cars3 Private Crash Match with Original Audio
on:
  push:
    branches: [yunex-cars3-crash-transition-proof-20261014]
    paths:
      - '.github/workflows/cars3-crash-with-original-audio.yml'
      - 'production/research/cars3-crash-proof-20261014/build.py'
  workflow_dispatch:
permissions:
  contents: write
  issues: read
jobs:
  crash_test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Ensure FFmpeg and numerical frame analysis
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --disable-pip-version-check opencv-python-headless numpy
      - name: Wait for owner phone job #87 to verify original Cars 3 source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            latest="$(gh api --paginate 'repos/YunRah2103/Remotion-gpt-chat/issues/87/comments?per_page=100' \
              --jq '[.[] | select(.user.login == "YunRah2103") | .body | select(startswith("YUNEX_PHONE_DONE_V4") or startswith("YUNEX_PHONE_FAILED_V4"))] | last // ""')"
            if [[ "$latest" == YUNEX_PHONE_DONE_V4* ]]; then
              echo "Owner original Cars3 crash source verified by phone job #87"
              exit 0
            fi
            if [[ "$latest" == YUNEX_PHONE_FAILED_V4* ]]; then
              echo "::error::Owner phone job #87 failed; do not fabricate audio or crash footage"
              exit 4
            fi
            echo "Waiting for verified owner phone media (#87) — attempt $i / 30"
            sleep 20
          done
          echo "::error::Owner phone capture #87 has not completed after 10 minutes"
          exit 5
      - name: Download and validate owner-only original crash scene
        id: pixar
        uses: ./.github/actions/yunex-v4-import
        with:
          issue_number: '87'
          token: ${{ github.token }}
          destination: work/yunex-cars3-original-private
      - name: Source/audio verification and crash-first preview rendering
        env:
          CARS3_SOURCE: ${{ steps.pixar.outputs.asset_path }}
        run: python3 production/research/cars3-crash-proof-20261014/build.py
      - name: Save ONLY private audio/video previews as owner-only DRAFT release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "yunex-cars3-crash-review-${GITHUB_RUN_ID}" \
            work/yunex-cars3-crash/cars3_to_real_crash_original_audio_1.mp4 \
            work/yunex-cars3-crash/cars3_to_real_crash_original_audio_2.mp4 \
            --repo YunRah2103/Remotion-gpt-chat \
            --title "PRIVATE YUNEX Cars3 original audio crash transition proofs" \
            --notes "Owner preview only: protected original Cars 3 source audio preserved, real stock-car spin then unchanged racing. Source window selected by heuristics; crash frame still requires user visual approval; publishing rights unverified." \
            --draft --target "$GITHUB_SHA"
          gh release view "yunex-cars3-crash-review-${GITHUB_RUN_ID}" --repo YunRah2103/Remotion-gpt-chat --json url,isDraft,assets
      - name: Commit technical metrics ONLY, no protected source footage
        if: always()
        shell: bash
        run: |
          test -s production/research/cars3-crash-proof-20261014/report.json || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production/research/cars3-crash-proof-20261014/report.json
          if ! git diff --cached --quiet; then
            git commit -m "Cars 3 private crash with original audio technical QA"
            git push
          fi

name: Render GPU DRIVE 001 (real 3D)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencies
        run: |
          npm install --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: TypeScript
        run: npm run check
      - name: Render real 3D scene using software-backed WebGL
        run: |
          mkdir -p out
          npx remotion render src/index.ts GpuDriveFilm out/3d-visual.mp4 --codec=h264 --pixel-format=yuv420p --gl=swangle --concurrency=2
      - name: Soundtrack and master mux
        run: |
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "sine=frequency=57:duration=6:sample_rate=48000" -f lavfi -i "anoisesrc=color=pink:amplitude=0.14:duration=6:sample_rate=48000" -filter_complex "[0:a]volume=0.27,afade=t=in:st=0:d=0.15,afade=t=out:st=5.3:d=0.6[low];[1:a]highpass=f=170,lowpass=f=2100,volume=0.12,afade=t=in:st=0:d=0.25,afade=t=out:st=5.2:d=0.7[air];[low][air]amix=inputs=2:duration=shortest:normalize=0[a]" -map "[a]" -c:a aac -b:a 160k out/sound.m4a
          ffmpeg -hide_banner -loglevel error -y -i out/3d-visual.mp4 -i out/sound.m4a -map 0:v:0 -map 1:a:0 -c:v copy -c:a copy -t 6 -movflags +faststart out/GPU-DRIVE-001.mp4
      - name: Validate final MP4
        run: |
          ffmpeg -hide_banner -loglevel error -xerror -i out/GPU-DRIVE-001.mp4 -f null -
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,pix_fmt,width,height,nb_frames,r_frame_rate -of json out/GPU-DRIVE-001.mp4 > out/video-validation.json
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of json out/GPU-DRIVE-001.mp4 > out/audio-validation.json
          cat out/video-validation.json
          cat out/audio-validation.json
          sha256sum out/GPU-DRIVE-001.mp4 > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GPU-DRIVE-001-3D-MP4
          path: |
            out/GPU-DRIVE-001.mp4
            out/video-validation.json
            out/audio-validation.json
            out/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error

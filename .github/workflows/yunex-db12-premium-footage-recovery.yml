name: YUNEX DB12 Premium Footage — Owner-Only Acquisition
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yunex-db12-premium-footage-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install source and verification tools
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -q -U 'yt-dlp[default]' curl-cffi
      - name: Acquire candidate native videos, privately, with bounded public methods
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p out/DB12_PREMIUM
          cat > /tmp/acquire.py <<'PY'
          import subprocess, pathlib, json, hashlib, time, glob, shutil
          p=pathlib.Path("out/DB12_PREMIUM")
          sources=[
            {"id":"official-press-embed","source":"https://player.vimeo.com/video/1031864127","creator":"Aston Martin official media DB12 10 second hook film","method":"Public media.astonmartin.com player embed with origin referer","status":"private press-media review only; reuse permission NOT confirmed","real_filming":"Official DB12 footage; require visual verification"},
            {"id":"director-campaign-embed","source":"https://player.vimeo.com/video/854378299","creator":"Director Anders Jedenfors, film producer Martin Coceres, for Aston Martin; Vimeo campaign","method":"Vimeo embedded player with director site referrer; alternative to account-gated webpage","status":"private review only; commercial reuse permission NOT confirmed","real_filming":"Professional directed campaign, shot for Aston Martin; require visual verification"},
          ]
          for s in sources:
            base=p/s["id"]
            out=str(base)+".%(ext)s"
            cmd=["timeout","115","python","-m","yt_dlp","--no-playlist","--no-part","--no-write-info-json","--socket-timeout","15","--retries","1","--fragment-retries","1","--no-progress","-f","bv*[height<=2160]+ba/b[height<=2160]","--merge-output-format","mp4","-o",out]
            if s["id"]=="official-press-embed":
              cmd+=["--referer","https://media.astonmartin.com/db12-227972/"]
            if s["id"]=="director-campaign-embed":
              cmd+=["--referer","https://kitchen.video/director/anders-jedenfors/"]
            cmd.append(s["source"])
            t=time.time()
            try:
              r=subprocess.run(cmd,capture_output=True,text=True,timeout=132)
              s["process_return_code"]=r.returncode
              s["download_log_tail"]=(r.stdout+"\n"+r.stderr)[-4500:]
            except Exception as e:
              s["process_return_code"]=-1;s["download_log_tail"]=str(e)
            s["elapsed_sec"]=round(time.time()-t,2)
            files=sorted(base.parent.glob(base.name+".*"),key=lambda x:x.stat().st_size,reverse=True)
            candidates=[f for f in files if f.suffix.lower() in [".mp4",".mov",".mkv",".webm"] and f.stat().st_size>250000]
            if not candidates:
              s["qa"]="DOWNLOAD_FAILED"; continue
            f=candidates[0]
            probe=subprocess.run(["ffprobe","-v","error","-show_format","-show_streams","-of","json",str(f)],capture_output=True,text=True)
            try: j=json.loads(probe.stdout)
            except: j={}
            v=next((v for v in j.get("streams",[]) if v.get("codec_type")=="video"),{})
            s["file"]=f.name;s["size"]=f.stat().st_size
            s["sha256"]=hashlib.sha256(f.read_bytes()).hexdigest()
            s["video_info"]={k:v.get(k) for k in ["codec_name","width","height","r_frame_rate","avg_frame_rate"]}
            s["duration"]=j.get("format",{}).get("duration")
            if int(v.get("width",0))<1920 or int(v.get("height",0))<1080:
              s["qa"]="BELOW_1080P_PRIVATE_REVIEW_ONLY"
            else:
              s["qa"]="PROBE_PASS"
            try:
              r=subprocess.run(["timeout","70","ffmpeg","-hide_banner","-nostdin","-v","error","-xerror","-i",str(f),"-map","0:v:0","-f","null","-"],capture_output=True,text=True,timeout=80)
              s["full_decode"]="PASS" if r.returncode==0 else "FAIL: "+r.stderr[-1500:]
            except Exception as e:
              s["full_decode"]="FAIL "+str(e)
            dur=float(s.get("duration") or 0)
            times=[round(dur*k/9,2) for k in range(1,9)] if dur>10 else [round(k,2) for k in range(1,9)]
            s["contact_frame_times"]=times
            thumbs=[]
            for k,t in enumerate(times):
              dst=p/f"{s['id']}_frame_{k:02d}.jpg"
              subprocess.run(["ffmpeg","-nostdin","-v","error","-ss",str(t),"-i",str(f),"-frames:v","1","-vf","scale=480:-2", "-y",str(dst)],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=15)
              if dst.exists(): thumbs.append(dst)
            if thumbs:
              args=["ffmpeg","-nostdin","-v","error","-pattern_type","glob","-i",str(p/f"{s['id']}_frame_*.jpg"),"-vf","tile=4x2","-frames:v","1","-y",str(p/f"{s['id']}_CONTACT.jpg")]
              subprocess.run(args,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=25)
            for t in thumbs: t.unlink(missing_ok=True)
          (p/"ACQUISITION_REPORT.json").write_text(json.dumps({"project":"YUNEX Midnight Emerald","existing_france_fpvs":"DO NOT RE-DOWNLOAD, archive #92","review_only":True,"sources":sources},indent=2))
          (p/"README.txt").write_text("Original creator copyrighted work. Assets only for authenticated owner editorial inspection. No redistribution or publication approval implied. Review visual contacts, model, colour, and cinematic source timecodes before editing.\n")
          print(json.dumps({"source_status":sources},indent=2))
          PY
          python /tmp/acquire.py
      - name: Upload actual media, contact sheets and FFprobe report for owner evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YUNEX-DB12-PREMIUM-CANDIDATES-OWNER-REVIEW
          path: out/DB12_PREMIUM/
          retention-days: 2
          compression-level: 0
          if-no-files-found: warn

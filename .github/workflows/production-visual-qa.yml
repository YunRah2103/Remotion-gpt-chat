name: Production Suite - automated before/after visual review
on:
  workflow_dispatch:
    inputs:
      baseline_run:
        description: Run ID of older proof frames
        required: true
        type: string
      baseline_artifact:
        description: Exact older proof artifact name
        required: true
        type: string
      candidate_run:
        description: Run ID of newer proof frames
        required: true
        type: string
      candidate_artifact:
        description: Exact newer proof artifact name
        required: true
        type: string
      max_mean:
        description: Allowed average pixel delta; blank for report-only
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  visual-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: production/requirements-qa.txt
      - run: python -m pip install -r production/requirements-qa.txt
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.baseline_artifact }}
          run-id: ${{ inputs.baseline_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: out/baseline
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.candidate_artifact }}
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: out/candidate
      - name: Compare matching proof frame PNGs and generate image diffs
        env:
          MAX_MEAN: ${{ inputs.max_mean }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$MAX_MEAN" ]]; then
            python production/tools/visual_regression.py out/baseline out/candidate out/production/diff --max-mean "$MAX_MEAN"
          else
            python production/tools/visual_regression.py out/baseline out/candidate out/production/diff
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-visual-comparison-${{ github.run_id }}
          path: out/production/diff/
          retention-days: 30
          if-no-files-found: warn

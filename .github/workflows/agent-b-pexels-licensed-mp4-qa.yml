name: Agent B Stock Car Direct MP4 Contact Sheet QA
on:
  push:
    branches: [agent-b-stockcar-pexels-20261014]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pil
      - name: Acquire and decode original video
        run: python3 production/research/agent-b-pexels-20261014/acquire.py
      - name: Save source probes and contact sheets on isolated branch
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production/research/agent-b-pexels-20261014/
          if ! git diff --cached --quiet; then
            git commit -m "Agent B: source probes and stockcar contact sheets"
            git push
          fi
      - name: Upload original real video and QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-b-pexels-real-stockcar-and-qa
          path: |
            stockcar_media/*.mp4
            production/research/agent-b-pexels-20261014/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

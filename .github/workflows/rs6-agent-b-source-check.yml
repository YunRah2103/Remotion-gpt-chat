name: RS6 Agent B source access diagnostics
on:
  push:
    branches:
      - automotive-edits/rs6-no-mercy-001/b-creator-driving
    paths:
      - .github/workflows/rs6-agent-b-source-check.yml
  workflow_dispatch:
jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install acquisition diagnostic tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -q -U yt-dlp
      - name: Test Vimeo C8 RS6 sources without public media redistribution
        shell: bash
        run: |
          set +e
          mkdir -p reports
          for entry in '2n2|https://vimeo.com/803836362' 'FumeStudio|https://vimeo.com/761014676' 'NightShip|https://vimeo.com/712787364'; do
            label="${entry%%|*}"
            url="${entry#*|}"
            echo "SOURCE: $label $url" | tee "reports/$label.txt"
            yt-dlp --no-playlist --skip-download --dump-single-json --socket-timeout 12 --retries 1 "$url" >"reports/$label.json" 2>>"reports/$label.txt"
            code=$?
            echo "extract_exit=$code" | tee -a "reports/$label.txt"
            if [ "$code" -eq 0 ]; then
              python -c 'import sys,json; d=json.load(open(sys.argv[1])); print("title:",d.get("title"),"width:",d.get("width"),"height:",d.get("height"),"duration:",d.get("duration"),"uploader:",d.get("uploader"))' "reports/$label.json" | tee -a "reports/$label.txt"
            fi
          done
          curl --head --location --max-time 20 'https://audi-mediacenter.pl/film,48075,footage:-audi-rs-6-avant-performance-mythos-black-metallic-.html' > reports/audi-http.txt 2>&1
          echo "Audi source is Agent A territory; metadata-only test" >> reports/audi-http.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rs6-b-source-access-diagnostics
          path: reports/*.txt

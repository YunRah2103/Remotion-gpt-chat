name: RS6 Agent B real source and decode probe
on:
  push:
    branches:
      - automotive-edits/rs6-no-mercy-001/b-creator-driving
    paths:
      - .github/workflows/rs6-agent-b-source-check.yml
  workflow_dispatch:
jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -q -U yt-dlp
      - name: Probe real C8 RS6 creator candidates
        shell: bash
        run: |
          set +e
          mkdir -p reports private-test
          for entry in '2n2|https://vimeo.com/803836362' 'FumeStudio|https://vimeo.com/761014676'; do
            label="${entry%%|*}"
            url="${entry#*|}"
            echo "Source: $label $url" >"reports/$label.txt"
            yt-dlp --no-playlist --skip-download --print 'title=%(title)s id=%(id)s width=%(width)s height=%(height)s duration=%(duration)s license=%(license)s' --socket-timeout 12 --retries 1 "$url" >>"reports/$label.txt" 2>&1
            echo "metadata_exit=$?" >>"reports/$label.txt"
            # Extract up to 6 seconds to runner-private workspace for technical assessment.
            # NOT uploaded to a public artifact before source permission is established.
            yt-dlp --no-playlist --download-sections '*0-6' --force-keyframes-at-cuts --merge-output-format mp4 --format 'bestvideo[height>=1080]+bestaudio/best[height>=1080]/best' --socket-timeout 15 --retries 1 --output "private-test/$label.%(ext)s" "$url" >>"reports/$label.txt" 2>&1
            echo "download_exit=$?" >>"reports/$label.txt"
            file=$(find private-test -maxdepth 1 -type f -name "$label.*" | head -n 1)
            if [[ -n "$file" ]]; then
              ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height,r_frame_rate -of json "$file" >"reports/$label-ffprobe.json" 2>&1
              ffmpeg -v error -xerror -i "$file" -f null - >>"reports/$label.txt" 2>&1
              echo "full_decode_exit=$?" >>"reports/$label.txt"
              sha256sum "$file" >>"reports/$label.txt"
            fi
          done
      - name: Upload diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rs6-b-creator-source-diagnostics
          path: reports/

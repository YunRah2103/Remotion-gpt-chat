name: YUNEX RS6 G expand native Audi C8 moving shots
on:
  push:
    branches:
      - automotive-edits/rs6-no-mercy-001/g-director-rescue
    paths:
      - .github/workflows/rs6-g-audi-scout.yml
      - production/videos/rs6-no-mercy-001/g_audi_drive_scout.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-4k-scout:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Install video decoding and Python image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -q pillow
      - name: Scan actual original 4K motion over 12 targeted intervals
        run: |
          python production/videos/rs6-no-mercy-001/g_audi_drive_scout.py | tee rs6-g-audi-scout.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RS6_G_AUDI_NATIVE_SCOUT_CONTACTS
          path: |
            rs6-g-audi-motion-scout/
            rs6-g-audi-scout.log
          retention-days: 7
          if-no-files-found: warn

name: YUNEX RS6 B2 genuine Dailymotion performance-HD scout
on:
  push:
    branches:
      - automotive-edits/rs6-no-mercy-001/b2-youtube-driving
    paths:
      - .github/workflows/rs6-b2-performance-dm-qa.yml
      - production/videos/rs6-no-mercy-001/agent_b2_performance_dailymotion_qa.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cinematic-source-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install -q --upgrade yt-dlp curl_cffi pillow
      - name: Real Dailymotion original resolution and 5 decoded source windows
        timeout-minutes: 11
        run: python production/videos/rs6-no-mercy-001/agent_b2_performance_dailymotion_qa.py | tee b2-dm-run.log
      - name: Publish contacts and hashes without source media
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rs6-b2-dailymotion-actual-frame-quality
          path: |
            b2-dm-run.log
            b2-dm-original-QA/
          retention-days: 14
          if-no-files-found: warn

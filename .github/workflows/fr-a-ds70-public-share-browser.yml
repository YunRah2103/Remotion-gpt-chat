name: FR Legends A - Official Citroen DS 70th Press Share Browser QA
on:
  push:
    branches: [automotive-edits/french-icons-001/a-classics-footage]
    paths:
      - '.github/workflows/fr-a-ds70-public-share-browser.yml'
      - 'production/videos/french-icons-001/agent_a_ds70_playwright_public_share.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  genuine-citroen-ds-official-video-access:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium anonymous public shared-media browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Inspect two publicly published Stellantis official Citroen DS historical video shares
        run: python production/videos/french-icons-001/agent_a_ds70_playwright_public_share.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fr-legends-agent-a-stellantis-citroen-ds-public-file-browser-evidence
          path: out/fr-a-ds70-live-public-browser/
          retention-days: 7
          if-no-files-found: warn

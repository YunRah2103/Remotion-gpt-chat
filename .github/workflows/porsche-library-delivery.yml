name: Porsche - secure file delivery
on:
  push:
    branches: [automotive-edits/porsche-blender-reveal-001/master]
    paths: ['.github/workflows/porsche-library-delivery.yml']
permissions:
  contents: write
  actions: read
jobs:
  delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: automotive-edits/porsche-blender-reveal-001/master
      REPO: YunRah2103/Remotion-gpt-chat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Wait for the verified finished movie
        run: |
          mkdir -p out/final
          node - <<'JS'
          const fs=require('node:fs');
          (async()=>{
            for(let i=0;i<90;i++){
              const r=await fetch('https://api.github.com/repos/'+process.env.REPO+'/actions/runs/38187501960/artifacts',{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,'X-GitHub-Api-Version':'2022-11-28'}});
              if(!r.ok)throw Error('artifact listing '+r.status);
              const d=await r.json();
              const a=d.artifacts.find(x=>x.name==='YUNEX-PORSCHE-BLENDER-REVEAL-FINAL'&&!x.expired);
              if(a){fs.writeFileSync('out/artifact-id.txt',String(a.id));return}
              await new Promise(r=>setTimeout(r,10000));
            }
            throw Error('finished movie artifact not ready');
          })().catch(e=>{console.error(e.message);process.exit(1)});
          JS
          ARTIFACT_ID=$(cat out/artifact-id.txt)
          curl -fLsS --retry 2 -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/actions/artifacts/$ARTIFACT_ID/zip" -o out/final.zip
          unzip -q out/final.zip -d out/final
      - name: Publish only the public delivery key and verified movie metadata
        run: |
          node - <<'JS'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const dir='production/videos/porsche-blender-reveal-001/delivery';
          fs.mkdirSync(dir,{recursive:true});
          const movie='out/final/YUNEX_PORSCHE_BLENDER_REVEAL_1080P.mp4';
          const b=fs.readFileSync(movie);
          const qa=JSON.parse(fs.readFileSync('out/final/technical-qa.json'));
          const digest=crypto.createHash('sha256').update(b).digest('hex');
          if(digest!==qa.sha256||qa.status!=='TECHNICAL_PASS'||qa.frames!==479)throw Error('verified movie mismatch');
          const pair=crypto.generateKeyPairSync('rsa',{modulusLength:4096,publicExponent:65537});
          fs.writeFileSync('/tmp/porsche-delivery-private.pem',pair.privateKey.export({type:'pkcs8',format:'pem'}),{mode:0o600});
          fs.writeFileSync(dir+'/public.json',JSON.stringify({
            public_key:pair.publicKey.export({type:'spki',format:'pem'}),
            file_name:'YUNEX_PORSCHE_BLENDER_REVEAL_1080P.mp4',
            file_size_bytes:b.length,mime_type:'video/mp4',sha256:digest,
            render_run:38187501960
          },null,2));
          fs.copyFileSync('out/final/contact.jpg',dir+'/contact.jpg');
          fs.copyFileSync('out/final/technical-qa.json',dir+'/technical-qa.json');
          JS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add production/videos/porsche-blender-reveal-001/delivery/public.json production/videos/porsche-blender-reveal-001/delivery/contact.jpg production/videos/porsche-blender-reveal-001/delivery/technical-qa.json
          git commit -m 'delivery: publish public transfer key and verified final movie QA'
          git push origin HEAD:"$BRANCH"
      - name: Receive encrypted one-file upload plan and transfer the MP4
        run: |
          node - <<'JS'
          const fs=require('node:fs'),crypto=require('node:crypto');
          (async()=>{
            const url='https://api.github.com/repos/'+process.env.REPO+'/contents/production/videos/porsche-blender-reveal-001/delivery/transfer.enc.json?ref='+encodeURIComponent(process.env.BRANCH);
            let encrypted;
            for(let i=0;i<180;i++){
              const r=await fetch(url,{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,'X-GitHub-Api-Version':'2022-11-28'}});
              if(r.ok){const d=await r.json();encrypted=JSON.parse(Buffer.from(d.content,'base64').toString('utf8'));break}
              if(r.status!==404)throw Error('encrypted plan fetch '+r.status);
              await new Promise(r=>setTimeout(r,5000));
            }
            if(!encrypted)throw Error('encrypted upload plan not received');
            const key=fs.readFileSync('/tmp/porsche-delivery-private.pem');
            const decrypt=b=>crypto.privateDecrypt({key,padding:crypto.constants.RSA_PKCS1_OAEP_PADDING,oaepHash:'sha256'},Buffer.from(b,'base64'));
            if(decrypt(encrypted.probe).toString()!=='YUNEX-DELIVERY-PROBE')throw Error('encryption handshake mismatch');
            const plan=JSON.parse(Buffer.concat(encrypted.blocks.map(decrypt)).toString('utf8'));
            if(plan.file_name!=='YUNEX_PORSCHE_BLENDER_REVEAL_1080P.mp4'||plan.purpose!=='create_library_file')throw Error('upload purpose mismatch');
            console.log('::add-mask::'+plan.upload_url);
            for(const value of Object.values(plan.required_headers||{}))console.log('::add-mask::'+value);
            const data=fs.readFileSync('out/final/YUNEX_PORSCHE_BLENDER_REVEAL_1080P.mp4');
            if(plan.file_size_bytes!==data.length)throw Error('upload size mismatch');
            const r=await fetch(plan.upload_url,{method:plan.method||'PUT',headers:plan.required_headers||{},body:data});
            if(!r.ok)throw Error('upload status '+r.status);
            fs.rmSync('/tmp/porsche-delivery-private.pem');
            fs.writeFileSync('out/upload-status.json',JSON.stringify({status:'UPLOADED',file_name:plan.file_name,file_size_bytes:data.length,http_status:r.status},null,2));
            console.log('FILE_UPLOAD_PASS',r.status,data.length);
          })().catch(e=>{console.error(e.message.startsWith('upload status')?e.message:'secure delivery did not complete');process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: PORSCHE-FILE-UPLOAD-STATUS
          path: out/upload-status.json
          retention-days: 7

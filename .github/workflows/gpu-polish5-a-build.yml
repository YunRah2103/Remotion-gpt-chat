name: GPU POLISH05 Agent A - locked hardware, Blender macro proof
on:
  push:
    branches:
      - gpu-polish5/a-hardware
    paths:
      - 'gpu-decompose/polish5/hardware/**'
      - '.github/workflows/gpu-polish5-a-build.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  actual-3d-hardware:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout dedicated hardware branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify approved manager release source and download exact POLISH04 asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          d=json.load(open('gpu-decompose/polish4/manager/RELEASE_LOCK.json'))
          assert d['glbSha256']=='edeeca54f6e9bf26127ed91b3debe16bae47f9c58cd9db0bf760927a0869882e'
          assert (d['hardwareRunId'],d['hardwareArtifactId'])==(37840656656,11577811444)
          assert d['releaseApproved'] is True
          print('PINNED MANAGER-APPROVED SOURCE VERIFIED')
          PY
          curl -fLsS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/37840656656/artifacts?per_page=100" > /tmp/polish4_artifacts.json
          jq -e '.artifacts[] | select(.id==11577811444 and .name=="GPU-POLISH4-A-XFX-HARDWARE" and .expired==false)' /tmp/polish4_artifacts.json > /dev/null
      - name: Download approved exact immutable artifact, not latest on any branch
        uses: actions/download-artifact@v4
        with:
          name: GPU-POLISH4-A-XFX-HARDWARE
          run-id: 37840656656
          github-token: ${{ github.token }}
          path: /tmp/polish4-approved
      - name: Stage one model with checksum verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gpu-decompose/polish5/hardware/assets
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,shutil
          fs=list(Path('/tmp/polish4-approved').rglob('xfx_swift_rx9060xt_polish4.glb'))
          assert len(fs)==1,fs
          a=Path('gpu-decompose/polish5/hardware/assets')
          model=a/'polish4_locked.glb'
          shutil.copyfile(fs[0],model)
          digest=hashlib.sha256(model.read_bytes()).hexdigest()
          assert digest=='edeeca54f6e9bf26127ed91b3debe16bae47f9c58cd9db0bf760927a0869882e',digest
          print('APPROVED POLISH04 ASSET STAGED',model,'bytes',model.stat().st_size)
          PY
      - name: Install true Blender and validation applications
        shell: bash
        run: |
          set -euo pipefail
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y -qq blender ffmpeg python3-venv
          python3 -m venv /tmp/p5-venv
          /tmp/p5-venv/bin/python -m pip -q install --disable-pip-version-check \
            numpy==1.26.4 trimesh==4.11.1 Pillow==11.1.0
          blender -b -noaudio -t 3 --python-expr 'import bpy; print("BLENDER_NATIVE", bpy.app.version_string)'
      - name: True 3D hardware upgrade, 10 Cycles macro images, 18 animated frames, GLB and blend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gpu-decompose/polish5/hardware/assets
          blender -b -t 4 --python gpu-decompose/polish5/hardware/build_polish5.py \
            -- gpu-decompose/polish5/hardware/assets/polish4_locked.glb \
            2>&1 | tee gpu-decompose/polish5/hardware/assets/blender-build.log
          test -s gpu-decompose/polish5/hardware/assets/xfx_swift_rx9060xt_polish5.glb
          test -s gpu-decompose/polish5/hardware/assets/xfx_swift_rx9060xt_polish5.blend
      - name: Matched native POLISH04 model proof in identical saved studio and cameras
        run: |
          set -euo pipefail
          blender -b -t 4 --python gpu-decompose/polish5/hardware/render_baseline.py \
            2>&1 | tee gpu-decompose/polish5/hardware/assets/matched-baseline.log
      - name: Encode actual moving 3D Blender proof and independently validate exports and pixels
        run: |
          set -euo pipefail
          A=gpu-decompose/polish5/hardware/assets
          ffmpeg -y -v error -framerate 9 -i "$A/moving_frames/frame-%03d.png" \
            -frames:v 18 -c:v libx264 -pix_fmt yuv420p -crf 18 "$A/decomposition-proof-p5.mp4"
          ffmpeg -v error -xerror -i "$A/decomposition-proof-p5.mp4" -f null -
          /tmp/p5-venv/bin/python gpu-decompose/polish5/hardware/validate_polish5.py \
            | tee "$A/qa-console.txt"
          (cd "$A" && sha256sum -c SHA256SUMS.txt)
      - name: Upload verifiable native model asset, model source and full rendered proof bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GPU-POLISH5-A-LOCKED-HARDWARE
          path: gpu-decompose/polish5/hardware/assets/
          retention-days: 30
          if-no-files-found: error
      - name: Publish final actual source provenance and artifact ID to Agent B handoff
        env:
          GH_TOKEN: ${{ github.token }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs=require('fs');
            const base='gpu-decompose/polish5/hardware/assets/';
            const m=JSON.parse(fs.readFileSync(base+'asset-manifest.json','utf8'));
            const q=JSON.parse(fs.readFileSync(base+'validation-report.json','utf8'));
            const files=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{
              owner:context.repo.owner,repo:context.repo.repo,run_id:context.runId,per_page:100});
            const artifact=files.find(x=>x.name==='GPU-POLISH5-A-LOCKED-HARDWARE'&&!x.expired);
            if(!artifact)throw Error('No actual native hardware artifact published');
            if(q.result!=='TECHNICAL_QA_PASS_VISUAL_REVIEW_REQUIRED')throw Error('QA was not successful');
            const path='gpu-decompose/polish5/AGENT_A_HANDOFF.md';
            const material='New PBR metallic/roughness materials: satin graphite polymer, restrained rotor shading, machined nickel ferrules, anodized fin hems, matte solder mask, copper and Ni terminals. All 19 canonical GLB motion anchors remain uniquely named.';
            const report=[
              '# GPU POLISH05 - AGENT A COMPLETED HARDWARE HANDOFF',
              '',
              '**Status:** Native Blender generation / structural GLB / proof pixels / moving MP4 / matched baseline tests PASS; final Three.js visual approval belongs to Agent B.',
              '**Repository:** YunRah2103/Remotion-gpt-chat. **Branch:** gpu-polish5/a-hardware.',
              '**Locked approved starting commit:** e9a14f5d8e1b3bf805bb4916f9ce8bdc0155ff6a.',
              '**Exact native source commit SHA:** '+context.sha+'.',
              '**Verified workflow ID:** '+context.runId+'.',
              '**Genuine GitHub Actions artifact ID:** '+artifact.id+'.',
              '**Artifact name:** '+artifact.name+'.',
              '**Artifact URL:** https://github.com/'+context.repo.owner+'/'+context.repo.repo+'/actions/runs/'+context.runId+'/artifacts/'+artifact.id+'.',
              '**POLISH04 accepted GLB SHA256:** '+m.baselinePolish04GlbSha256+'.',
              '**NEW POLISH05 GLB SHA256:** '+m.glbSha256+'.',
              '**GLB filename:** xfx_swift_rx9060xt_polish5.glb.',
              '**GLB bytes:** '+m.glbBytes+'. **Native new component counts:** '+JSON.stringify(m.newModelGeometryByCategory)+'.',
              '**Output model dimensions in GLB scene units [X,Y,Z]:** '+JSON.stringify(q.measuredDimensionsSceneUnits)+'.',
              '',
              '## Exact source and proof paths',
              '- gpu-decompose/polish5/hardware/build_polish5.py: additive Blender model reconstruction upon manager-locked actual POLISH04 binary.',
              '- gpu-decompose/polish5/hardware/render_baseline.py: matched Blender historical model comparisons.',
              '- gpu-decompose/polish5/hardware/validate_polish5.py: GLB Y-up bounds/anchor/PBR checks, real pixel metrics, moving proof and SHA checks.',
              '- .github/workflows/gpu-polish5-a-build.yml: complete Actions production workflow.',
              '- In artifact: xfx_swift_rx9060xt_polish5.glb, xfx_swift_rx9060xt_polish5.blend, asset-manifest.json, validation-report.json, comparison_matched_P4_P5.png, decomposition-proof-p5.mp4, 10 numbered native Blender stills, moving_frames, SHA256SUMS.txt and logs.',
              '',
              '## Geometry and manufacturing revision',
              'The original fully modelled Swift 3-fan shroud, twenty-seven swept fan blades, eighty-one folded cooling fins, six heatpipes, cold plate, populated PCB, PCIe edge and vented backplate remain; they are NOT replaced with older variants.',
              'Enhanced stepped Swift shoulder fascia, open vents, rotor bearing/gasket/retention structure, stationary stator screws, fin folds/secondary crimps/stiffeners, pipe ferrules and clamps, coldplate retention, memory signal fanout, decoupling capacitors with conductive terminals, grouped VRM switch circuitry, multilayer-looking PCB traces/vias, GPU/VRAM package detail, connector contact rails, and machine-like backplate recesses.',
              material,
              '',
              '## Integration for Agent B',
              '1. Download the EXACT artifact ID '+artifact.id+' from run '+context.runId+'. Never guess a latest artifact.',
              '2. Verify SHA256(xfx_swift_rx9060xt_polish5.glb) == '+m.glbSha256+'.',
              '3. Stage it to a NEW POLISH05 runtime path; do not overwrite POLISH04 official release asset.',
              '4. Use glTF Y-up +X horizontal, +Y up, +Z fan-facing, 1 unit=100mm. The 19 original anchors are preserved exactly; new geometry is owned by existing moving parents.',
              '5. Reuse existing official deterministic POLISH04 450-frame 13-track motion, but independently check all real native Three.js moving frames for clipping, collision appearance, PBR and shot composition; conduct complete film QA separately.',
              '6. Real image proof and comparison images demonstrate changed pixels, but are NOT substitute for subjective cinematic review.',
              '',
              '## Authenticity and limitations',
              'Exact SKU RX-96TS316B7, dimensions 290 x 124 x 49mm, three fans, PCIe 8-pin and 2DP+1HDMI are verified in the official XFX product listing.',
              'Fan blade tooling, internal PCB routing and package placement, exact thermal flow, heatpipe counts, thermal pad layout and fastener patterns are illustrative and NOT verified factory CAD.',
              'Proof-only cutaway renders hide shroud and cooler to expose real underlying meshes; none of those hides are baked into GLB.',
              'Agent A did not alter src/**, camera, motion, final release workflow or YUNEX repository.',
              '',
              '**QA:** '+q.result+'. **Output sha:** '+m.glbSha256+'.',
              '**Workflow pushes this report as a follow-up metadata commit; thus the final branch tip differs from the exact model build SHA above.**',
              ''
            ].join('\n');
            let sha;
            try{
              const old=await github.rest.repos.getContent({owner:context.repo.owner,
                repo:context.repo.repo,path,ref:'gpu-polish5/a-hardware'});
              sha=old.data.sha;
            }catch(e){if(e.status!==404)throw e;}
            const updated=await github.rest.repos.createOrUpdateFileContents({
              owner:context.repo.owner,repo:context.repo.repo,path,branch:'gpu-polish5/a-hardware',
              sha,message:'POLISH05 A: verified native hardware GLB hash, evidence and artifact ID',
              content:Buffer.from(report).toString('base64')});
            core.info('POLISH05_A_FINAL_HANDOFF_SHA '+updated.data.commit.sha);

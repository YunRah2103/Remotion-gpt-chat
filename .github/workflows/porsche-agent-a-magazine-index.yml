name: Porsche Agent A - survey 911 Turbo eight generations historical film
on:
  push:
    branches:
      - automotive-edits/porsche-911-turbo-evolution-001/a-footage
    paths:
      - '.github/workflows/porsche-agent-a-magazine-index.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate-actual-911-magazine-video:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native quality tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install 'Pillow>=10,<12'
      - name: Identify actual source resolution and generate timecoded moving Turbo references
        run: |
          python production/videos/porsche-911-turbo-evolution-001/footage/index_official_sources.py \
            --media-id 202036 --step 10 --max-samples 40 \
            --out out/porsche-magazine-turbo-index
      - name: Store source metadata, all source-preview JPEGs and real contact sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Porsche-Agent-A-911-Magazine-8-Turbos-${{ github.run_id }}
          path: out/porsche-magazine-turbo-index/
          retention-days: 7
          if-no-files-found: warn

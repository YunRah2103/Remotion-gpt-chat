name: Production Studio - composition-aware PR review
on:
  pull_request:
    paths:
      - 'src/**'
      - 'production/**'
      - '.github/skills/**'
      - '.github/agents/**'
      - 'package.json'
      - 'package-lock.json'
permissions:
  contents: read
concurrency:
  group: composition-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  native-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: candidate/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install Pillow==11.3.0
          (cd baseline && npm ci --no-audit --no-fund)
          (cd candidate && npm ci --no-audit --no-fund && npm run check)
      - name: Choose actually affected compositions and render native proof
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mkdir -p out
          git -C candidate diff --name-only "$BASE_SHA" HEAD > out/changed.txt
          python candidate/production/tools/visual_plan.py \
            --baseline baseline --candidate candidate --changed out/changed.txt --out out/plan.json
          python candidate/production/tools/run_visual_review.py out/plan.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: composition-review-${{ github.run_id }}
          path: out/
          retention-days: 21
          if-no-files-found: warn

name: Porsche Agent A - inspect eight Turbo generations historical film
on:
  push:
    branches:
      - automotive-edits/porsche-911-turbo-evolution-001/a-footage
    paths:
      - '.github/workflows/porsche-agent-a-202036-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect-historic-turbo-film:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        page: ['01','02']
    timeout-minutes: 12
    steps:
      - name: Review actual native source gallery pixels
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE: ${{ matrix.page }}
        run: |
          set -euo pipefail
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/11673406465/zip > /tmp/index.zip
          NAME=$(unzip -Z1 /tmp/index.zip | grep "source-202036-page-${PAGE}.jpg" | head -1)
          test -n "$NAME"
          unzip -p /tmp/index.zip "$NAME" > /tmp/contact.jpg
          python - <<'PY'
          import base64
          from pathlib import Path
          d=base64.b64encode(Path('/tmp/contact.jpg').read_bytes()).decode()
          for i in range(0,len(d),4000):
             print('SOURCE_CONTACT_PART:'+d[i:i+4000])
          PY

name: Carbon Ceramic 001 - Polish04 pad chunk recovery

on:
  push:
    branches: ['automotive-brakes-001/f-render']
    paths:
      - '.github/workflows/carbon-ceramic-001-f-polish04-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-pad-frames-75-149:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 21c2b581b46251b0bd45028d32eb40b4341eeb2a
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve native renderer dependencies
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "21c2b581b46251b0bd45028d32eb40b4341eeb2a"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          npm ci --no-audit --no-fund
          if ! node -e "require('@rspack/binding')" >/dev/null 2>&1; then
            version="$(node -p "require('./node_modules/@rspack/binding/package.json').version")"
            npm install --no-save --no-package-lock --no-audit --no-fund "@rspack/binding-linux-x64-gnu@${version}"
          fi
          node -e "require('@rspack/binding')"
      - name: Render actual Polish04 pads in source film
        run: |
          set -euo pipefail
          mkdir -p out/polish04
          npx --no-install remotion render src/index.ts CarbonCeramic001 out/polish04/part-01.mp4 \
            --frames=75-149 --gl=swangle --codec=h264 --pixel-format=yuv420p --concurrency=1 --log=error
          python production/tools/quality.py video out/polish04/part-01.mp4 \
            --width 1080 --height 1920 --fps 30 --frames 75 \
            --report out/polish04/part-01-qa.json
          sha256sum out/polish04/part-01.mp4 > out/polish04/part-01.sha256
          echo "21c2b581b46251b0bd45028d32eb40b4341eeb2a" > out/polish04/E_SOURCE_SHA.txt
      - name: Publish real recovered chunk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carbon-brakes-polish04-pad-recovery-${{ github.run_id }}
          path: out/polish04/
          if-no-files-found: warn
          retention-days: 30

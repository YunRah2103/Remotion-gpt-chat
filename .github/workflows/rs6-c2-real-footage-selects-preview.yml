name: RS6 C2 genuine footage selects preview for editor
on:
  push:
    branches:
      - automotive-edits/rs6-no-mercy-001/c2-details-textures
    paths:
      - 'production/videos/rs6-no-mercy-001/agent-c2/c2_real_footage_selects_preview.py'
      - '.github/workflows/rs6-c2-real-footage-selects-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actual-real-c8-source-strip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: yunex-rs6-c2-details-review-20261013
    steps:
      - uses: actions/checkout@v4
      - name: Video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install pillow --break-system-packages
      - name: Pull actual owner-only draft RS6 MP4s
        run: |
          set -euo pipefail
          test "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = true
          mkdir -p c2_private_sources
          gh release download "$TAG" -D c2_private_sources --pattern '*.mp4'
          test "$(find c2_private_sources -type f -name '*.mp4' | wc -l)" -ge 11
      - name: Build real-footage-only silent 9-clip technical visual strip and decode
        run: |
          set -euo pipefail
          python production/videos/rs6-no-mercy-001/agent-c2/c2_real_footage_selects_preview.py | tee c2_selects_build.log
          test -s c2_real_selects_preview/YUNEX_RS6_C2_REAL_FOOTAGE_SELECTS.mp4
          test -s c2_real_selects_preview/C2_SELECTS_MANIFEST.json
      - name: Upload verified source-selection motion preview to owner-only draft
        run: |
          set -euo pipefail
          test "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = true
          gh release upload "$TAG" c2_real_selects_preview/YUNEX_RS6_C2_REAL_FOOTAGE_SELECTS.mp4 \
            c2_real_selects_preview/C2_SHOT_SELECTS_CONTACT.jpg \
            c2_real_selects_preview/C2_SELECTS_MANIFEST.json \
            c2_real_selects_preview/C2_SELECTS_SHA256SUMS.txt --clobber
          gh release view "$TAG" --json isDraft,assets --jq '{draft:.isDraft,filenames:[.assets[].name]}'
      - name: Upload independent text/visual evidence (exclude actual footage)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rs6-c2-source-selects-preview-qa-${{ github.run_id }}
          path: |
            c2_selects_build.log
            c2_real_selects_preview/C2_SHOT_SELECTS_CONTACT.jpg
            c2_real_selects_preview/C2_SELECTS_MANIFEST.json
            c2_real_selects_preview/C2_SELECTS_SHA256SUMS.txt
          retention-days: 10
          if-no-files-found: warn

name: YUNEX EP003 Remnant original footage elite selects V1
on:
  push:
    paths: ['.github/workflows/yunex-ep003-124-elite-selects-v1.yml']
  workflow_dispatch:
permissions:
  contents: write
  issues: read
jobs:
  selects:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - id: original
        uses: ./.github/actions/yunex-v4-import
        with:
          issue_number: '124'
          token: ${{ github.token }}
          destination: private/p1-original124
      - name: Source-selected playable MP4s, portrait motion tests, exact hashes and 6fps frames
        shell: bash
        env:
          VIDEO: ${{ steps.original.outputs.asset_path }}
          ORIG_SHA: ${{ steps.original.outputs.sha256 }}
        run: |
          set -euo pipefail
          mkdir -p selects/MP4 selects/9x16_MOTION_PREVIEWS selects/CONTACTS_WIDE selects/CONTACTS_9x16 selects/PROBES
          ffmpeg -hide_banner -loglevel error -xerror -i "$VIDEO" -f null -
          printf '%s\n' "$ORIG_SHA" > selects/SOURCE_SHA256.txt
          cat > selects/MANIFEST.tsv <<'EOF'
          file_id|source_start_s|duration_s|center_crop_x|description|primary_intent|rights_status
          P1_N01_BLUE_REAR_ROLL|55.20|3.25|656|Orange P1 traveling away under blue light with rear tracking|ending_alternative|unverified
          P1_N02_RIG_SIDE_TRACKING|58.50|2.90|656|Orange P1 rolling side-on in blue street lights|middle|unverified
          P1_N03_LOW_FRONT_ROLLING|61.50|3.20|656|Low front three-quarter P1 rolling close to camera|opening_alternative|unverified
          P1_N04_FRONT_SIDE_CONTINUITY|65.10|3.15|656|Orange P1 front three-quarter tracking, narrower subject|middle_alternative|unverified
          P1_N05_CROSS_STREET_MOVEMENT|79.70|2.60|656|Orange P1 crosses frame during wide night drive|middle_alternative|unverified
          P1_N06_REAR_SIDE_ESCAPE|87.70|3.45|656|Orange P1 side-rear tracking with rearward exit|ending_alternative|unverified
          P1_N07_STATIONARY_WING_DETAIL|32.25|1.70|656|Raised rear wing detail, filmed while P1 is stationary|technical_context_only_not_braking_proof|unverified
          EOF
          tail -n +2 selects/MANIFEST.tsv | while IFS='|' read -r file start dur x desc intent rights; do
             echo "::group::decode $file"
             ffmpeg -hide_banner -loglevel error -y -ss "$start" -i "$VIDEO" -t "$dur" -an -c:v libx264 -preset fast -crf 18 -pix_fmt yuv420p -movflags +faststart "selects/MP4/${file}.mp4"
             ffmpeg -hide_banner -loglevel error -y -i "selects/MP4/${file}.mp4" -vf "crop=608:1080:${x}:0,scale=540:960:flags=lanczos" -an -c:v libx264 -preset fast -crf 19 -pix_fmt yuv420p -movflags +faststart "selects/9x16_MOTION_PREVIEWS/${file}_9x16.mp4"
             ffmpeg -hide_banner -loglevel error -xerror -i "selects/MP4/${file}.mp4" -f null -
             ffmpeg -hide_banner -loglevel error -xerror -i "selects/9x16_MOTION_PREVIEWS/${file}_9x16.mp4" -f null -
             ffprobe -v error -show_streams -show_format -of json "selects/MP4/${file}.mp4" > "selects/PROBES/${file}.json"
             ffmpeg -hide_banner -loglevel error -y -i "selects/MP4/${file}.mp4" -vf 'fps=6,scale=320:180,tile=6x4:padding=3:margin=3' -frames:v 1 -update 1 "selects/CONTACTS_WIDE/${file}.jpg"
             ffmpeg -hide_banner -loglevel error -y -i "selects/9x16_MOTION_PREVIEWS/${file}_9x16.mp4" -vf 'fps=6,scale=150:267,tile=6x4:padding=3:margin=3' -frames:v 1 -update 1 "selects/CONTACTS_9x16/${file}.jpg"
             echo "::endgroup::"
          done
          find selects -name '*.mp4' -print0 | sort -z | xargs -0 sha256sum > selects/SHA256SUMS.txt
          printf '%s\n' 'Original filmmaker Remnant Media, original https://www.youtube.com/watch?v=z_U29fm1nkk' 'Original owner-only private GitHub S25 V4 source issue #124, asset ID 647820346, requested original starting at 0s.' 'All source starts in manifest are 0-based ORIGINAL VIDEO times, not edited timeline or 120s excerpt offset.' 'All original/preview videos fully decoded with FFmpeg -xerror; contact JPGs sampled 6fps, review frames for editorial quality.' 'No direct audio: video selects intentionally mute for incumbent documentary soundtrack.' 'Portrait previews 540x960 are UPSCALED 9:16 crops from landscape 1920x1080, NOT native 1080x1920 quality.' 'Static wing detail shot is specifically not evidence of wing moving during braking. None of these shots are proof of airbrake actuation during actual braking.' 'UNVERIFIED REUSE RIGHTS. For private owner-only video review, not public upload/monetization; obtain filmmaker permission/licensing before publication.' 'Owner editorial assessment still required before anyone claims quality meets cinematic standard.' > selects/README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: yunex-ep003-remnant124-7-mp4-selects-private-v1
          path: selects/
          retention-days: 2
          if-no-files-found: error

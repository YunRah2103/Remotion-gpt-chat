name: Production Suite - deploy public video gallery
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
  pages: write
  id-token: write
concurrency:
  group: production-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build existing film catalogue
        run: python3 production/tools/catalog.py --site out/production/site
      - name: Add production dashboard and interactive 3D viewer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 production/portal/build.py --site out/production/site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/production/site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

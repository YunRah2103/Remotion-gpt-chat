name: GT3 C Audio Pipeline QA
on:
  push:
    branches:
      - automotive-edits/gt3-nurburgring-multicar-001/c-audio-final
    paths:
      - 'production/videos/gt3-nurburgring-multicar-001/audio/**'
      - 'tests/test_gt3_sound_final.py'
      - '.github/workflows/gt3-c-audio-qa.yml'
  workflow_dispatch:
jobs:
  audio-code-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Unit test authentic audio gate and 316-frame math
        run: |
          python -m unittest discover -s tests -p 'test_gt3_sound_final.py' -v 2>&1 | tee gt3-c-unit-tests.txt
      - name: Save checked provisional media metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GT3-C-PRELIMINARY-AUDIO-QA-NOT-FINAL
          path: |
            gt3-c-unit-tests.txt
            production/videos/gt3-nurburgring-multicar-001/audio/AUDIO_PREP_STATUS.json
            production/videos/gt3-nurburgring-multicar-001/audio/beat_onset_candidates.json
          retention-days: 14

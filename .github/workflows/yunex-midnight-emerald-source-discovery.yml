name: YUNEX Midnight Emerald - Aston Press Asset Discovery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/yunex-midnight-emerald-source-discovery.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  press-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Aston official public press-kit download mechanics and available video
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re,base64,json,urllib.request,urllib.error
          base='https://media.astonmartin.com'
          targets={
            'green_article':base+'/aston-martin-db12-iridescent-emerald-south-of-france-b-roll/?lang=eng',
            'video_JS':base+'/wp-content/themes/epp-root/lib/modules/flux_data/assets/js/fluxVid.js?ver=1.0',
            'cart_JS':base+'/wp-content/themes/astonmartin-2024/lib/modules/attachment_cart/assets/js/fluxCart.js?ver=1.1.7',
            'green_media_rest':base+'/wp-json/wp/v2/media/75134',
            'green_download_vidid':base+'/download/?vidid=75134',
            'green_download_id':base+'/download/?id=75134',
            'green_download_videoid':base+'/download/?videoid=75134',
            'wordpress_video_post':base+'/?p=75134',
            'terms':base+'/terms-amp-conditions/',
          }
          for name,url in targets.items():
            print('TARGET',name,url,flush=True)
            try:
              headers={'User-Agent':'Mozilla/5.0','Accept':'*/*'}
              if 'download_' in name:headers['Range']='bytes=0-8191'
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=20) as rr:
                data=rr.read(75000)
                txt=data.decode('utf-8','replace')
                print('RESPONSE',rr.status,'CTYPE',rr.headers.get('Content-Type'),'SIZE_HEADER',rr.headers.get('Content-Length'),'DISPOSITION',rr.headers.get('Content-Disposition'),'PARTIAL_BYTES',len(data),'FINAL',rr.url,flush=True)
              if name.endswith('_JS'):
                for term in ['download','dl-vid','data-epp','ajax','action','href','get_vid','video']:
                  pos=[m.start() for m in re.finditer(term,txt,re.I)][:5]
                  for n in pos:
                    print('JS_MATCH',term,repr(txt[max(0,n-180):n+350])[:560],flush=True)
              elif name=='green_article':
                for term in ['75134','NzUxMzQ','flux_video-js-extra','video-content','video-gallery','video','download']:
                  for m in list(re.finditer(term,txt,re.I))[:3]:
                    print('HTML_MATCH',term,repr(txt[max(0,m.start()-200):m.end()+320])[:610],flush=True)
              elif name=='green_media_rest':print('MEDIA_REST_SNIP',repr(txt[:1500]))
              elif name=='terms':print('TERMS_MATCH',[(term,txt.lower().find(term.lower())) for term in ('copyright','permission','licen','editorial','media','redistribut')])
              elif 'download_' in name:print('DOWNLOAD_HEAD',repr(data[:100]))
            except Exception as e:print('TARGET_FAIL',name,type(e).__name__,str(e)[:230],flush=True)
          PY

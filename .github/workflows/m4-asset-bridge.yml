name: BMW M4 G82 licensed model bridge
on:
  push:
    branches: [experiments/bmw-m4-g82-blender-turntable]
    paths: ['.github/workflows/m4-asset-bridge.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Acquire CC BY 4.0 source BMW M4 GLB
        run: |
          set -euo pipefail
          mkdir -p deliver
          curl -fsSL --retry 3 --connect-timeout 30 --max-time 180 'https://raw.githubusercontent.com/coopercodes/bmwGLB/main/bmw_m4_competition_m_package.glb' -o deliver/BMW_M4_Competition_GLTF.glb
          echo '913ac951ba2645777c91393b86aed2def2433a807e57e626b203908aa474b8fb  deliver/BMW_M4_Competition_GLTF.glb' | sha256sum -c -
          printf '%s\n' 'BMW M4 Competition M Package by SRT Performance, licensed CC BY 4.0.' 'Original: https://sketchfab.com/3d-models/bmw-m4-competition-m-package-5c0a2dafb1ad408d9fc9eeef9aee531b' > deliver/ATTRIBUTION.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BMW-M4-G82-LICENSED-GLB
          path: deliver/
          retention-days: 30

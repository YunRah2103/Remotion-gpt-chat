name: YUNEX #96 encrypted editor transfer
on:
  push:
    paths:
      - .github/workflows/yunex-96-private-editor-transfer.yml
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  private-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Download verified owner-only footage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p transfer
          gh release download yunex-phone-v4-96 \
            --repo YunRah2103/Remotion-gpt-chat \
            --pattern 'yunex-v4-96.mp4' --dir transfer
          echo 'ad61316b9e47c95ebe179b520c091fc0d5a16229ead0f1f796e7b2445df51ae3  transfer/yunex-v4-96.mp4' | sha256sum -c -
          ffprobe -v error -show_entries stream=width,height,codec_name,color_primaries,color_transfer,color_space -of json transfer/yunex-v4-96.mp4 > transfer/probe.json
          ffmpeg -v error -xerror -i transfer/yunex-v4-96.mp4 -map 0:v:0 -f null -
      - name: Encrypt media for private editing handoff
        shell: bash
        run: |
          set -euo pipefail
          cat > transfer/pub.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAvn7HinqAAuoIxfmmUy9G
          cgq3yiedRaryIOKfASKV5KDaAJt4gUQp0SyeO94hv2AYoh6rl7rEibF7oTDClFL+
          E+w4AJZfrInnG3P6g5x3T/2vr2s1ABOABcMxcWxPvsc+nCRvq7EKR1ytex3QiLjw
          1GCHZLyOBJ1eOKLmfJMozuaJdj99x8943gzEV5jbJOa4dAyfurQcXi/FhKqXV71D
          ZfkITtdnTjdnSPRiyFfLEzrM1VSDKSkZkCWr2rbKjUH1VzY/wyGuteOj6aU3YLTS
          vtQJgujYnXQix3Dn/LK8aJ8ZaWy2iR81nYFRH19ICfman1C6f6H7x2FJueWk9d2G
          /QIDAQAB
          -----END PUBLIC KEY-----
          PEM
          openssl rand 32 > transfer/key.bin
          openssl rand 16 > transfer/iv.bin
          keyhex=$(od -An -tx1 -v transfer/key.bin | tr -d ' \n')
          ivhex=$(od -An -tx1 -v transfer/iv.bin | tr -d ' \n')
          openssl enc -aes-256-ctr -K "$keyhex" -iv "$ivhex" -in transfer/yunex-v4-96.mp4 -out transfer/footage.enc
          openssl pkeyutl -encrypt -pubin -inkey transfer/pub.pem -in transfer/key.bin -out transfer/key.enc
          rm -f transfer/yunex-v4-96.mp4 transfer/key.bin transfer/pub.pem
      - name: Save encrypted footage only, 1 day
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: yunex96-encrypted-editor
          path: |
            transfer/footage.enc
            transfer/key.enc
            transfer/iv.bin
            transfer/probe.json
          retention-days: 1
          if-no-files-found: error
      - name: Report temporary encrypted artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          gh issue comment 96 -R YunRah2103/Remotion-gpt-chat --body "YUNEX96_EDIT_TRANSFER_OK run_id=${{ github.run_id }} artifact_id=$ARTIFACT_ID — source stays encrypted; 1-day retention. No public original video."

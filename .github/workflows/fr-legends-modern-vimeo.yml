name: FR Legends B - Better Cinematic Vimeo Sources
on:
  push:
    branches:
      - automotive-edits/french-icons-001/b-modern-footage
    paths:
      - production/videos/french-icons-001/agent-b/vimeo_ingest.py
      - .github/workflows/fr-legends-modern-vimeo.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original-resolution video tooling
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check -U yt-dlp Pillow
          python -m py_compile production/videos/french-icons-001/agent-b/vimeo_ingest.py
      - name: Download and verify genuinely filmed native HQ sources
        run: python production/videos/french-icons-001/agent-b/vimeo_ingest.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FR-LEGENDS-001-AGENT-B-CINEMATIC-RESCUE
          path: out/fr-legends-modern-vimeo/
          retention-days: 14
          compression-level: 0
          if-no-files-found: warn

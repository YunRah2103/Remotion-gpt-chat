name: YUNEX P1 V10 Private Audio Sources
on:
  push:
    paths:
      - '.github/workflows/p1-v10-audio-source-rescue.yml'
  workflow_dispatch:
permissions:
  contents: write
  issues: read
jobs:
  rescue:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve two previously verified P1 source M4As from private draft-release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p p1-private-audio
          curl -fLsS --retry 3 --retry-delay 2 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${{ github.repository }}/releases/assets/639995280" -o p1-private-audio/yunex-v4-82.m4a
          curl -fLsS --retry 3 --retry-delay 2 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${{ github.repository }}/releases/assets/640033480" -o p1-private-audio/yunex-v4-85.m4a
          echo 'f6559fdb34b2455644f18f4bfa6490ecd2128fa8d3e0eb78b8c52beaeb66d2d9  p1-private-audio/yunex-v4-82.m4a' | sha256sum -c
          echo '585b0027f9081e30f14fae09714d87be1b4d10fe3fccc242115b6e2816bab805  p1-private-audio/yunex-v4-85.m4a' | sha256sum -c
          for f in p1-private-audio/*.m4a; do
            ffprobe -v error -show_entries stream=codec_name,sample_rate,channels:format=duration -of json "$f"
            ffmpeg -hide_banner -v error -xerror -i "$f" -f null -
          done
          (cd p1-private-audio && sha256sum *.m4a > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        id: proof
        with:
          name: yunex-p1-v10-verified-audio-private
          path: p1-private-audio/
          retention-days: 2
          if-no-files-found: error
      - name: Report verified private artifact reference
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.proof.outputs.artifact-id }}
        run: |
          gh issue comment 72 --repo "${{ github.repository }}" --body "P1 V10 PRIVATE AUDIO RECOVERED — source #82 + #85 SHA256/full decode PASS. Artifact ID: $ARTIFACT_ID; run https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}. For owner-only evaluation (publishing rights unverified)."

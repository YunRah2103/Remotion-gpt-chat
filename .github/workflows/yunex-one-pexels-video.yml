name: YUNEX ONE Pexels 4K car video
on:
  push:
    branches:
      - automotive-edits/yunex-hdr-cinematic-001/a-hdr-footage
    paths:
      - .github/workflows/yunex-one-pexels-video.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-one-video:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real video verification dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install Pillow
      - name: Download and fully decode ONE 4070x2160 moving night supercar film
        id: acquisition
        continue-on-error: true
        run: python production/videos/yunex-hdr-cinematic-001/agent-a/acquire_one_4k_supercar.py
      - name: Show actual metadata and source
        if: always()
        run: cat out/one-car/VERIFICATION.json || true
      - name: Upload ONE original unmodified MP4 only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YUNEX-ONE-ORIGINAL-4K-CAR-MP4
          path: out/one-car/YUNEX-ONE-CLIP-ORIGINAL-4K.mp4
          retention-days: 7
          compression-level: 0
          if-no-files-found: warn
      - name: Upload short QA evidence separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YUNEX-ONE-CAR-VISUAL-QA
          path: |
            out/one-car/VERIFICATION.json
            out/one-car/CONTACT-SHEET.jpg
          retention-days: 7
          compression-level: 0
      - name: Fail unless real 4K original was obtained
        if: always()
        env:
          RESULT: ${{ steps.acquisition.outcome }}
        run: test "$RESULT" = success

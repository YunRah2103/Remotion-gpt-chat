name: FR Legends A - Renault 5 Turbo Original Press HD
on:
  push:
    branches:
      - automotive-edits/french-icons-001/a-classics-footage
    paths:
      - '.github/workflows/fr-legends-a-renault-r5-hd.yml'
      - 'production/videos/french-icons-001/agent_a_renault_r5_heritage_acquire.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire-renault-heritage:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg and contact sheet dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install pillow
      - name: Verify real full-HD Renault 5 Turbo historic video
        run: python production/videos/french-icons-001/agent_a_renault_r5_heritage_acquire.py
      - name: Summarise file truth, not automatic identity claims
        run: |
          python - <<'PY'
          import json,pathlib,os
          d=json.loads(pathlib.Path('out/fr-agent-a-r5-press/manifest.json').read_text())
          lines=['## Classic Renault 5 Turbo 1080p acquisition research',
            f"- Downloaded native-HD videos: {sum(x['status'].startswith('HD_') for x in d)}"]
          lines += [f"- {x['id']}: {x['status']}, native {x.get('probe')}, {x.get('error','')[:140]}" for x in d]
          lines+=['- Gate A: BLOCKED until actual car-identity and shot diversity visually verified.']
          pathlib.Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(lines))
          print('\n'.join(lines))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fr-legends-a-verified-technical-r5-press-one-zip
          path: out/FR-LEGENDS-A-RENAULT-5-TURBO-HERITAGE-HQ-SOURCES.zip
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

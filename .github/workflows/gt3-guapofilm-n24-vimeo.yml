name: YUNEX GT3 GuapoFilm Real Nürburgring 24H Original Film
on:
  push:
    branches: [automotive-edits/gt3-nurburgring-multicar-001/a-footage]
    paths:
      - .github/workflows/gt3-guapofilm-n24-vimeo.yml
      - production/videos/gt3-nurburgring-multicar-001/agent-a/acquire_guapofilm_n24.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-filmmaker-media-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install video source extraction
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install -q -U "yt-dlp[default]" pillow
      - name: Download original N24 filmmaker 1080p source sample
        run: python production/videos/gt3-nurburgring-multicar-001/agent-a/acquire_guapofilm_n24.py
      - name: Upload actual native source clips and contact sheets if acquired
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GT3-GUAPOFILM-N24-REAL-NATIVE-RACE-SOURCE
          path: out/gt3-guapofilm-originals/
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

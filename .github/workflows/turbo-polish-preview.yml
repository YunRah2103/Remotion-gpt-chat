name: Turbo V3 polish - car and track visual proofs
on:
  push:
    branches: [fix/turbo-car-road-wheel-v3]
    paths:
      - '.github/workflows/turbo-polish-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup 
        run: |
          npm install --no-audit --no-fund
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Check TypeScript and composition
        run: |
          npm run check
          npx remotion compositions src/index.ts --gl=swangle | tee compositions.txt
          grep -q TurboDocumentary compositions.txt
      - name: Proof of actual geometry and stance at full resolution
        run: |
          mkdir -p out
          npx remotion still src/index.ts TurboDocumentary out/opening-frame48.png --frame=48 --gl=swangle
          npx remotion still src/index.ts TurboDocumentary out/hero-frame786.png --frame=786 --gl=swangle
      - name: Verify moving wheels on the road
        run: |
          npx remotion render src/index.ts TurboDocumentary out/opening-motion.mp4 --frames=42-53 --scale=0.5 --gl=swangle --codec=h264 --pixel-format=yuv420p --concurrency=2
          npx remotion render src/index.ts TurboDocumentary out/hero-motion.mp4 --frames=777-788 --scale=0.5 --gl=swangle --codec=h264 --pixel-format=yuv420p --concurrency=2
          for file in out/*-motion.mp4; do
            ffmpeg -hide_banner -loglevel error -xerror -i "$file" -f null -
            n=$(ffprobe -v error -show_entries stream=nb_frames -select_streams v:0 -of csv=p=0 "$file")
            test "$n" = 12
          done
      - uses: actions/upload-artifact@v4
        with:
          name: TURBO-V3-POLISHED-CAR-TRACK-NATIVE-PROOFS
          path: out/
          retention-days: 30
          if-no-files-found: error

name: Production Suite - generate reproducible npm lockfile
on:
  push:
    branches: [feature/automotive-production-suite-20261009]
    paths:
      - '.github/workflows/production-bootstrap.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve exact npm dependency graph once
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile to this feature branch
        if: github.ref == 'refs/heads/feature/automotive-production-suite-20261009'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already current'
          else
            git commit -m 'Lock exact npm dependency versions for cached reproducible CI'
            git push origin HEAD:feature/automotive-production-suite-20261009
          fi

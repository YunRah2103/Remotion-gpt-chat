name: Production - software WebGL rendering benchmark
on:
  workflow_dispatch:
    inputs:
      composition:
        description: Registered Remotion composition
        type: string
        required: true
        default: GpuDriveFilm
      frames:
        description: Frames per trial (2-90)
        type: string
        required: true
        default: '12'
      concurrency_levels:
        description: Unique comma-separated values from 1,2,3
        type: choice
        required: true
        options: ['1,2','1,2,3','1,3','1']
        default: '1,2,3'
      rounds:
        description: Runs for each concurrency (max 2)
        type: choice
        options: ['1','2']
        default: '1'
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Setup verified benchmark tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg time
          npm ci --no-audit --no-fund
          npm run check
      - name: Compare native scene render time and maximum memory
        env:
          COMP: ${{ inputs.composition }}
          FRAMES: ${{ inputs.frames }}
          LEVELS: ${{ inputs.concurrency_levels }}
          ROUNDS: ${{ inputs.rounds }}
        run: |
          set -euo pipefail
          python production/tools/benchmark.py --composition "$COMP" --frames "$FRAMES" \
            --levels "$LEVELS" --rounds "$ROUNDS" --output out/benchmark
          python - <<'PY'
          import json,os
          r=json.load(open('out/benchmark/benchmark.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('## Native renderer benchmark — '+r['composition']+'\n\n')
              out.write('| Threads | Median seconds | Peak RSS (KiB) |\n|---|---:|---:|\n')
              for x in r['comparison']:
                  out.write(f"| {x['concurrency']} | {x['medianWallSeconds']} | {x['peakRssKilobytes']} |\n")
              out.write('\nCPU/software WebGL only; use your own job runner for reproducibility.\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: production-benchmark-${{ github.run_id }}
          path: out/benchmark/
          retention-days: 21
          if-no-files-found: error

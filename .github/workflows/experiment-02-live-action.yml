name: Experiment 02 - Licensed Live Action Motion Graphics
on:
  push:
    branches:
      - experiment/02-live-action-motion-graphics-20261026
    paths:
      - 'experiments/02-live-action-motion-graphics/**'
      - '.github/workflows/experiment-02-live-action.yml'
  pull_request:
    paths:
      - 'experiments/02-live-action-motion-graphics/**'
      - '.github/workflows/experiment-02-live-action.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: FFmpeg and Python composition tools
        run: |
          ffmpeg -version | head -n 1
          python -m pip install -q --only-binary=:all: opencv-python-headless==4.10.0.84 pillow numpy
      - name: Download licensed real footage, design, render and decode-QA
        run: |
          python experiments/02-live-action-motion-graphics/build.py
      - name: Upload verified MP4, contact sheet, and rights documentation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp02-live-action-1080x1920
          path: experiments/02-live-action-motion-graphics/output/
          retention-days: 15
          if-no-files-found: warn
          compression-level: 0

name: FR Legends B - Final Clean Premium Selection
on:
  push:
    branches:
      - automotive-edits/french-icons-001/b-modern-footage
    paths:
      - production/videos/french-icons-001/agent-b/select_final.py
      - .github/workflows/fr-legends-modern-clean-final.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  final-clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet Pillow
          python -m py_compile production/videos/french-icons-001/agent-b/select_final.py
      - name: Retrieve actual 18 candidate original quality decoded cut files
        run: |
          mkdir -p out/curated-input
          gh run download 38150398980 --repo "${{ github.repository }}" -n FR-LEGENDS-001-B-CURATED-PREMIUM-DRIVING -D out/curated-input
          test -s out/curated-input/manifest.json
      - name: Reject weak clips, trim interior filler, report manually chosen source and QA proof
        run: python production/videos/french-icons-001/agent-b/select_final.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FR-LEGENDS-001-AGENT-B-FINAL-VISUAL-QA
          path: out/fr-legends-agent-b-final-approved/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

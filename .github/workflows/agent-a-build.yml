name: GPU Agent A - native 3D asset build
on:
  push:
    branches: ['gpu-decompose/a-model']
    paths:
      - 'gpu-decompose/agent-a/**'
      - '.github/workflows/agent-a-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-assets:
    name: Blender + OpenSCAD + PyBullet + Godot native proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real mechanical and 3D tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender openscad ffmpeg unzip
          python -m venv /tmp/gpu-venv
          /tmp/gpu-venv/bin/python -m pip install --disable-pip-version-check numpy==1.26.4 pybullet==3.2.7
          curl -fLsS --retry 3 --retry-delay 4 'https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip' -o /tmp/godot.zip
          mkdir /tmp/godot-bin
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.4.1-stable_linux.x86_64
          blender --version | head -n 2
          openscad --version
      - name: Generate CAD physical hub STL and deterministic timeline
        run: |
          set -euo pipefail
          mkdir -p gpu-decompose/assets
          openscad -o gpu-decompose/agent-a/fan_hub.stl gpu-decompose/agent-a/mechanical.scad |& tee gpu-decompose/assets/openscad.log
          test -s gpu-decompose/agent-a/fan_hub.stl
          python gpu-decompose/agent-a/generate_motion.py
          python gpu-decompose/agent-a/test_motion.py
      - name: Real PyBullet collision proxy validation
        run: |
          set -euo pipefail
          /tmp/gpu-venv/bin/python gpu-decompose/agent-a/clearance.py |& tee gpu-decompose/assets/pybullet.log
          test -s gpu-decompose/assets/clearance.json
      - name: Headless Godot native 3D hierarchy playback
        run: |
          set -euo pipefail
          cp gpu-decompose/assets/decomposition.json gpu-decompose/agent-a/godot/decomposition.json
          /tmp/godot-bin/Godot_v4.4.1-stable_linux.x86_64 --headless --path gpu-decompose/agent-a/godot --script res://previs.gd |& tee gpu-decompose/assets/godot.log
          test -s gpu-decompose/agent-a/godot/godot-proof.json
          cp gpu-decompose/agent-a/godot/godot-proof.json gpu-decompose/assets/godot-proof.json
      - name: Real Blender 3D modelling, GLB export, two stills and moving frames
        run: |
          set -euo pipefail
          blender -b -t 3 --python gpu-decompose/agent-a/blender_generate.py |& tee gpu-decompose/assets/blender.log
          test -s gpu-decompose/assets/xfx_swift_rx9060xt_triple16.glb
          test -s gpu-decompose/assets/assembled.png
          test -s gpu-decompose/assets/exploded.png
      - name: Encode real motion proof and assert GLB structure
        run: |
          set -euo pipefail
          ffmpeg -y -hide_banner -loglevel error -framerate 10 -pattern_type glob -i 'gpu-decompose/assets/moving_frames/*.png' -c:v libx264 -pix_fmt yuv420p -crf 20 gpu-decompose/assets/decomposition-proof.mp4
          ffmpeg -v error -xerror -i gpu-decompose/assets/decomposition-proof.mp4 -f null -
          python gpu-decompose/agent-a/validate_assets.py | tee gpu-decompose/assets/glb-audit.log
          (cd gpu-decompose/assets && sha256sum *.glb *.json > SHA256SUMS.txt)
      - name: Publish model, native proof media and exact manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GPU-AGENT-A-XFX-SWIFT-3D
          path: |
            gpu-decompose/assets/
            gpu-decompose/agent-a/fan_hub.stl
          retention-days: 30
          if-no-files-found: warn

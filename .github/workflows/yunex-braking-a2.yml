name: YUNEX Braking A2 - Native Physics Proof
on:
  pull_request:
    paths:
      - 'src/yunex/braking200/physics/**'
      - '.github/workflows/yunex-braking-a2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-a2:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies and FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          npm ci --no-audit --no-fund
      - name: Typecheck and verify physical invariants
        run: |
          npm run check
          node --experimental-strip-types --test src/yunex/braking200/physics/simulation.test.mjs
      - name: Native portrait tyre and ABS moving proof
        run: |
          mkdir -p out/a2-physics
          npx remotion render src/yunex/braking200/physics/entry.tsx BrakingPhysicsMacro out/a2-physics/abs-wheel-macro.mp4 --frames=0-144 --scale=0.5 --gl=swangle --codec=h264 --pixel-format=yuv420p --concurrency=2
      - name: Native portrait kit grand-tourer and track proof
        run: |
          npx remotion render src/yunex/braking200/physics/entry.tsx BrakingPhysicsContext out/a2-physics/grand-tourer-track.mp4 --frames=0-119 --scale=0.5 --gl=swangle --codec=h264 --pixel-format=yuv420p --concurrency=2
      - name: Full stream decode, samples and moving frame integrity
        shell: bash
        run: |
          set -euo pipefail
          for n in abs-wheel-macro grand-tourer-track; do
            f="out/a2-physics/$n.mp4"
            ffprobe -v error -show_format -show_streams "$f" > "out/a2-physics/$n.ffprobe.txt"
            dims=$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0:s=x "$f")
            test "$dims" = "540x960" || { echo "Incorrect 9:16 preview $dims"; exit 1; }
            ffmpeg -nostdin -v error -xerror -i "$f" -f null - 2> "out/a2-physics/$n.decode.log"
            ffmpeg -nostdin -v error -i "$f" -vf 'select=eq(n\,8)+eq(n\,42)+eq(n\,92)' -vsync 0 "out/a2-physics/$n-sample-%02d.png"
            test "$(find out/a2-physics -name "$n-sample-*.png" | wc -l)" -eq 3
            ffmpeg -nostdin -v error -i "$f" -f framemd5 "out/a2-physics/$n.framemd5"
            test "$(grep -v '^#' "out/a2-physics/$n.framemd5" | awk -F, '{print $6}' | sort -u | wc -l)" -ge 12 || { echo "Insufficient moving frame differences"; exit 1; }
          done
          sha256sum out/a2-physics/*.mp4 > out/a2-physics/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: YUNEX-A2-PHYSICS-MP4-${{ github.run_id }}
          path: out/a2-physics/
          retention-days: 30
          if-no-files-found: warn

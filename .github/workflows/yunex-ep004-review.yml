name: YUNEX EP004 contract and native specialist review

on:
  pull_request:
    branches:
      - production/yunex-ep004-base
    paths:
      - 'production/yunex/f1_sparks_ep004/**'
      - '.github/workflows/yunex-ep004-review.yml'
  workflow_dispatch:
    inputs:
      render_preview:
        description: 'Render one integrated EP004 preview if the manager entry is present'
        required: false
        type: boolean
        default: false
      composition:
        description: 'Composition ID from manager integrated episode entry'
        required: false
        type: string
        default: 'EP004MotionReview'

permissions:
  contents: read

jobs:
  validate:
    name: EP004 contract and repository TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --experimental-strip-types --test production/yunex/f1_sparks_ep004/tests/shared/*.test.mjs
      - name: Validate shared episode isolation
        shell: bash
        run: |
          test -s production/yunex/f1_sparks_ep004/PRODUCTION_CONTRACT.md
          test -s production/yunex/f1_sparks_ep004/shared/contract.ts
          test -s production/yunex/f1_sparks_ep004/HANDOFF.md
          test -s production/yunex/f1_sparks_ep004/LAUNCH_PROMPTS.md


  editor-readiness:
    name: EP004 editor-specific TypeScript and timing/native-QA unit tests
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/ep004-06-editor' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check exact EP004 editor-local TypeScript
        run: npx tsc -p production/yunex/f1_sparks_ep004/editor/tsconfig.json
      - name: Run original VO frame timing, captions, full video QA unit tests
        run: node --experimental-strip-types --test production/yunex/f1_sparks_ep004/tests/agent-6/*.test.mjs

  specialist-native:
    name: Native EP004 specialist moving MP4s and frame proof
    if: ${{ github.event_name == 'pull_request' && (github.head_ref == 'agent/ep004-01-mechanics' || github.head_ref == 'agent/ep004-02-physics' || github.head_ref == 'agent/ep004-03-cinema' || github.head_ref == 'agent/ep004-04-look' || github.head_ref == 'agent/ep004-05-story') }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Resolve specialist-owned isolated Remotion compositions
        id: setup
        shell: bash
        env:
          EP004_HEAD: ${{ github.head_ref }}
        run: |
          case "$EP004_HEAD" in
            agent/ep004-01-mechanics)
              echo "agent=1" >> "$GITHUB_OUTPUT"
              echo "entry=production/yunex/f1_sparks_ep004/previews/agent-1/entry.tsx" >> "$GITHUB_OUTPUT"
              echo "a=EP004A1Underfloor" >> "$GITHUB_OUTPUT"
              echo "b=EP004A1CarContext" >> "$GITHUB_OUTPUT"
              echo "frames_a=180" >> "$GITHUB_OUTPUT"
              echo "frames_b=240" >> "$GITHUB_OUTPUT"
              ;;
            agent/ep004-02-physics)
              echo "agent=2" >> "$GITHUB_OUTPUT"
              echo "entry=production/yunex/f1_sparks_ep004/previews/agent-2/entry.tsx" >> "$GITHUB_OUTPUT"
              echo "a=EP004A2Technical" >> "$GITHUB_OUTPUT"
              echo "b=EP004A2Portrait" >> "$GITHUB_OUTPUT"
              echo "frames_a=150" >> "$GITHUB_OUTPUT"
              echo "frames_b=210" >> "$GITHUB_OUTPUT"
              ;;
            agent/ep004-03-cinema)
              echo "agent=3" >> "$GITHUB_OUTPUT"
              echo "entry=production/yunex/f1_sparks_ep004/previews/agent-3/entry.tsx" >> "$GITHUB_OUTPUT"
              echo "a=EP004Agent3Hook" >> "$GITHUB_OUTPUT"
              echo "b=EP004Agent3Sequence" >> "$GITHUB_OUTPUT"
              echo "frames_a=150" >> "$GITHUB_OUTPUT"
              echo "frames_b=330" >> "$GITHUB_OUTPUT"
              ;;
            agent/ep004-04-look)
              echo "agent=4" >> "$GITHUB_OUTPUT"
              echo "entry=production/yunex/f1_sparks_ep004/look/preview-entry.tsx" >> "$GITHUB_OUTPUT"
              echo "a=EP004Agent4Trackside" >> "$GITHUB_OUTPUT"
              echo "b=EP004Agent4RaceFollow" >> "$GITHUB_OUTPUT"
              echo "frames_a=150" >> "$GITHUB_OUTPUT"
              echo "frames_b=210" >> "$GITHUB_OUTPUT"
              ;;
            agent/ep004-05-story)
              echo "agent=5" >> "$GITHUB_OUTPUT"
              echo "entry=production/yunex/f1_sparks_ep004/story/preview-entry.tsx" >> "$GITHUB_OUTPUT"
              echo "a=EP004Agent5Hook" >> "$GITHUB_OUTPUT"
              echo "b=EP004Agent5Middle" >> "$GITHUB_OUTPUT"
              echo "frames_a=165" >> "$GITHUB_OUTPUT"
              echo "frames_b=330" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "No specialist preview configuration for $EP004_HEAD"; exit 1;;
          esac
      - name: Specialist tests (not just existing smoke checks)
        shell: bash
        env:
          NUM: ${{ steps.setup.outputs.agent }}
        run: |
          shopt -s nullglob
          tests=(production/yunex/f1_sparks_ep004/tests/agent-"$NUM"/*.test.mjs)
          if (( ${#tests[@]} < 1 )); then echo "Missing Agent $NUM unit tests"; exit 1; fi
          node --experimental-strip-types --test "${tests[@]}"
      - name: Native 1080x1920 30fps render of BOTH compositions
        shell: bash
        env:
          ENTRY: ${{ steps.setup.outputs.entry }}
          A: ${{ steps.setup.outputs.a }}
          B: ${{ steps.setup.outputs.b }}
        run: |
          test -s "$ENTRY"
          mkdir -p out/ep004-native
          npx remotion render "$ENTRY" "$A" out/ep004-native/technical.mp4 --gl=swangle --codec=h264 --pixel-format=yuv420p --log=error
          npx remotion render "$ENTRY" "$B" out/ep004-native/context.mp4 --gl=swangle --codec=h264 --pixel-format=yuv420p --log=error
      - name: Install actual FFmpeg and FFprobe for native media QA
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Verify REAL time-evolving full MP4 video and capture screenshots
        shell: bash
        env:
          FRAMES_A: ${{ steps.setup.outputs.frames_a }}
          FRAMES_B: ${{ steps.setup.outputs.frames_b }}
        run: |
          python3 - <<'PY'
          import subprocess,json,os
          for label,count in (('technical',int(os.environ['FRAMES_A'])),('context',int(os.environ['FRAMES_B']))):
            path=f'out/ep004-native/{label}.mp4'
            meta=json.loads(subprocess.check_output(['ffprobe','-v','error','-select_streams','v:0','-count_frames','-show_entries','stream=width,height,avg_frame_rate,nb_read_frames','-of','json',path]))['streams'][0]
            assert (meta['width'],meta['height']) == (1080,1920),(label,meta)
            assert meta['avg_frame_rate'] == '30/1',(label,meta)
            assert int(meta['nb_read_frames'])==count,(label,meta)
            subprocess.run(['ffmpeg','-v','error','-xerror','-i',path,'-f','null','-'],check=True)
            screenshots=[]
            for frame in (0,count//2,count-1):
              out=f'out/ep004-native/{label}-frame-{frame}.jpg'
              subprocess.run(['ffmpeg','-v','error','-y','-i',path,'-vf',f'select=eq(n\\,{frame})','-vsync','vfr','-frames:v','1',out],check=True)
              assert os.path.getsize(out)>0,out
              screenshots.append(out)
            frames=subprocess.check_output(['ffmpeg','-v','error','-i',path,'-map','0:v:0','-vf','fps=1','-f','framemd5','-'])
            hashes=set(line.split(',')[-1].strip() for line in frames.decode().splitlines() if line and not line.startswith('#'))
            assert len(hashes)>=2,f'{label}: video has no measured time-evolving frames'
            open(f'out/ep004-native/{label}-probe.json','w').write(json.dumps(meta,indent=2))
            print(label,meta,'unique sampled frame hashes:',len(hashes),'screenshots:',screenshots)
          PY
      - name: Upload native moving clips and review evidence even if validation fails
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: YUNEX-EP004-Agent-${{ steps.setup.outputs.agent }}-Native-MP4-Review
          path: out/ep004-native
          retention-days: 30
          if-no-files-found: warn

  native-preview:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.render_preview }}
    needs: validate
    name: Optional integrated short EP004 native moving master preview
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Require real manager-integrated episode entry
        run: test -s production/yunex/f1_sparks_ep004/entry.tsx
      - name: Render moving portrait excerpt
        env:
          EP004_COMP: ${{ inputs.composition }}
        run: |
          mkdir -p out/ep004
          npx remotion render production/yunex/f1_sparks_ep004/entry.tsx "$EP004_COMP" out/ep004/EP004-5s-native.mp4 --frames=0-149 --gl=swangle --codec=h264 --pixel-format=yuv420p --log=error
          ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=width,height,avg_frame_rate,nb_read_frames -of json out/ep004/EP004-5s-native.mp4 > out/ep004/probe.json
          ffmpeg -v error -xerror -i out/ep004/EP004-5s-native.mp4 -f null -
      - uses: actions/upload-artifact@v4
        with:
          name: YUNEX-EP004-Integrated-Moving-Review
          path: out/ep004
          retention-days: 30
          if-no-files-found: error

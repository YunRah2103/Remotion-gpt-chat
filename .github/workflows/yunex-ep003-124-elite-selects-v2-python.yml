name: YUNEX EP003 Remnant original footage selects V2 Python verified
on:
  push:
    paths:
      - '.github/workflows/yunex-ep003-124-elite-selects-v2-python.yml'
  workflow_dispatch:
permissions:
  contents: write
  issues: read
jobs:
  selects:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - id: original
        uses: ./.github/actions/yunex-v4-import
        with:
          issue_number: '124'
          token: ${{ github.token }}
          destination: private/p1-source124
      - name: Build seven real video selections with stable filenames and checksums
        shell: bash
        env:
          VIDEO: ${{ steps.original.outputs.asset_path }}
        run: |
          set -euo pipefail
          cat > /tmp/selects.py <<'PY'
          import os, subprocess, hashlib, json, pathlib
          src = os.environ["VIDEO"]
          base = pathlib.Path("v2")
          for kind in ("MP4_ORIGINAL_FRAMING","PORTRAIT_MOTION_9x16","CONTACTS_WIDE","CONTACTS_9x16","PROBES"):
              (base/kind).mkdir(parents=True, exist_ok=True)
          shots = [
              ("P1_N01_BLUE_REAR_ROLL",55.20,3.25,"Orange P1 driving away under blue lighting","ending_alternative"),
              ("P1_N02_RIG_SIDE_TRACKING",58.50,2.90,"Orange P1 rolling side-on with blue street reflections","middle"),
              ("P1_N03_LOW_FRONT_ROLLING",61.50,3.20,"Low aggressive orange P1 front three-quarter rolling","opening"),
              ("P1_N04_FRONT_SIDE_CONTINUITY",65.10,3.15,"Orange P1 longer front three-quarter motion","middle_alternative"),
              ("P1_N05_CROSS_STREET_MOVEMENT",79.70,2.60,"P1 crosses frame at night; other cars nearby","middle_alternative"),
              ("P1_N06_REAR_SIDE_ESCAPE",87.70,3.45,"Orange P1 three-quarter side to rear rolling exit","ending"),
              ("P1_N07_STATIONARY_WING_DETAIL",32.25,1.70,"Stationary P1 close-up raised rear wing, NO braking movement","technical_context_not_actuation")
          ]
          def call(args):
              subprocess.run(args, check=True, stdout=subprocess.DEVNULL)
          def sha(path):
              h=hashlib.sha256()
              with open(path,"rb") as f:
                  for block in iter(lambda:f.read(1048576),b""):h.update(block)
              return h.hexdigest()
          manifest=[]
          for name,start,duration,description,intent in shots:
              wide=base/"MP4_ORIGINAL_FRAMING"/(name+".mp4")
              portrait=base/"PORTRAIT_MOTION_9x16"/(name+"_9x16.mp4")
              srcargs=["ffmpeg","-hide_banner","-loglevel","error","-y"]
              call(srcargs+["-ss",str(start),"-i",src,"-t",str(duration),"-an","-c:v","libx264","-preset","fast","-crf","18","-pix_fmt","yuv420p","-movflags","+faststart",str(wide)])
              call(srcargs+["-i",str(wide),"-vf","crop=608:1080:656:0,scale=540:960:flags=lanczos","-an","-c:v","libx264","-preset","fast","-crf","19","-pix_fmt","yuv420p","-movflags","+faststart",str(portrait)])
              for p in (wide,portrait):
                  call(["ffmpeg","-hide_banner","-loglevel","error","-xerror","-i",str(p),"-f","null","-"])
              with open(base/"PROBES"/(name+".json"),"w") as f:
                  probe=subprocess.check_output(["ffprobe","-v","error","-show_streams","-show_format","-of","json",str(wide)],text=True)
                  f.write(probe)
              call(srcargs+["-i",str(wide),"-vf","fps=6,scale=320:180,tile=6x4:padding=3:margin=3","-frames:v","1","-update","1",str(base/"CONTACTS_WIDE"/(name+".jpg"))])
              call(srcargs+["-i",str(portrait),"-vf","fps=6,scale=150:267,tile=6x4:padding=3:margin=3","-frames:v","1","-update","1",str(base/"CONTACTS_9x16"/(name+".jpg"))])
              manifest.append(dict(name=name,start_original_s=start,duration_requested_s=duration,description=description,use=intent,source_issue=124,original_file=str(wide),original_file_sha256=sha(wide),portrait_preview=str(portrait),portrait_sha256=sha(portrait),rights="unverified",portrait_native=False))
          with open(base/"SELECTS.json","w") as f: json.dump(manifest,f,indent=2)
          with open(base/"SHA256SUMS.txt","w") as f:
              for s in manifest:
                  for key,hash_key in [("original_file","original_file_sha256"),("portrait_preview","portrait_sha256")]:
                      f.write(s[hash_key]+"  "+s[key]+"\n")
          orig=sha(src)
          with open(base/"README.md","w") as f:
              f.write("# YUNEX P1 EP003 — Remnant Media seven-shot owner-only private review\n\n")
              f.write("Original filmmaker: Remnant Media. Source: https://www.youtube.com/watch?v=z_U29fm1nkk ; full 0–120s S25 V4 download issue #124. Original SHA256 "+orig+"\n\n")
              f.write("All 14 MP4s have passed FFmpeg -xerror full decode and per-file SHA-256 was computed; actual visual QC still required. Original framing 1920x1080 MP4 excerpts plus 540x960 9:16 upscaled crop PREVIEWS, not native vertical.\n\n")
              f.write("Source timestamp ranges and true filename hashes in SELECTS.json. 6fps contact grids for each candidate. No documentary soundtrack or final master edited. Source clips are muted for review.\n\n")
              f.write("IMPORTANT: Rights to distribute/reuse third-party footage are UNVERIFIED. PRIVATE OWNER REVIEW ONLY; must obtain filmmaker licensing before public video publishing. Stationary wing detail is NOT evidence of wing pitch moving during actual braking.\n\n")
              for s in manifest:
                  f.write("- "+s["name"]+" "+str(s["start_original_s"])+"–"+str(round(s["start_original_s"]+s["duration_requested_s"],2))+"s: "+s["description"]+"\n")
          print("WROTE",len(manifest),"VERIFIED SHOTS", len(list((base/"MP4_ORIGINAL_FRAMING").glob("*.mp4"))),len(list((base/"PORTRAIT_MOTION_9x16").glob("*.mp4"))))
          if len(manifest)!=7 or len(list((base/"MP4_ORIGINAL_FRAMING").glob("*.mp4")))!=7 or len(list((base/"PORTRAIT_MOTION_9x16").glob("*.mp4")))!=7:raise ValueError("Seven-source/preview files not present")
          PY
          python3 /tmp/selects.py
          cd v2
          sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: yunex-ep003-remnant124-seven-sourced-v2-private
          path: v2/
          retention-days: 2
          if-no-files-found: error

name: YUNEX GT3 A V4 Specific Publisher and Social Footage Scout
on:
  push:
    branches:
      - automotive-edits/gt3-nurburgring-multicar-001/a-footage
    paths:
      - .github/workflows/gt3-a-v4-specific-source-scout.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scout-real-video:
    runs-on: ubuntu-latest
    timeout-minutes: 21
    steps:
      - uses: actions/checkout@v4
      - name: Install real-video download and QA tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -q --disable-pip-version-check --break-system-packages requests pillow yt-dlp gallery-dl
      - name: Test targeted publisher and literal embedded individual social posts
        run: |
          python production/videos/gt3-nurburgring-multicar-001/agent-a/scout_specific_race_sources_v4.py
      - name: Upload physically downloaded candidate media and QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GT3-MULTICAR-A-V4-TARGETED-SOURCE-REVIEW
          path: out/gt3-specific-v4-scout/
          retention-days: 7
          compression-level: 0
          if-no-files-found: warn
      - name: Summarise downloads without granting scene approval
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib,os
          p=pathlib.Path('out/gt3-specific-v4-scout/MANIFEST_QA_PENDING.json')
          if p.exists():
            m=json.loads(p.read_text())
            n=m['native_media_acquired']
            s=f'## Agent A V4 specific source scout: {n} actual native-HD files, independent visual GT3 QA PENDING.\n'
            for x in m['acquisition_results']:
              s+=f'- {x["id"]}: {x["status"]} {x.get("width","")}x{x.get("height","")} {x.get("failure","")}\n'
          else:s='Scout did not complete: check runner logs. No new footage approved.\n'
          pathlib.Path(os.environ['GITHUB_STEP_SUMMARY']).write_text(s)
          PY

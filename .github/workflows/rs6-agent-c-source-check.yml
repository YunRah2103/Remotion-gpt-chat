name: RS6 Agent C source connection QA
on:
  push:
    branches:
      - automotive-edits/rs6-no-mercy-001/c-details-atmosphere
    paths:
      - '.github/workflows/rs6-agent-c-source-check.yml'
      - 'production/videos/rs6-no-mercy-001/agent_c_source_check.py'
      - 'production/videos/rs6-no-mercy-001/agent_c_original_probe.py'
  workflow_dispatch:
jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg and FFprobe
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Inspect original media endpoint and page download handler
        run: python production/videos/rs6-no-mercy-001/agent_c_original_probe.py
      - name: Check official source reachability and media metadata
        run: |
          python production/videos/rs6-no-mercy-001/agent_c_source_check.py

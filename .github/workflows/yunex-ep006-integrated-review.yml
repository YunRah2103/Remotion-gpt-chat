name: YUNEX EP006 Agent 8 Native Integrated Rally Preview
on:
  push:
    branches:
      - 'integration/ep006-visual-pass-01'
    paths:
      - 'src/yunex/ep006/**'
      - 'src/yunex/studio-projects/ep006-integrated-review/**'
      - 'src/yunex/studio-projects/ep006-full-visual/**'
      - '.github/workflows/yunex-ep006-full-picture.yml'
      - 'tests/ep006/**'
      - '.github/workflows/yunex-ep006-integrated-review.yml'
  pull_request:
    paths:
      - 'src/yunex/ep006/**'
      - 'src/yunex/studio-projects/ep006-full-visual/**'
      - 'src/yunex/studio-projects/ep006-integrated-review/**'
      - 'tests/ep006/**'
      - '.github/workflows/yunex-ep006-integrated-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-integrated-moving-mp4:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install Remotion and native codec packages
        run: |
          npm ci --no-audit --no-fund
          bash scripts/modelling-kit/install-native-media.sh
      - name: Compile and test source contracts together
        run: |
          npm run check
          node --experimental-strip-types --test tests/ep006/*.test.mjs
      - name: Render 350 frames of original integrated A1+A2+A3+A4 footage
        run: |
          mkdir -p out/ep006/integrated-pass-01
          npx remotion render src/yunex/studio-projects/ep006-integrated-review/entry.tsx Ep006IntegratedVisualPass01 out/ep006/integrated-pass-01/ep006-integrated-proof.mp4 --gl=swangle --codec=h264 --pixel-format=yuv420p --concurrency=2
      - name: Verify real 1080x1920/30p H264 and decode every frame
        run: |
          set -euo pipefail
          dir=out/ep006/integrated-pass-01
          ffprobe -v error -show_streams -of json "$dir/ep006-integrated-proof.mp4" > "$dir/ffprobe.json"
          ffmpeg -v error -xerror -i "$dir/ep006-integrated-proof.mp4" -f null -
          sha256sum "$dir/ep006-integrated-proof.mp4" > "$dir/sha256.txt"
          git rev-parse HEAD > "$dir/source-commit.txt"
          ffmpeg -v error -i "$dir/ep006-integrated-proof.mp4" -vf "fps=1,scale=108:192" -f framemd5 "$dir/motion.framemd5"
          ffmpeg -v error -i "$dir/ep006-integrated-proof.mp4" -vf "select='eq(n,0)+eq(n,70)+eq(n,105)+eq(n,150)+eq(n,205)+eq(n,225)+eq(n,270)+eq(n,349)',scale=270:480,tile=4x2" -frames:v 1 "$dir/visual-contact-sheet.png"
          # Catch the fully black upper half seen in the first mechanical-replay render.
          ffmpeg -v error -i "$dir/ep006-integrated-proof.mp4" -vf "select='eq(n,130)+eq(n,150)+eq(n,175)',scale=96:160,format=gray" -vsync 0 -f rawvideo "$dir/replay-luma.raw"
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=Path('out/ep006/integrated-pass-01')
          streams=json.loads((d/'ffprobe.json').read_text())['streams']
          video=[s for s in streams if s['codec_type']=='video']
          assert len(video)==1,streams
          s=video[0]
          assert s['codec_name']=='h264',s
          assert (s['width'],s['height'])==(1080,1920),s
          assert s['avg_frame_rate']=='30/1',s
          assert int(s['nb_frames'])==350,s
          assert not [s for s in streams if s['codec_type']=='audio'],'Proof must remain silent'
          hashes=[x.rsplit(',',1)[-1].strip() for x in (d/'motion.framemd5').read_text().splitlines() if x and not x.startswith('#')]
          assert len(set(hashes))>=8,'MP4 looks static at 1fps'
          lum=(d/'replay-luma.raw').read_bytes()
          frame_bytes=96*160
          assert len(lum)==3*frame_bytes,'Missing inspected replay frames'
          replay_top_luma=[]
          for i in range(3):
            frame=lum[i*frame_bytes:(i+1)*frame_bytes]
            top=frame[:96*100]
            mean=sum(top)/len(top)
            replay_top_luma.append(round(mean,2))
            assert mean>36,f'Replay frame {130+i*0} upper screen is black or terrain-clipped (YAVG={mean:.1f})'
          (d/'qa.json').write_text(json.dumps({
            'composition':'Ep006IntegratedVisualPass01',
            'source_agents':['1 vehicle','2 dynamics and FX','3 cameras','4 stage'],
            'agent5_included':False,
            'fps':30,'frames':350,'width':1080,'height':1920,
            'motion_samples':len(hashes),'unique_motion_hashes':len(set(hashes)),
            'mechanical_replay_upper_screen_mean_luma':replay_top_luma,
            'status':'technical native evidence; human moving-image approval remains pending'
          },indent=2))
          PY
      - name: Save playable MP4 plus deterministic QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YUNEX-EP006-A8-INTEGRATED-MOVING-PROOF
          path: out/ep006/integrated-pass-01/
          retention-days: 30
  render-full-picture:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install native media and Remotion
        run: |
          npm ci --no-audit --no-fund
          bash scripts/modelling-kit/install-native-media.sh
      - name: Compile shared A1-A4 composition
        run: |
          npm run check
          node --experimental-strip-types --test tests/ep006/*.test.mjs
      - name: Render real 810-frame physics-coherent film
        run: |
          mkdir -p out/ep006/full-picture
          npx remotion render src/yunex/studio-projects/ep006-full-visual/entry.tsx Ep006FullVisualNarrationBase out/ep006/full-picture/ep006-full-silent-picture.mp4 --gl=swangle --codec=h264 --pixel-format=yuv420p --concurrency=2
      - name: Validate decode frame count and save visual evidence
        run: |
          set -euo pipefail
          dir=out/ep006/full-picture
          ffprobe -v error -show_streams -of json "$dir/ep006-full-silent-picture.mp4" > "$dir/ffprobe.json"
          ffmpeg -v error -xerror -i "$dir/ep006-full-silent-picture.mp4" -f null -
          sha256sum "$dir/ep006-full-silent-picture.mp4" > "$dir/sha256.txt"
          git rev-parse HEAD > "$dir/source-commit.txt"
          ffmpeg -v error -i "$dir/ep006-full-silent-picture.mp4" -vf "select='eq(n,0)+eq(n,72)+eq(n,210)+eq(n,320)+eq(n,430)+eq(n,530)+eq(n,580)+eq(n,650)+eq(n,700)+eq(n,750)+eq(n,809)',scale=216:384,tile=4x3" -frames:v 1 "$dir/contact-sheet.png"
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=Path('out/ep006/full-picture')
          streams=json.loads((d/'ffprobe.json').read_text())['streams']
          video=[s for s in streams if s['codec_type']=='video']
          assert len(video)==1
          s=video[0]
          assert s['codec_name']=='h264',s
          assert (s['width'],s['height'])==(1080,1920),s
          assert s['avg_frame_rate']=='30/1',s
          assert int(s['nb_frames'])==810,s
          (d/'qa.json').write_text(json.dumps({'status':'render and full decode pass; moving visual review required','frames':810,'fps':30,'size':[1080,1920],'audio':'none, awaiting user-provided Cedar narration'},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: YUNEX-EP006-27SEC-NATIVE-PICTURE
          path: out/ep006/full-picture/
          retention-days: 30

name: YUNEX EP006 Agent 8 Native Integrated Rally Preview
on:
  push:
    branches:
      - 'integration/ep006-visual-pass-01'
    paths:
      - 'src/yunex/ep006/**'
      - 'src/yunex/studio-projects/ep006-integrated-review/**'
      - 'tests/ep006/**'
      - '.github/workflows/yunex-ep006-integrated-review.yml'
  pull_request:
    paths:
      - 'src/yunex/ep006/**'
      - 'src/yunex/studio-projects/ep006-integrated-review/**'
      - 'tests/ep006/**'
      - '.github/workflows/yunex-ep006-integrated-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-integrated-moving-mp4:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install Remotion and native codec packages
        run: |
          npm ci --no-audit --no-fund
          bash scripts/modelling-kit/install-native-media.sh
      - name: Compile and test source contracts together
        run: |
          npm run check
          node --experimental-strip-types --test tests/ep006/*.test.mjs
      - name: Render 350 frames of original integrated A1+A2+A3+A4 footage
        run: |
          mkdir -p out/ep006/integrated-pass-01
          npx remotion render src/yunex/studio-projects/ep006-integrated-review/entry.tsx Ep006IntegratedVisualPass01 out/ep006/integrated-pass-01/ep006-integrated-proof.mp4 --gl=swangle --codec=h264 --pixel-format=yuv420p --concurrency=2
      - name: Verify real 1080x1920/30p H264 and decode every frame
        run: |
          set -euo pipefail
          dir=out/ep006/integrated-pass-01
          ffprobe -v error -show_streams -of json "$dir/ep006-integrated-proof.mp4" > "$dir/ffprobe.json"
          ffmpeg -v error -xerror -i "$dir/ep006-integrated-proof.mp4" -f null -
          sha256sum "$dir/ep006-integrated-proof.mp4" > "$dir/sha256.txt"
          git rev-parse HEAD > "$dir/source-commit.txt"
          ffmpeg -v error -i "$dir/ep006-integrated-proof.mp4" -vf "fps=1,scale=108:192" -f framemd5 "$dir/motion.framemd5"
          ffmpeg -v error -i "$dir/ep006-integrated-proof.mp4" -vf "select='eq(n,0)+eq(n,70)+eq(n,105)+eq(n,150)+eq(n,205)+eq(n,225)+eq(n,270)+eq(n,349)',scale=270:480,tile=4x2" -frames:v 1 "$dir/visual-contact-sheet.png"
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=Path('out/ep006/integrated-pass-01')
          streams=json.loads((d/'ffprobe.json').read_text())['streams']
          video=[s for s in streams if s['codec_type']=='video']
          assert len(video)==1,streams
          s=video[0]
          assert s['codec_name']=='h264',s
          assert (s['width'],s['height'])==(1080,1920),s
          assert s['avg_frame_rate']=='30/1',s
          assert int(s['nb_frames'])==350,s
          assert not [s for s in streams if s['codec_type']=='audio'],'Proof must remain silent'
          hashes=[x.rsplit(',',1)[-1].strip() for x in (d/'motion.framemd5').read_text().splitlines() if x and not x.startswith('#')]
          assert len(set(hashes))>=8,'MP4 looks static at 1fps'
          (d/'qa.json').write_text(json.dumps({
            'composition':'Ep006IntegratedVisualPass01',
            'source_agents':['1 vehicle','2 dynamics and FX','3 cameras','4 stage'],
            'agent5_included':False,
            'fps':30,'frames':350,'width':1080,'height':1920,
            'motion_samples':len(hashes),'unique_motion_hashes':len(set(hashes)),
            'status':'technical native evidence; human moving-image approval remains pending'
          },indent=2))
          PY
      - name: Save playable MP4 plus deterministic QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YUNEX-EP006-A8-INTEGRATED-MOVING-PROOF
          path: out/ep006/integrated-pass-01/
          retention-days: 30

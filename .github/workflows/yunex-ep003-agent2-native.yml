name: EP003 Agent 2 - actual native Remotion previews

# Branch-local, isolated render verification for the two *new* Agent 2
# compositions. Existing production-pr-review only discovers src/Root.tsx
# and would otherwise smoke-test the unrelated legacy GpuDriveFilm.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'production/yunex/tyre_blowout_ep003/dynamics/**'
      - 'tests/agent-2/**'
      - '.github/workflows/yunex-ep003-agent2-native.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ep003-agent2-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  physics-and-portrait-mp4s:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install reproducible Remotion dependencies and FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install Pillow==11.3.0
          npm ci --no-audit --no-fund

      - name: Check TypeScript, world kit, parts kit and Agent 2 physical controls
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npx tsc --noEmit -p production/yunex/tyre_blowout_ep003/dynamics/tsconfig.json
          npm run worldkit:test
          npm run partskit:test
          node --experimental-strip-types --test tests/agent-2/dynamics.test.mjs

      - name: Render 5-second genuine moving incident MP4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p previews/agent-2
          npx remotion render             production/yunex/tyre_blowout_ep003/dynamics/entry.tsx             EP003Agent2Incident previews/agent-2/incident.mp4             --gl=swangle --scale=0.4 --codec=h264             --pixel-format=yuv420p --concurrency=1

      - name: Render 8-second genuine moving recovery MP4
        shell: bash
        run: |
          set -euo pipefail
          npx remotion render             production/yunex/tyre_blowout_ep003/dynamics/entry.tsx             EP003Agent2Recovery previews/agent-2/recovery.mp4             --gl=swangle --scale=0.4 --codec=h264             --pixel-format=yuv420p --concurrency=1

      - name: Fully decode, verify H264/frame counts and generate contact sheets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess
          from PIL import Image, ImageOps, ImageDraw

          out=Path('previews/agent-2')
          cases=[('incident',150,[0.2,0.8,1.6,2.7,3.6,4.7]),
                 ('recovery',240,[0.2,1.2,2.7,3.8,5.5,7.8])]
          qa={'sourceComposition':{'width':1080,'height':1920,'fps':30},
              'renderFlags':{'gl':'swangle','scale':0.4,'codec':'h264','pix_fmt':'yuv420p'},
              'clips':[]}
          for name,frames,times in cases:
              mp4=out/f'{name}.mp4'
              if not mp4.is_file() or mp4.stat().st_size<15000:
                  raise AssertionError(f'MP4 missing/implausibly small: {mp4}')
              subprocess.run(['ffmpeg','-hide_banner','-v','error','-xerror',
                              '-i',str(mp4),'-f','null','-'],check=True)
              probe=json.loads(subprocess.check_output([
                  'ffprobe','-v','error','-select_streams','v:0',
                  '-show_entries','stream=codec_name,pix_fmt,width,height,nb_frames,r_frame_rate,duration',
                  '-of','json',str(mp4)],text=True))
              stream=probe['streams'][0]
              assert stream['codec_name']=='h264',stream
              assert stream['pix_fmt']=='yuv420p',stream
              assert stream['width']==432 and stream['height']==768,stream
              assert stream['r_frame_rate']=='30/1',stream
              assert int(stream['nb_frames'])==frames,stream
              framemd5=subprocess.check_output([
                  'ffmpeg','-hide_banner','-v','error','-i',str(mp4),
                  '-vf','fps=5','-f','framemd5','-'],text=True)
              unique_hashes={line.split(',')[-1].strip() for line in framemd5.splitlines()
                             if line.strip() and not line.startswith('#')}
              assert len(unique_hashes)>=10, f'{name} insufficient temporal change: {len(unique_hashes)}'
              thumbs=[]
              for i,t in enumerate(times):
                  still=out/f'{name}-{i:02d}.png'
                  subprocess.run(['ffmpeg','-hide_banner','-v','error','-y',
                    '-ss',str(t),'-i',str(mp4),'-frames:v','1',str(still)],check=True)
                  picture=Image.open(still).convert('RGB')
                  assert picture.size==(432,768)
                  thumbs.append(picture.resize((216,384)))
              canvas=Image.new('RGB',(216*len(thumbs),422),'#101820')
              draw=ImageDraw.Draw(canvas)
              for i,picture in enumerate(thumbs):
                  canvas.paste(picture,(i*216,0))
                  draw.text((i*216+12,392),f'{name} / {times[i]:.1f}s',fill='white')
              canvas.save(out/f'{name}-contact.png')
              qa['clips'].append({
                  'file':mp4.name,'frames':frames,'durationSec':frames/30,
                  'video':stream,'uniqueSampledFrameHashes':len(unique_hashes),
                  'fullDecode':'passed','sha256':hashlib.sha256(mp4.read_bytes()).hexdigest(),
                  'bytes':mp4.stat().st_size})
          (out/'qa.json').write_text(json.dumps(qa,indent=2)+'\n')
          (out/'SHA256SUMS.txt').write_text(''.join(
            clip['sha256']+'  '+clip['file']+'\n' for clip in qa['clips']))
          print(json.dumps(qa,indent=2))
          PY

      - name: Upload two authentic playable MP4s, thumbnails and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EP003-AGENT2-NATIVE-MP4-${{ github.run_id }}
          path: previews/agent-2/
          retention-days: 30
          if-no-files-found: warn

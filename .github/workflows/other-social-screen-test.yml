name: YUNEX Additional Social Browser Screen Recording
on:
  push:
    branches: [experiments/youtube-browser-recording-20261012]
    paths: [.github/workflows/other-social-screen-test.yml, production/youtube_screen_capture/other_social_screen_test.cjs]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        sample: [control-mp4, tiktok, instagram, pinterest, snapchat, twitter, twitch, bluesky, facebook, reddit]
    name: Chrome tab / ${{ matrix.sample }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Linux Chrome capture and FFmpeg
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg xvfb
          PUPPETEER_SKIP_DOWNLOAD=1 npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/yunex" puppeteer-core@24 puppeteer@24 puppeteer-stream@3
      - name: Attempt browser playback and real 5s recording
        shell: bash
        env:
          SAMPLE: ${{ matrix.sample }}
          METHOD: puppeteer-stream
          NODE_PATH: ${{ runner.temp }}/yunex/node_modules
          OUTPUT_DIR: out/social/${{ matrix.sample }}
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24 -ac" timeout -k 10s 105s node production/youtube_screen_capture/other_social_screen_test.cjs
      - name: Publish forensic playback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-screen-${{ matrix.sample }}
          path: out/social/${{ matrix.sample }}/
          if-no-files-found: warn
          retention-days: 3

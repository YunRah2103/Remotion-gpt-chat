name: YUNEX imported-car fleet integrity
on:
  push:
    branches:
      - feat/yunex-imported-car-fleet-20261024
      - feat/yunex-imported-cars-agent-ready
    paths:
      - 'production/assets/imported-cars/**'
      - 'production/asset-library/**'
      - 'tests/asset-library/**'
      - 'src/yunex/imported-cars/**'
      - 'scripts/imported-cars.mjs'
      - 'scripts/yunex-agent-car.mjs'
      - 'tests/imported-cars/**'
      - '.github/workflows/yunex-imported-cars.yml'
      - 'package.json'
  pull_request:
    paths:
      - 'production/assets/imported-cars/**'
      - 'production/asset-library/**'
      - 'tests/asset-library/**'
      - 'src/yunex/imported-cars/**'
      - 'scripts/imported-cars.mjs'
      - 'scripts/yunex-agent-car.mjs'
      - 'tests/imported-cars/**'
      - '.github/workflows/yunex-imported-cars.yml'
      - 'package.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  imported-cars:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Compile and verify model contract
        run: |
          npm run check
          node --experimental-strip-types --test tests/imported-cars/*.test.mjs
          python3 -m unittest discover -s tests/asset-library -p 'test_*.py'
      - name: Fetch ALL 10 attributed real-geometry GLBs
        run: |
          npm run kit:cars:list
          npm run kit:cars:fetch -- all
          npm run kit:cars:verify -- all
      - name: Inspect extracted model metadata and gate duplicates
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('production/assets/imported-cars/catalog.json').read_text())
          v=json.loads(Path('out/imported-cars/verified-manifest.json').read_text())
          ready=[x for x in c['vehicles'] if x['readiness']=='attribution-required']
          assert len(v['records'])==len(ready)
          assert set(x['id'] for x in v['records'])==set(x['id'] for x in ready)
          assert all(x['meshes']>0 and x['sha256'] for x in v['records'])
          assert all(x['readiness']=='attribution-required' for x in v['records'])
          print('PASS verified ready imported real-geometry models:',len(ready))
          for x in v['records']:
              print(x['id'],x['meshes'],'meshes',x['materials'],'materials',x['textures'],'textures')
          PY
      - name: Native Three.js/Remotion real Ferrari model frame
        run: |
          mkdir -p out/imported-cars
          npx remotion still src/yunex/imported-cars/entry.tsx YunexImportedCarPreview out/imported-cars/ferrari-f40-actual-mesh.png --frame=10 --scale=.5 --gl=swangle --timeout=120000
          test -s out/imported-cars/ferrari-f40-actual-mesh.png
      - name: Real moving native Ferrari GLB preview (180 frames, 1080x1920)
        run: |
          npx remotion render src/yunex/imported-cars/entry.tsx YunexImportedCarPreview out/imported-cars/ferrari-f40-moving-inspection.mp4 --gl=swangle --codec=h264 --pixel-format=yuv420p --timeout=120000 --concurrency=2
          ffprobe -v error -count_frames -select_streams v:0 -show_entries stream=width,height,nb_read_frames,avg_frame_rate -of json out/imported-cars/ferrari-f40-moving-inspection.mp4 > out/imported-cars/moving-probe.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path('out/imported-cars/moving-probe.json').read_text())['streams'][0]
          assert j['width']==1080 and j['height']==1920, j
          assert j['avg_frame_rate']=='30/1', j
          assert int(j['nb_read_frames'])==180, j
          print('PASS true 180-frame imported Ferrari orbit')
          PY
          ffmpeg -v error -i out/imported-cars/ferrari-f40-moving-inspection.mp4 -f null -
      - name: Keep verification records (no third-party binary redistribution)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YUNEX-Imported-Cars-Verification
          path: |
            out/imported-cars/verified-manifest.json
            out/imported-cars/ferrari-f40-actual-mesh.png
            out/imported-cars/ferrari-f40-moving-inspection.mp4
            out/imported-cars/moving-probe.json
          if-no-files-found: warn
          retention-days: 14

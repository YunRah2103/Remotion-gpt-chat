name: RS6 Agent B caption-filtered driving-only footage QA
on:
  push:
    branches: [automotive-edits/rs6-no-mercy-001/b-creator-driving]
    paths: [.github/workflows/rs6-agent-b-caption-filtered.yml]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  C8-targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: uk-rs6-tuning
            handle: puretuninguk
          - tag: rs6-roadtrip
            handle: mtcars111
          - tag: rs6-c8-night
            handle: rs.in.black
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -q --upgrade yt-dlp curl_cffi
      - name: Filter captioned RS6 videos; acquire temporary clips and inspect
        shell: bash
        env:
          HANDLE: ${{ matrix.handle }}
          TAG: ${{ matrix.tag }}
        run: |
          set +e
          mkdir -p "proof/$TAG" "scratch/$TAG"
          url="https://www.tiktok.com/@$HANDLE"
          yt-dlp --ignore-config --flat-playlist --playlist-end 100 --print '%(webpage_url)s @@@ %(title)s' --socket-timeout 15 --retries 1 "$url" >"proof/$TAG/feed-captioned.txt" 2>"proof/$TAG/feed-errors.txt"
          grep -iE 'rs[ -]?6|c8|quattro|avant' "proof/$TAG/feed-captioned.txt" | grep '^https://www.tiktok.com' | sort -ur | head -n 4 | cut -d' ' -f1 >"proof/$TAG/targets.txt"
          if [[ ! -s "proof/$TAG/targets.txt" ]]; then
            echo 'NO_CAPTION_MATCH' >>"proof/$TAG/feed-errors.txt"
          fi
          n=0
          while IFS= read -r link; do
            n=$((n+1)); fileprefix="$TAG-$n"
            printf "original=%s\n" "$link" >"proof/$TAG/$n-log.txt"
            yt-dlp --ignore-config --no-playlist --format 'bv*+ba/b' --download-sections '*0-6' --force-keyframes-at-cuts --merge-output-format mp4 --socket-timeout 15 --retries 1 --fragment-retries 1 -o "scratch/$TAG/$fileprefix.%(ext)s" "$link" >>"proof/$TAG/$n-log.txt" 2>&1
            p="$(find "scratch/$TAG" -type f -name "$fileprefix.*" ! -name '*.part' | head -n 1)"
            [[ -n "$p" ]] || continue
            ffprobe -v error -show_entries format=duration,size:stream=codec_name,codec_type,width,height,r_frame_rate -of json "$p" >"proof/$TAG/$n-probe.json"
            ffmpeg -nostdin -v error -xerror -i "$p" -f null - >>"proof/$TAG/$n-log.txt" 2>&1
            echo "decode_exit=$?" >>"proof/$TAG/$n-log.txt"
            sha256sum "$p" >>"proof/$TAG/$n-log.txt"
            mkdir -p "proof/$TAG/$n-frames"
            ffmpeg -nostdin -v error -y -i "$p" -vf 'fps=1/2,scale=420:-1' -frames:v 3 "proof/$TAG/$n-frames/f_%02d.jpg"
            rm -f "$p"
          done < "proof/$TAG/targets.txt"
      - name: Upload only metadata and visual samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rs6-caption-QA-${{ matrix.tag }}
          path: proof/${{ matrix.tag }}/
          retention-days: 14

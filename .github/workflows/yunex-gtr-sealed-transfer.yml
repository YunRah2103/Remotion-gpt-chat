          -----END CERTIFICATE-----
          CERT
          tar -czf work/gtr.tar.gz -C work/gtr GTR_ATTESA_PICTURE_ONLY.mp4 SHA256SUMS
          openssl cms -encrypt -binary -aes-256-cbc -in work/gtr.tar.gz \
            -out out/sealed/GTR_PICTURE_ENCRYPTED.p7m -outform DER work/gtr-editor-cert.pem
          test -s out/sealed/GTR_PICTURE_ENCRYPTED.p7m
          echo 'Private footage encrypted with editor-owned public key; no unencrypted source in artifact.'
      - uses: actions/upload-artifact@v4
        with:
          name: yunex-gtr-sealed-film
          path: out/sealed/GTR_PICTURE_ENCRYPTED.p7m
          retention-days: 1
          if-no-files-found: error

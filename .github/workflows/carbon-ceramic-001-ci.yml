name: Carbon Ceramic 001 - five-agent contract and handoff QA
on:
  push:
    branches:
      - 'automotive-brakes-001/**'
    paths:
      - 'production/videos/carbon-ceramic-001/**'
      - '.github/workflows/carbon-ceramic-001-ci.yml'
  pull_request:
    paths:
      - 'production/videos/carbon-ceramic-001/**'
      - '.github/workflows/carbon-ceramic-001-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact shot continuity, no full car scope, assigned prompts and four truthfully gated handoffs
        run: |
          set -euo pipefail
          python production/videos/carbon-ceramic-001/validate_setup.py
          python -m compileall -q production/videos/carbon-ceramic-001
          python -m unittest discover -s production/videos/carbon-ceramic-001 -p 'test_master_gate.py' -v
          python production/videos/carbon-ceramic-001/master_gate.py --report out/carbon-ceramic-001/master-readiness.json
      - name: Report contract-only scope
        run: |
          echo 'Verified carbon-ceramic five-agent planning contract and handoff JSON.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This workflow does NOT demonstrate any finished Blender hardware, thermal simulation or MP4.' >> "$GITHUB_STEP_SUMMARY"

name: AI ERA - V3 Audit of Finished Real-Footage Film
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ai-era-seven-v3-audit.yml']
  workflow_dispatch:
jobs:
  original-film-v3-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions: {contents: write, issues: read}
    steps:
      - uses: actions/checkout@v4
      - name: Install native media QA tools and V3 dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg zip
          python -m pip install --break-system-packages 'Pillow>=10,<13'
      - id: chatgpt
        uses: YunRah2103/Remotion-gpt-chat/.github/actions/yunex-v4-import@main
        with:
          issue_number: '172'
          token: ${{ github.token }}
          destination: work/ai-era-v3-audit/chatgpt
      - id: claude
        uses: YunRah2103/Remotion-gpt-chat/.github/actions/yunex-v4-import@main
        with:
          issue_number: '173'
          token: ${{ github.token }}
          destination: work/ai-era-v3-audit/claude
      - id: gemini
        uses: YunRah2103/Remotion-gpt-chat/.github/actions/yunex-v4-import@main
        with:
          issue_number: '174'
          token: ${{ github.token }}
          destination: work/ai-era-v3-audit/gemini
      - id: kimi
        uses: YunRah2103/Remotion-gpt-chat/.github/actions/yunex-v4-import@main
        with:
          issue_number: '175'
          token: ${{ github.token }}
          destination: work/ai-era-v3-audit/kimi
      - id: qwen
        uses: YunRah2103/Remotion-gpt-chat/.github/actions/yunex-v4-import@main
        with:
          issue_number: '176'
          token: ${{ github.token }}
          destination: work/ai-era-v3-audit/qwen
      - id: deepseek
        uses: YunRah2103/Remotion-gpt-chat/.github/actions/yunex-v4-import@main
        with:
          issue_number: '177'
          token: ${{ github.token }}
          destination: work/ai-era-v3-audit/deepseek
      - id: grok
        uses: YunRah2103/Remotion-gpt-chat/.github/actions/yunex-v4-import@main
        with:
          issue_number: '178'
          token: ${{ github.token }}
          destination: work/ai-era-v3-audit/grok
      - name: Run V3 source scouts on all seven genuine V4 assets
        env:
          FILE_CHATGPT: ${{ steps.chatgpt.outputs.asset_path }}
          FILE_CLAUDE: ${{ steps.claude.outputs.asset_path }}
          FILE_GEMINI: ${{ steps.gemini.outputs.asset_path }}
          FILE_KIMI: ${{ steps.kimi.outputs.asset_path }}
          FILE_QWEN: ${{ steps.qwen.outputs.asset_path }}
          FILE_DEEPSEEK: ${{ steps.deepseek.outputs.asset_path }}
          FILE_GROK: ${{ steps.grok.outputs.asset_path }}
        run: |
          set -euo pipefail
          mkdir -p out/ai-era-v3-audit
          for model in chatgpt claude gemini kimi qwen deepseek grok; do
            upper=$(echo "$model" | tr '[:lower:]' '[:upper:]')
            variable="FILE_$upper"
            file="${!variable}"
            test -s "$file"
            python production/toolkits/yunex_edit_lab.py scout \
              --video "$file" \
              --output "out/ai-era-v3-audit/source-scout/$model" \
              --max-shots 12
          done
      - name: Read finished owner-only film without exposing source assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p private-media
          gh release download ai-era-review-39187631649 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'AI_ERA_Real_1080x1920.mp4' \
            --dir private-media
          test -s private-media/AI_ERA_Real_1080x1920.mp4
          ffmpeg -hide_banner -loglevel error -xerror \
            -i private-media/AI_ERA_Real_1080x1920.mp4 -f null -
      - name: V3 final audio metering, 35.6s sample proof, contact sheet export
        run: |
          set -euo pipefail
          python production/toolkits/yunex_edit_lab.py meter \
            --file private-media/AI_ERA_Real_1080x1920.mp4 \
            --output out/ai-era-v3-audit/master-loudness-true-peak.json
          ffprobe -v error -show_entries format=duration,size \
            -show_entries stream=codec_name,width,height,avg_frame_rate \
            -of json private-media/AI_ERA_Real_1080x1920.mp4 \
            > out/ai-era-v3-audit/master-probe.json
          ffmpeg -v error -ss 2.68 -i private-media/AI_ERA_Real_1080x1920.mp4 \
            -frames:v 1 -y out/ai-era-v3-audit/early-cut.jpg
          ffmpeg -v error -ss 22.37 -i private-media/AI_ERA_Real_1080x1920.mp4 \
            -frames:v 1 -y out/ai-era-v3-audit/middle-cut.jpg
          ffmpeg -v error -ss 31.31 -i private-media/AI_ERA_Real_1080x1920.mp4 \
            -frames:v 1 -y out/ai-era-v3-audit/final-cut.jpg
          sha256sum private-media/AI_ERA_Real_1080x1920.mp4 > out/ai-era-v3-audit/source-master.sha256
          cd out
          zip -q -r ai-era-v3-audit.zip ai-era-v3-audit/
      - name: Add V3 QC pack to original PRIVATE draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload ai-era-review-39187631649 \
            out/ai-era-v3-audit.zip \
            --repo "$GITHUB_REPOSITORY"
          echo 'V3 QC report, 7 source contact sheets and real master audio measurements added to original owner-only draft release.' >> "$GITHUB_STEP_SUMMARY"

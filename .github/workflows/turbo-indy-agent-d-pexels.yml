name: Turbo Indy Agent D - Pexels Indy car source validation
on:
  push:
    branches:
      - automotive-edits/turbo-indy-reality-001/d-indy-cinematic
    paths:
      - 'production/videos/turbo-indy-reality-001/agent_d_pexels_probe.py'
      - '.github/workflows/turbo-indy-agent-d-pexels.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check requests pillow yt-dlp
      - name: Download openly licensed actual candidate video; inspect source resolution, movement
        run: python production/videos/turbo-indy-reality-001/agent_d_pexels_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: YUNEX-INDY-D-PEXELS-SOURCE-QA
          path: out/YUNEX_INDY_D_PEXELS_VERIFICATION.zip
          compression-level: 0
          retention-days: 14
          if-no-files-found: warn

name: IceCube 3D Fidelity - Blender and Remotion Proof
on:
  push:
    branches: [recreate/icecube-3d-rebuild]
    paths:
      - '.github/workflows/icecube-blender-proof.yml'
      - 'src/IceCube3DProof.tsx'
      - 'src/Root.tsx'
      - 'scripts/prepare_icecube_human.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Blender, FFmpeg, and Remotion
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender ffmpeg python3-numpy
          blender -b --python-expr "import sys; print('BLENDER PYTHON',sys.version); import numpy; print('NUMPY',numpy.__version__)"
          npm install --no-audit --no-fund
          blender --version | head -2
          ffmpeg -version | head -1
      - name: Download permitted CC0 anatomical mesh and Earth reference texture
        shell: bash
        run: |
          mkdir -p out/assets public/assets
          curl -fL --retry 3 --connect-timeout 15 --max-time 120 \
            'https://www.innerscene.com/api/library/human-base-mesh-with-editable-53-bone-rig-8e7c8ab1/download' \
            -o out/assets/human-source.glb || true
          if ! python3 -c "p='out/assets/human-source.glb'; import os; assert os.path.getsize(p)>1000000; assert open(p,'rb').read(4)==b'glTF'"; then
            echo "Original CC0 anatomical rig source unavailable, trying documented CC0 fallback."
            curl -fL --retry 3 --connect-timeout 15 --max-time 120 \
              'https://raw.githubusercontent.com/UMRAM-Bilkent/supine-human-model/main/assets/human_posed.glb' \
              -o out/assets/human-source.glb
          fi
          python3 -c "p='out/assets/human-source.glb'; import os; assert os.path.getsize(p)>30000; assert open(p,'rb').read(4)==b'glTF'; print('VALID CC0 glTF BODY:',os.path.getsize(p),'bytes')"
          curl -fL --retry 3 --connect-timeout 15 --max-time 100 \
            'https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_atmos_2048.jpg' \
            -o public/assets/earth-daymap.jpg
          test $(wc -c < public/assets/earth-daymap.jpg) -gt 100000
      - name: Prepare real anatomical model in headless Blender
        run: |
          blender -b --python scripts/prepare_icecube_human.py -- \
            out/assets/human-source.glb public/assets/icecube-human.glb
          python3 -c "p='public/assets/icecube-human.glb'; import os; assert os.path.getsize(p)>30000; assert open(p,'rb').read(4)==b'glTF'"
          du -h public/assets/*
      - name: Strict TypeScript validation
        run: npm run check
      - name: Render entire 450-frame portrait 3D reference proof
        run: |
          mkdir -p out
          npx remotion render src/index.ts IceCube3DProof out/ICECUBE-3D-REBUILD-15SEC.mp4 \
            --gl=swangle --concurrency=2 --codec=h264 --pixel-format=yuv420p --crf=18 --log=error
      - name: Verify full decoder and deliver reference-check stills
        run: |
          ffprobe -v error -show_entries stream=nb_frames,width,height,r_frame_rate,codec_name -of json out/ICECUBE-3D-REBUILD-15SEC.mp4 > out/ffprobe.json
          ffmpeg -v error -xerror -i out/ICECUBE-3D-REBUILD-15SEC.mp4 -f null -
          python3 - <<'PY'
          import json
          p=json.load(open('out/ffprobe.json'))['streams'][0]
          assert (p['codec_name'],p['r_frame_rate'],int(p['nb_frames']),int(p['width']),int(p['height']))==('h264','30/1',450,1080,1920),p
          print('PASS: 450 real Remotion frames; 1080x1920 at 30fps; h264, full decode verified')
          PY
          for s in 0 2 3 5 7 9 11 12 14; do
            ffmpeg -v error -y -ss $s -i out/ICECUBE-3D-REBUILD-15SEC.mp4 -frames:v 1 -update 1 out/proof-$s.png
          done
          sha256sum out/ICECUBE-3D-REBUILD-15SEC.mp4 > out/SHA256SUMS.txt
          cat > out/SOURCE-LICENSE.txt <<'EOF'
          Procedural camera, lighting, neutrino trails and timing: original.
          Anatomical human: Innerscene human-base-rigged.glb (MakeHuman/MPFB),
          CC0, source URL in GitHub Actions script.
          Fallback: Quaternius human from UMRAM-Bilkent supine-human-model, CC0.
          Earth image: three.js examples earth_atmos_2048.jpg.
          Video not derived from any reused source video frame.
          Source isolated in YunRah2103/Remotion-gpt-chat.
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: ICECUBE-BLENDER-3D-15SEC-QUALITY-GATE
          path: |
            out/ICECUBE-3D-REBUILD-15SEC.mp4
            out/proof-*.png
            out/ffprobe.json
            out/SHA256SUMS.txt
            out/SOURCE-LICENSE.txt
          retention-days: 30
          if-no-files-found: error

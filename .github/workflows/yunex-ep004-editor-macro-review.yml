name: YUNEX EP004 Agent 6 contact macro native review
on:
  pull_request:
    branches: [production/yunex-ep004-base]
    paths:
      - 'production/yunex/f1_sparks_ep004/editor/macro-camera.ts'
      - 'production/yunex/f1_sparks_ep004/tests/agent-6/macro-camera.test.mjs'
      - '.github/workflows/yunex-ep004-editor-macro-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macro-native:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: FFmpeg availability
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Editor tests (must retain originals)
        run: |
          npx tsc -p production/yunex/f1_sparks_ep004/editor/tsconfig.json
          node --experimental-strip-types --test production/yunex/f1_sparks_ep004/tests/agent-6/*.test.mjs
      - name: Render ACTUAL original frames 222-290 (V3 macro)
        run: |
          mkdir -p out/ep004-macro
          npx remotion render production/yunex/f1_sparks_ep004/editor/preview-entry.tsx \
            EP004Agent6VideoOnlyReview out/ep004-macro/V3-contact-macro.mp4 \
            --frames=222-290 --gl=swangle --codec=h264 --pixel-format=yuv420p \
            --concurrency=2 --log=error
      - name: Native full decode, frame evidence, no audio
        shell: bash
        run: |
          node production/yunex/f1_sparks_ep004/editor/native-qa.mjs \
            out/ep004-macro/V3-contact-macro.mp4 69 --video-only
          for n in 0 8 20 36 52 60 68; do
            ffmpeg -loglevel error -y -i out/ep004-macro/V3-contact-macro.mp4 \
              -vf "select=eq(n\\,$n)" -frames:v 1 out/ep004-macro/frame-$n.png
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EP004-Agent6-V3-real-contact-macro-native
          path: out/ep004-macro
          retention-days: 30
          if-no-files-found: warn

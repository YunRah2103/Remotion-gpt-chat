name: YUNEX Midnight Emerald - Private Film Source Scout
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yunex-midnight-emerald-vimeo-scout.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  footage:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install permitted source and QA tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check -U "yt-dlp[default]"
      - name: Download three DB12 films from their original filmmaker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/media out/qa
          cat > out/sources.tsv <<'SOURCES'
          purer https://vimeo.com/1076001433
          sharper https://vimeo.com/1076004262
          bolder https://vimeo.com/1076006116
          SOURCES
          while read -r name source; do
            echo "::group::Private review of $name"
            if python -m yt_dlp --ignore-config --no-playlist --no-progress \
               --no-warnings --socket-timeout 25 --retries 2 --fragment-retries 2 \
               -f 'bv*[height<=1080]+ba/b[height<=1080]/b' \
               --merge-output-format mp4 --remux-video mp4 \
               -o "out/media/$name.%(ext)s" "$source" >"out/qa/$name.download.log" 2>&1; then
              echo "SOURCE_DOWNLOAD_SUCCEEDED $name"
            else
              echo "Source inaccessible for $name; not verified"
              tail -20 "out/qa/$name.download.log" || true
              rm -f "out/media/$name".* || true
            fi
            echo "::endgroup::"
          done < out/sources.tsv
          find out/media -type f -size +100k -print | tee out/qa/acquired-files.txt
          test -s out/qa/acquired-files.txt
      - name: Verify complete footage and create actual 16:9 and 9:16 contact sheets
        shell: bash
        run: |
          set -euo pipefail
          cat > out/inspect.py <<'PY'
          import hashlib,json,re,subprocess
          from pathlib import Path
          root=Path('out')
          urls={'purer':'https://vimeo.com/1076001433','sharper':'https://vimeo.com/1076004262','bolder':'https://vimeo.com/1076006116'}
          results=[]
          for f in sorted((root/'media').glob('*')):
              if f.suffix.lower() not in ('.mp4','.mov','.mkv','.webm'):continue
              p=subprocess.run(['ffprobe','-v','error','-show_format','-show_streams','-of','json',str(f)],capture_output=True,text=True,check=True)
              d=json.loads(p.stdout)
              s=next((v for v in d['streams'] if v.get('codec_type')=='video'),None)
              if not s:raise RuntimeError('No video track '+str(f))
              width,height=int(s['width']),int(s['height'])
              duration=float(s.get('duration') or d['format'].get('duration') or 0)
              if height<720 or width<height or duration<2 or duration>600:raise RuntimeError('Native source rejected '+str(f))
              decoded=subprocess.run(['ffmpeg','-hide_banner','-nostdin','-v','error','-xerror','-i',str(f),'-f','null','-'],capture_output=True,text=True)
              if decoded.returncode:raise RuntimeError('Full decode failed '+str(f)+' '+decoded.stderr[-500:])
              scene=subprocess.run(['ffmpeg','-hide_banner','-nostdin','-i',str(f),'-vf','select=gt(scene\\,0.30),showinfo','-an','-f','null','-'],capture_output=True,text=True)
              cuts=sorted({round(float(x),3) for x in re.findall(r'pts_time:\s*([0-9.]+)',scene.stderr) if 0.4<float(x)<duration-0.4})
              kept=[]
              for cut in cuts:
                  if not kept or cut-kept[-1]>0.48:kept.append(cut)
              borders=[0.0]+kept+[round(duration,3)]
              segments=[{'source_in':borders[i],'source_out':borders[i+1],'review':'auto-scene-hint-only'} for i in range(len(borders)-1) if borders[i+1]-borders[i]>=0.5]
              for style,vf in {
                  'landscape':'fps=1/1.15,scale=400:225:force_original_aspect_ratio=decrease,pad=400:225:(ow-iw)/2:(oh-ih)/2,tile=5x5',
                  'portrait':'fps=1/1.15,crop=ih*9/16:ih:(iw-ow)/2:0,scale=203:360,tile=5x5'
              }.items():
                  output=root/'qa'/(f.stem+'-'+style+'.jpg')
                  a=subprocess.run(['ffmpeg','-hide_banner','-nostdin','-v','error','-i',str(f),'-vf',vf,'-frames:v','1','-q:v','2','-y',str(output)],capture_output=True,text=True)
                  if a.returncode or not output.exists():raise RuntimeError('Contact sheet failed '+a.stderr[-350:])
              with f.open('rb') as handle:digest=hashlib.file_digest(handle,'sha256').hexdigest()
              item={'file':f.name,'creator':'AltSpace','source':urls.get(f.stem),'model':'DB12 — visual colour confirmation pending','rights':'unverified_owner_only_DRAFT','width':width,'height':height,'duration_seconds':duration,'fps_rational':s.get('avg_frame_rate'),'codec':s.get('codec_name'),'sha256':digest,'bytes':f.stat().st_size,'full_decode':'PASS','auto_scene_candidates':segments,'sheets':[f.stem+'-landscape.jpg',f.stem+'-portrait.jpg']}
              results.append(item)
              print('SOURCE_TECHNICAL_PASS',item['file'],width,height,duration,digest)
          if not results:raise RuntimeError('No playable videos')
          (root/'qa'/'manifest.json').write_text(json.dumps({'project':'YUNEX MIDNIGHT EMERALD','verification':'TECHNICAL_PASS_VISUAL_REVIEW_PENDING','distribution':'private owner-only; not licensed for public publication','sources':results},indent=2))
          PY
          python out/inspect.py
      - name: Preserve real original videos and preview sheets in OWNER-ONLY DRAFT Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='yunex-midnight-emerald-private-scout-20261014'
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft \
              --title 'YUNEX Midnight Emerald | PRIVATE candidate footage' \
              --notes 'Owner-only source inspection. Rights unverified; NOT authorised for public reposting. Original media, actual contact sheets and technical QA. Automatic scene boundaries are not reviewed editorial timecodes.'
          fi
          gh release upload "$tag" out/media/* out/qa/*landscape.jpg out/qa/*portrait.jpg out/qa/manifest.json \
            --repo "$GITHUB_REPOSITORY" --clobber
          echo "## YUNEX Midnight Emerald" >> "$GITHUB_STEP_SUMMARY"
          echo "Private draft: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: midnight-emerald-scout-technical-log
          path: |
            out/qa/manifest.json
            out/qa/*.download.log
            out/qa/acquired-files.txt
          retention-days: 7
          if-no-files-found: warn

name: RS6 C2 original 4K Audi grille draft addon
on:
  push:
    branches:
      - automotive-edits/rs6-no-mercy-001/c2-details-textures
    paths:
      - 'production/videos/rs6-no-mercy-001/agent-c2/udhd_audi_grille_addon.py'
      - 'production/videos/rs6-no-mercy-001/agent-c2/udhd_audi_extra_details.py'
      - '.github/workflows/rs6-c2-audi-uhd-review.yml'
  pull_request:
    paths:
      - 'production/videos/rs6-no-mercy-001/agent-c2/udhd_audi_grille_addon.py'
      - 'production/videos/rs6-no-mercy-001/agent-c2/udhd_audi_extra_details.py'
      - '.github/workflows/rs6-c2-audi-uhd-review.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qauhd:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - name: Install source tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install pillow --break-system-packages
      - name: Pull true native UHD from Audi source and render 1080x1920 MP4 detail
        run: |
          python production/videos/rs6-no-mercy-001/agent-c2/udhd_audi_grille_addon.py | tee c2_uhd_build.log
          test -s c2_audi_uhd_addon/RS6_C8_NATIVE4K_AUDI_GRILLE.mp4
          test -s c2_audi_uhd_addon/YUNEX_RS6_C2_UHD_ADDON.zip
          python production/videos/rs6-no-mercy-001/agent-c2/udhd_audi_extra_details.py | tee c2_uhd_extra_build.log
          test "$(find c2_audi_uhd_extra -maxdepth 1 -name '*.mp4' | wc -l)" -eq 3
          test -s c2_audi_uhd_extra/YUNEX_RS6_C2_UHD_EXTRA.zip
      - name: Upload to existing draft only, never an already-published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: yunex-rs6-c2-details-review-20261013
        run: |
          set -euo pipefail
          draft=$(gh release view "$TAG" --json isDraft --jq '.isDraft')
          if [ "$draft" != "true" ]; then echo "Refuse public release of unverified source rights"; exit 1; fi
          gh release upload "$TAG" c2_audi_uhd_addon/YUNEX_RS6_C2_UHD_ADDON.zip \
            c2_audi_uhd_addon/RS6_C8_NATIVE4K_AUDI_GRILLE.mp4 \
            c2_audi_uhd_addon/UHD_GRILLE_CONTACT.jpg \
            c2_audi_uhd_addon/UHD_GRILLE_MANIFEST.json \
            c2_audi_uhd_addon/UHD_GRILLE_SHA256SUMS.txt --clobber
          gh release upload "$TAG" c2_audi_uhd_extra/YUNEX_RS6_C2_UHD_EXTRA.zip \
            c2_audi_uhd_extra/*.mp4 \
            c2_audi_uhd_extra/UHD_EXTRA_CONTACT.jpg \
            c2_audi_uhd_extra/UHD_EXTRA_MANIFEST.json \
            c2_audi_uhd_extra/UHD_EXTRA_SHA256SUMS.txt --clobber
          gh release view "$TAG" --json isDraft,assets --jq '{draft:.isDraft,files:[.assets[].name]}'
      - name: Upload metadata and review image (not source video)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rs6-c2-native4k-grille-evidence-${{ github.run_id }}
          path: |
            c2_uhd_build.log
            c2_uhd_extra_build.log
            c2_audi_uhd_addon/UHD_GRILLE_CONTACT.jpg
            c2_audi_uhd_addon/UHD_GRILLE_MANIFEST.json
            c2_audi_uhd_addon/UHD_GRILLE_SHA256SUMS.txt
            c2_audi_uhd_extra/UHD_EXTRA_CONTACT.jpg
            c2_audi_uhd_extra/UHD_EXTRA_MANIFEST.json
            c2_audi_uhd_extra/UHD_EXTRA_SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 10

name: GPU POLISH04 - guarded manager native proof and final release
on:
  push:
    branches: [gpu-polish4/d-master]
    paths:
      - gpu-decompose/polish4/manager/RELEASE_LOCK.json
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  stage-verified-input:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      phase: ${{ steps.contract.outputs.phase }}
      hardware_run: ${{ steps.contract.outputs.hardware_run }}
      hardware_name: ${{ steps.contract.outputs.hardware_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate signed lock and known independent proof chains
        id: contract
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          L=gpu-decompose/polish4/manager/RELEASE_LOCK.json
          python3 gpu-decompose/polish4/manager/verify_polish4.py lock "$L"
          echo "phase=$(jq -r .status "$L")" >> "$GITHUB_OUTPUT"
          echo "hardware_run=$(jq -r .hardwareRunId "$L")" >> "$GITHUB_OUTPUT"
          echo "hardware_name=$(jq -r .hardwareArtifactName "$L")" >> "$GITHUB_OUTPUT"
          for entry in 'agentASourceSha hardwareRunId hardwareArtifactId' 'agentBSourceSha cameraProofRunId cameraProofArtifactId' 'agentCSourceSha motionProofRunId motionProofArtifactId'; do
            read -r source run id <<< "$entry"
            SHA=$(jq -r ".$source" "$L")
            RID=$(jq -r ".$run" "$L")
            AID=$(jq -r ".$id" "$L")
            curl -fLsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$RID" > /tmp/run.json
            jq -e --arg sha "$SHA" '.status=="completed" and .conclusion=="success" and .head_sha==$sha' /tmp/run.json >/dev/null
            curl -fLsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$RID/artifacts?per_page=100" > /tmp/artifacts.json
            jq -e --argjson id "$AID" '.artifacts[]|select(.id==$id and .expired==false)' /tmp/artifacts.json >/dev/null
            echo "VERIFIED independent completed run $RID artifact $AID source $SHA"
          done
          if [ "$(jq -r .status "$L")" = release ]; then
            RID=$(jq -r .nativeIntegratedProofRunId "$L")
            AID=$(jq -r .nativeIntegratedProofArtifactId "$L")
            curl -fLsS -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$RID" > /tmp/native.json
            jq -e '.status=="completed" and .conclusion=="success"' /tmp/native.json >/dev/null
            curl -fLsS -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$RID/artifacts?per_page=100" > /tmp/native-artifacts.json
            jq -e --argjson id "$AID" '.artifacts[]|select(.id==$id and .name=="GPU-POLISH4-D-NATIVE-PROOFS" and .expired==false)' /tmp/native-artifacts.json >/dev/null
            python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          l=json.loads(Path('gpu-decompose/polish4/manager/RELEASE_LOCK.json').read_text())
          p=Path('gpu-decompose/polish4/manager/NATIVE_VISUAL_REVIEW.md')
          assert p.is_file(), 'D independent review absent'
          assert hashlib.sha256(p.read_bytes()).hexdigest()==l['qaReportSha256'], 'review SHA mismatch'
          print('SIGNED HUMAN VISUAL QA VALIDATED')
          PY
          fi
      - name: Fetch only A's exact model artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.contract.outputs.hardware_name }}
          run-id: ${{ steps.contract.outputs.hardware_run }}
          github-token: ${{ github.token }}
          path: out/model
      - name: Stage A GLB plus C JSON exactly once; verify hashes and scene
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/gpu-decompose/polish4 out/stage
          python3 - <<'PY'
          from pathlib import Path
          from shutil import copyfile
          files=list(Path('out/model').rglob('xfx_swift_rx9060xt_polish4.glb'))
          assert len(files)==1 and files[0].is_file(),f"Missing/ambiguous A POLISH04 GLB: {files}"
          motion=Path('gpu-decompose/polish4/motion/decomposition.json')
          assert motion.is_file(),'Missing exact Agent C motion input'
          dst=Path('public/gpu-decompose/polish4')
          copyfile(files[0],dst/'xfx_swift_rx9060xt_polish4.glb')
          copyfile(motion,dst/'decomposition.json')
          print('STAGED final A binary',files[0],'and exact C motion',motion)
          PY
          python3 gpu-decompose/polish4/manager/verify_polish4.py assets \
            public/gpu-decompose/polish4 gpu-decompose/polish4/manager/RELEASE_LOCK.json \
            | tee out/stage/PREFLIGHT.json
          cp gpu-decompose/polish4/manager/RELEASE_LOCK.json out/stage/RELEASE_LOCK.json
          (cd public/gpu-decompose/polish4 && sha256sum *.glb *.json) > out/stage/INPUT_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GPU-POLISH4-D-HASHED-INPUTS
          path: |
            public/gpu-decompose/polish4/
            out/stage/
          retention-days: 30
          if-no-files-found: error

  actual-native-proofs:
    needs: stage-verified-input
    if: needs.stage-verified-input.outputs.phase == 'proofs'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: GPU-POLISH4-D-HASHED-INPUTS
          path: .
      - name: Install verify and render actual native 3D
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          npm install --no-audit --no-fund
          npm run check
          python3 gpu-decompose/polish4/manager/verify_polish4.py assets \
            public/gpu-decompose/polish4 out/stage/RELEASE_LOCK.json
          mkdir -p out/polish4-proof
          for f in 0 30 60 100 135 180 225 270 310 365 415 449; do
            npx remotion still src/index.ts XfxSwiftDecomposition \
              "out/polish4-proof/frame-$f.png" --frame="$f" --gl=swangle
            test -s "out/polish4-proof/frame-$f.png"
          done
          for segment in '55-72' '112-142' '175-195' '209-233' '300-338' '385-415'; do
            npx remotion render src/index.ts XfxSwiftDecomposition \
              "out/polish4-proof/moving-$segment.mp4" --frames="$segment" \
              --gl=swangle --codec=h264 --pixel-format=yuv420p --concurrency=1
            ffmpeg -v error -xerror -i "out/polish4-proof/moving-$segment.mp4" -f null -
            ffprobe -v error -show_streams -of json "out/polish4-proof/moving-$segment.mp4" \
              > "out/polish4-proof/moving-$segment.ffprobe.json"
          done
          cp out/stage/RELEASE_LOCK.json out/polish4-proof/PROOF_INPUT_LOCK.json
          cp out/stage/INPUT_SHA256SUMS.txt out/polish4-proof/INPUT_SHA256SUMS.txt
          printf '%s\n' 'Actual native Remotion+Three proofs, NOT final visual approval.' \
            'D must independently inspect all 12 stills and 6 moving clips and compare real POLISH03 master.' \
            'Do not advance release lock on technical pass alone.' > out/polish4-proof/READ_ME.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GPU-POLISH4-D-NATIVE-PROOFS
          path: out/polish4-proof/
          retention-days: 30
          if-no-files-found: error
      - name: Publish exact native proof run and artifact ID for D review
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const name='GPU-POLISH4-D-NATIVE-PROOFS';
            const files=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{
              owner:context.repo.owner,repo:context.repo.repo,run_id:context.runId,per_page:100
            });
            const artifact=files.find(a=>a.name===name&&!a.expired);
            if(!artifact)throw Error('Missing new native proof artifact');
            const path='gpu-decompose/polish4/manager/NATIVE_PROOF_RUN_POINTER.json';
            const out=JSON.stringify({headSha:context.sha,runId:context.runId,artifactId:artifact.id,artifactName:name,
              status:'UPLOADED_NOT_YET_VISUALLY_APPROVED'},null,2)+'\n';
            let sha;
            try{
              const old=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:'gpu-polish4/d-master'});
              sha=old.data.sha;
            }catch(e){if(e.status!==404)throw e;}
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,
              path,branch:'gpu-polish4/d-master',sha,message:'POLISH04 D: index exact native proof artifact',
              content:Buffer.from(out).toString('base64')});

  native-450-chunks:
    needs: stage-verified-input
    if: needs.stage-verified-input.outputs.phase == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: GPU-POLISH4-D-HASHED-INPUTS
          path: .
      - name: Render exactly one verified 90-frame native part
        env:
          PART: ${{ matrix.part }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npm install --no-audit --no-fund
          npm run check
          python3 gpu-decompose/polish4/manager/verify_polish4.py assets \
            public/gpu-decompose/polish4 out/stage/RELEASE_LOCK.json
          mkdir -p out/chunks
          START=$((PART*90))
          END=$((START+89))
          npx remotion render src/index.ts XfxSwiftDecomposition \
            "out/chunks/xfx-$PART.mp4" --frames="$START-$END" \
            --gl=swangle --codec=h264 --pixel-format=yuv420p --concurrency=2
          ffmpeg -v error -xerror -i "out/chunks/xfx-$PART.mp4" -f null -
          ffprobe -v error -show_entries stream=codec_name,nb_frames,width,height,pix_fmt,r_frame_rate \
            -of json "out/chunks/xfx-$PART.mp4" > "out/chunks/part-$PART.json"
          python3 - "$PART" <<'PY'
          import json,sys
          x=json.load(open('out/chunks/part-'+sys.argv[1]+'.json'))['streams'][0]
          assert (x['nb_frames'],x['width'],x['height'],x['r_frame_rate']) == ('90',1080,1920,'30/1'),x
          assert x['pix_fmt'] in ('yuv420p','yuvj420p'),x  # Remotion may emit legacy full-range 420; final encode must be yuv420p
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gpu-polish4-native-chunk-${{ matrix.part }}
          path: out/chunks/
          retention-days: 30
          if-no-files-found: error

  release-candidate:
    needs: [stage-verified-input, native-450-chunks]
    if: needs.stage-verified-input.outputs.phase == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: gpu-polish4-native-chunk-*
          merge-multiple: true
          path: out/chunks
      - uses: actions/download-artifact@v4
        with:
          name: GPU-POLISH4-D-HASHED-INPUTS
          path: .
      - name: Get true POLISH03 master for real matched comparison
        uses: actions/download-artifact@v4
        with:
          name: GPU-POLISH3-FINAL-450F-AUDIOPOLISHED
          run-id: 37837671314
          github-token: ${{ github.token }}
          path: out/reference03
      - name: Mux complete native H.264 450 frames with original mechanical sound
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          mkdir -p out/release
          : > out/concat.txt
          for part in 0 1 2 3 4; do
            F="out/chunks/xfx-$part.mp4"
            test -s "$F"
            test "$(ffprobe -v error -select_streams v:0 -show_entries stream=nb_frames -of csv=p=0 "$F")" = 90
            echo "file 'chunks/xfx-$part.mp4'" >> out/concat.txt
          done
          ffmpeg -v error -y -f concat -safe 0 -i out/concat.txt -c copy out/visual450.mp4
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=nb_frames -of csv=p=0 out/visual450.mp4)" = 450
          python3 gpu-decompose/polish4/manager/synthesize_mechanical_audio.py \
            out/mechanical.wav | tee out/release/audio-provenance.txt
          ffmpeg -v error -y -i out/visual450.mp4 -i out/mechanical.wav \
            -map 0:v:0 -map 1:a:0 -vf 'scale=in_range=auto:out_range=tv,format=yuv420p' -c:v libx264 -preset fast -crf 18 -pix_fmt yuv420p \
            -color_range tv -r 30 -c:a aac -b:a 192k -ar 48000 -ac 2 \
            -t 15 -movflags +faststart \
            out/release/XFX-SWIFT-RX9060XT-POLISH04-15S.mp4
          F=out/release/XFX-SWIFT-RX9060XT-POLISH04-15S.mp4
          ffmpeg -v error -xerror -i "$F" -f null -
          ffprobe -v error -show_streams -show_format -of json "$F" > out/release/ffprobe.json
          python3 - <<'PY'
          import json
          s=json.load(open('out/release/ffprobe.json'))
          v=[x for x in s['streams'] if x['codec_type']=='video']
          a=[x for x in s['streams'] if x['codec_type']=='audio']
          assert len(v)==1 and len(a)==1,s
          assert (v[0]['codec_name'],v[0]['pix_fmt'],v[0]['width'],v[0]['height'],v[0]['r_frame_rate'],v[0]['nb_frames'])==('h264','yuv420p',1080,1920,'30/1','450'),v
          assert (a[0]['codec_name'],a[0]['sample_rate'],a[0]['channels'])==('aac','48000',2),a
          assert abs(float(s['format']['duration'])-15)<.075,s
          print('FULL POSTMASTER FORMAT / FRAME ACCOUNTING / DECODE PASS')
          PY
          ffmpeg -hide_banner -i "$F" -vn -af volumedetect -f null - 2> out/release/audio-volumedetect.txt
          python3 - <<'PY'
          import re
          s=open('out/release/audio-volumedetect.txt').read()
          mean=float(re.findall(r'mean_volume:\s*(-?[\d.]+)',s)[-1])
          peak=float(re.findall(r'max_volume:\s*(-?[\d.]+)',s)[-1])
          print('Sound mean',mean,'peak',peak)
          assert -33 < mean < -11 and -25 < peak < -3, (mean,peak)
          PY
          ffmpeg -hide_banner -i "$F" -vf 'blackdetect=d=0.2:pix_th=0.03' -an -f null - 2> out/release/blackdetect.txt
          if grep -q 'black_start:' out/release/blackdetect.txt; then
            echo 'Entire/near black frames detected unexpectedly'; exit 1
          fi
          ffmpeg -hide_banner -i "$F" -vf 'freezedetect=n=-60dB:d=0.3' -an -f null - 2> out/release/freezedetect.txt
          for item in 'hero:30' 'hardware-macro:225' 'exploded:420'; do
            name=${item%%:*};frame=${item##*:}
            ffmpeg -v error -y -i "$F" -vf "select=eq(n\,$frame)" -vsync vfr -frames:v 1 "out/release/$name.png"
            test -s "out/release/$name.png"
          done
          OLD=out/reference03/XFX-SWIFT-RX9060XT-POLISH03-15S.mp4
          test -s "$OLD"
          ffmpeg -v error -y -i "$OLD" -vf 'select=eq(n\,365),scale=540:960' -vsync vfr -frames:v 1 out/old.png
          ffmpeg -v error -y -i "$F" -vf 'select=eq(n\,365),scale=540:960' -vsync vfr -frames:v 1 out/new.png
          ffmpeg -v error -y -i out/old.png -i out/new.png \
            -filter_complex "[0:v]drawtext=text='POLISH 03':fontcolor=white:fontsize=24:x=20:y=20[o];[1:v]drawtext=text='POLISH 04':fontcolor=white:fontsize=24:x=20:y=20[n];[o][n]hstack=inputs=2" \
            -frames:v 1 out/release/before-after.png
          cp out/stage/RELEASE_LOCK.json out/release/RELEASE_LOCK.json
          cp gpu-decompose/polish4/manager/NATIVE_VISUAL_REVIEW.md out/release/VISUAL_REVIEW.md
          cat > out/release/FINAL_RELEASE.md <<'EOF'
          # GPU POLISH04 candidate; INDEPENDENT FULL-FILM VISUAL REVIEW PENDING
          450 native Remotion/Three frames with model/motion/source SHA locks,
          H.264 yuv420p, AAC stereo 48 kHz, full FFmpeg decode and FFprobe PASS.
          Compare actual moving MP4 against baseline; final approval is reserved
          for independent manager download, pixel review and hash verification.
          Exterior XFX-reference based; hidden PCB/thermal design artistically reconstructed.
          EOF
          (cd out/release && sha256sum *.mp4 *.png) > out/release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GPU-POLISH4-FINAL-450F
          path: out/release/
          retention-days: 30
          if-no-files-found: error
      - name: Index exact final candidate artifact ID (NOT auto approval)
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const name='GPU-POLISH4-FINAL-450F';
            const files=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{
              owner:context.repo.owner,repo:context.repo.repo,run_id:context.runId,per_page:100
            });
            const artifact=files.find(a=>a.name===name&&!a.expired);
            if(!artifact)throw Error('Final artifact missing after upload');
            const path='gpu-decompose/polish4/manager/FINAL_RUN_POINTER.json';
            const out=JSON.stringify({runId:context.runId,headSha:context.sha,artifactId:artifact.id,
              artifactName:name,status:'RENDERED_AWAITING_INDEPENDENT_FINAL_VISUAL_QA'},null,2)+'\n';
            let sha;
            try{
              const old=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:'gpu-polish4/d-master'});
              sha=old.data.sha;
            }catch(e){if(e.status!==404)throw e;}
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,
              path,branch:'gpu-polish4/d-master',sha,message:'POLISH04 D: index native postmaster artifact',
              content:Buffer.from(out).toString('base64')});

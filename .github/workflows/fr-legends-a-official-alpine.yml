name: FR Legends A - Official Alpine 2013 HD Press Video
on:
  push:
    branches:
      - automotive-edits/french-icons-001/a-classics-footage
    paths:
      - 'production/videos/french-icons-001/agent_a_official_alpine_download.py'
      - '.github/workflows/fr-legends-a-official-alpine.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download-official-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg + Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install pillow
      - name: Download via official public publisher URL, decode, proof, ZIP
        run: |
          python production/videos/french-icons-001/agent_a_official_alpine_download.py
      - name: Print verified native original evidence
        run: |
          python - <<'PY'
          import pathlib,json,os
          m=json.loads(pathlib.Path('out/fr-agent-a-official-alpine/manifest.json').read_text())[0]
          s=["## Official Alpine Press historical original HD source",
             f"- Direct full-HD decoded: **{m['original_res_native_verified']}**",
             f"- Status: **{m['status']}**",
             f"- Probe: {json.dumps(m.get('probe'))}",
             f"- Error: {m.get('error','none')}",
             "- Unique camera angles independently reviewed: **0 (pending actual visual review)**"]
          pathlib.Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(s))
          print('\n'.join(s))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fr-legends-a-original-alpine-rally-hd-source-one-zip
          path: out/fr-legends-a-official-alpine-montecarlo.zip
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

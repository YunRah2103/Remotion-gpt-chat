name: Additional social native HD quality proof
on:
  push:
    branches: [feature/footage-rescue-multisource-20261011]
    paths:
      - '.github/workflows/extra-social-quality-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-best:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        sample: [snapchat, pinterest, twitch, bluesky, twitter3]
    name: "native quality - ${{ matrix.sample }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -q 'yt-dlp[default,curl-cffi]==2026.08.19'
      - name: Real media download at best native stream
        run: |
          python production/footage_rescue/extra_social_platform_test.py \
            --sample '${{ matrix.sample }}' --mode chrome --quality best --out out/report
      - name: Upload quality metadata without copied video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: social-best-${{ matrix.sample }}
          path: out/report/
          retention-days: 3
          if-no-files-found: warn

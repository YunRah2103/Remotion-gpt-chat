name: YUNEX V4 main integration acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/yunex/modelling-kit/**'
      - 'src/yunex/world-kit/**'
      - 'src/yunex/parts-kit/**'
      - 'src/yunex/studio-projects/**'
      - 'scripts/modelling-kit/**'
      - 'tests/modelling-kit/**'
      - '.github/workflows/yunex-v4-main-integration.yml'
      - 'package.json'
      - 'src/Root.tsx'
  push:
    branches: [main]
    paths:
      - 'src/yunex/modelling-kit/**'
      - 'scripts/modelling-kit/**'
      - '.github/workflows/yunex-v4-main-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests-and-fresh-agent-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check TypeScript
        run: npm run check
      - name: Test all studio families
        run: node --experimental-strip-types --test tests/modelling-kit/*.test.mjs tests/world-kit/*.test.mjs tests/parts-kit/*.test.mjs
      - name: Test Python tools
        run: python3 -m unittest discover -s tests/modelling-kit -p 'test_*.py'
      - name: Reproduce first-time agent path
        run: |
          npm run kit:catalog
          npm run kit:create -- v4-main-integration-smoke braking
          npm run kit:validate -- v4-main-integration-smoke
      - name: Install native dependencies
        run: bash scripts/modelling-kit/install-native-media.sh
      - name: Render actual moving MP4
        run: >-
          npx remotion render src/yunex/studio-projects/v4-main-integration-smoke/entry.tsx StudioEpisode
          out/studio/v4-main-integration-smoke.mp4
          --frames=0-59 --gl=swangle --codec=h264 --pixel-format=yuv420p
      - name: Verify actual H264, frames and changes
        run: |
          set -euo pipefail
          ffmpeg -v error -xerror -i out/studio/v4-main-integration-smoke.mp4 -f null -
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,nb_frames,width,height,r_frame_rate -of json out/studio/v4-main-integration-smoke.mp4 > out/studio/v4-main-integration-smoke-probe.json
          python3 - <<'PY'
          import json, subprocess, hashlib
          from pathlib import Path
          p = Path('out/studio/v4-main-integration-smoke.mp4')
          x = json.loads(Path('out/studio/v4-main-integration-smoke-probe.json').read_text())['streams'][0]
          assert x['codec_name']=='h264' and (x['width'],x['height'])==(1080,1920) and x['r_frame_rate']=='30/1'
          assert int(x['nb_frames'])==60, x
          r = subprocess.run(['ffmpeg','-v','error','-i',str(p),'-f','framemd5','-'],capture_output=True,text=True,check=True)
          digests=[line.rsplit(',',1)[-1].strip() for line in r.stdout.splitlines() if line and not line.startswith('#')]
          assert len(digests)==60 and len(set(digests))>10, (len(digests), len(set(digests)))
          print('Source revision verified by checkout. SHA256:',hashlib.sha256(p.read_bytes()).hexdigest(),'unique decoded frames:',len(set(digests)))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: YUNEX-V4-MAIN-NEW-AGENT-SMOKE
          path: out/studio/v4-main-integration-smoke*
          retention-days: 14

name: GPU Decomposition - visually approved public MP4 release
on:
  push:
    branches: [gpu-decompose/b-director]
    paths:
      - 'gpu-decompose/director/RELEASE_APPROVAL.json'
permissions:
  contents: write
  actions: read
jobs:
  publish-approved-video:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: approved
        name: Enforce exact reviewed candidate lock
        run: |
          set -euo pipefail
          test -s gpu-decompose/director/RELEASE_APPROVAL.json
          python3 - <<'PY'
          import json,re
          x=json.load(open('gpu-decompose/director/RELEASE_APPROVAL.json'))
          assert x['visualQA']=='PASS',x
          assert x['candidateRunId']>0
          assert re.fullmatch('[a-f0-9]{64}',x['mp4Sha256'])
          assert re.fullmatch('[a-f0-9]{40}',x['agentASha'])
          assert x['candidateArtifactName']=='GPU-DECOMPOSITION-FINAL-450F'
          print('VISUAL_QA_APPROVAL_LOCK_PASS')
          PY
          echo "run_id=$(jq -r .candidateRunId gpu-decompose/director/RELEASE_APPROVAL.json)" >> "$GITHUB_OUTPUT"
          echo "sha=$(jq -r .mp4Sha256 gpu-decompose/director/RELEASE_APPROVAL.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: GPU-DECOMPOSITION-FINAL-450F
          run-id: ${{ steps.approved.outputs.run_id }}
          github-token: ${{ github.token }}
          path: verified-film
      - name: Validate approved binary exactly before public publication
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          F=verified-film/XFX-SWIFT-RX9060XT-DECONSTRUCTED-15S.mp4
          test -s "$F"
          echo "${{ steps.approved.outputs.sha }}  $F" | sha256sum -c
          ffmpeg -v error -xerror -i "$F" -f null -
          python3 - <<'PY'
          import json
          p=json.load(open('verified-film/ffprobe.json'))
          v=next(x for x in p['streams'] if x['codec_type']=='video')
          a=next(x for x in p['streams'] if x['codec_type']=='audio')
          assert (v['codec_name'],v['nb_frames'],v['r_frame_rate'],v['width'],v['height'],v['pix_fmt']) == ('h264','450','30/1',1080,1920,'yuv420p'),v
          assert (a['codec_name'],a['sample_rate'],a['channels']) == ('aac','48000',2),a
          assert abs(float(p['format']['duration'])-15)<.075
          PY
      - name: Publish free downloadable GitHub Release and direct MP4 asset link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN="${{ steps.approved.outputs.run_id }}"
          TAG="gpu-decompose-15s-$RUN"
          gh release create "$TAG" \
            verified-film/XFX-SWIFT-RX9060XT-DECONSTRUCTED-15S.mp4 \
            verified-film/hero.png \
            verified-film/exploded.png \
            verified-film/QA.md \
            verified-film/SHA256SUMS.txt \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "XFX Swift RX 9060 XT — DECONSTRUCTED (15s)" \
            --notes "Visually approved 450-frame Remotion/Blender/Three.js GPU decomposition film. XFX Swift 16GB triple-fan black edition. Internals are approximately modelled, not factory CAD. Exact candidate run: $RUN. Source and SHA manifests included."
          gh release view "$TAG" --repo "${{ github.repository }}" --json url,assets | tee release-access.json
      - uses: actions/upload-artifact@v4
        with:
          name: GPU-DECOMPOSITION-PUBLIC-RELEASE-LINKS
          path: |
            release-access.json
            gpu-decompose/director/RELEASE_APPROVAL.json
          retention-days: 30
          if-no-files-found: error

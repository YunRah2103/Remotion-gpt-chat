name: FR Legends B - Combine Real Premium French Footage
on:
  push:
    branches: [automotive-edits/french-icons-001/b-modern-footage]
    paths:
      - production/videos/french-icons-001/agent-b/combine_premium_v3.py
      - .github/workflows/fr-legends-b-premium-v3.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  combine:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install decode/remux and verification tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check Pillow
          python -m py_compile production/videos/french-icons-001/agent-b/combine_premium_v3.py
      - name: Get two genuine approved/provisional source artifacts
        run: |
          set -euo pipefail
          mkdir -p out/clean-original out/bugatti-original
          gh run download 38150658481 -n FR-LEGENDS-001-AGENT-B-FINAL-VISUAL-QA -D out/clean-original --repo "${{ github.repository }}"
          gh run download 38152548136 -n FR-LEGENDS-B-MODEL-SPECIFIC-BUGATTI-MEDIA -D out/bugatti-original --repo "${{ github.repository }}"
          test -s out/clean-original/manifest.json
          test -s out/bugatti-original/manifest.json
      - name: Exclude CGI/studio and produce actual edited manufacturer footage
        run: python production/videos/french-icons-001/agent-b/combine_premium_v3.py
      - name: Upload one full-quality modern France footage bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FR-LEGENDS-001-B-REAL-MODERN-PREMIUM-V3
          path: out/fr-legends-b-modern-premium-v3/
          compression-level: 0
          retention-days: 14
          if-no-files-found: warn

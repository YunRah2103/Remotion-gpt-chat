name: French Legends C - real 60s muted Remotion edit
on:
  push:
    branches:
      - automotive-edits/french-icons-001/c-cinematic-edit
    paths:
      - 'src/Root.tsx'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  native-film:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: FFmpeg and Node dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg unzip
          npm ci --no-audit --no-fund
          npm run check
      - name: Mount canonical 42-clip real source archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p out/fr-legends-c/outer/inner
          curl -fL --retry 3 --retry-delay 5 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/YunRah2103/Remotion-gpt-chat/actions/artifacts/11713925779/zip" \
            -o out/fr-legends-c/outer.zip
          unzip -tq out/fr-legends-c/outer.zip
          unzip -q out/fr-legends-c/outer.zip -d out/fr-legends-c/outer/inner
          mapfile -d '' -t inner < <(find out/fr-legends-c/outer/inner -type f -name '*.zip' -print0)
          test "${#inner[@]}" -eq 1
          echo '46073d50fb4efe246b3e7ee1adee1601eec025a3aa2a07df45f038731218c533  '${inner[0]} | sha256sum -c -
          mkdir -p out/fr-legends-c/media
          unzip -q "${inner[0]}" -d out/fr-legends-c/media
          python production/videos/french-icons-001/agent-c/validate_edit.py | tee out/fr-legends-c/validation.json
          mkdir -p public
          mv out/fr-legends-c/media public/fr-legends
          rm -rf out/fr-legends-c/outer out/fr-legends-c/outer.zip
      - name: Render two-second native moving-film smoke proof
        run: |
          mkdir -p out/fr-legends-c
          npx remotion render src/index.ts FrenchLegendsLandscape \
            out/fr-legends-c/first-4sec.mp4 --frames=0-119 \
            --codec=h264 --pixel-format=yuv420p --gl=swangle \
            --concurrency=2 --crf=20
          ffmpeg -v error -xerror -i out/fr-legends-c/first-4sec.mp4 -f null -
      - name: Render full 60-second 1920x1080 muted picture edit
        run: |
          npx remotion render src/index.ts FrenchLegendsLandscape \
            out/fr-legends-c/FRENCH_LEGENDS_C_SILENT_1080P.mp4 \
            --codec=h264 --pixel-format=yuv420p --gl=swangle \
            --concurrency=2 --crf=18
      - name: Full decode, exact frame, and visual contact evidence
        run: |
          set -euo pipefail
          FILM=out/fr-legends-c/FRENCH_LEGENDS_C_SILENT_1080P.mp4
          ffmpeg -v error -xerror -i "$FILM" -f null -
          ffprobe -v error -show_format -show_streams -of json "$FILM" > out/fr-legends-c/final_ffprobe.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('out/fr-legends-c/final_ffprobe.json').read_text())
          video=next(s for s in d['streams'] if s['codec_type']=='video')
          fps=video['r_frame_rate']
          assert (video['width'],video['height'],fps)==(1920,1080,'30/1'), (video['width'],video['height'],fps)
          assert int(video.get('nb_frames',0))==1800,video
          assert abs(float(d['format']['duration'])-60.0)<0.04,d['format']['duration']
          assert not [s for s in d['streams'] if s['codec_type']=='audio'], 'Agent C proof must be silent: exact music belongs to D'
          Path('out/fr-legends-c/PREVIEW_QA.md').write_text(
            '# French Legends C: real native film proof\n\n'
            '1920x1080 / 30fps / 1800 frames / 60s / H.264; full decoded video verified.\n'
            'This is MUTED picture edit, not final music-synchronised deliverable.\n'
            'Source: canonical 42-clip verified package artifact 11713925779.\n'
            'Original exact song not provided to Agent C; lyric timing not certified.\n'
            'Publication rights remain unverified.\n'
          )
          PY
          ffmpeg -hide_banner -loglevel error -y -i "$FILM" \
            -vf "fps=1/3,scale=320:180,tile=5x4" -frames:v 1 \
            out/fr-legends-c/FINAL_DECODED_FILM_CONTACT_SHEET.jpg
          test -s out/fr-legends-c/FINAL_DECODED_FILM_CONTACT_SHEET.jpg
      - name: Persist visual QA proof on editor branch
        run: |
          set -euo pipefail
          cp out/fr-legends-c/FINAL_DECODED_FILM_CONTACT_SHEET.jpg production/videos/french-icons-001/agent-c/
          cp out/fr-legends-c/PREVIEW_QA.md production/videos/french-icons-001/agent-c/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production/videos/french-icons-001/agent-c/FINAL_DECODED_FILM_CONTACT_SHEET.jpg
          git add production/videos/french-icons-001/agent-c/PREVIEW_QA.md
          git commit -m "qa(fr-legends-c): verified 60s muted native render with decoded visual evidence"
          git push origin HEAD:automotive-edits/french-icons-001/c-cinematic-edit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FR-LEGENDS-C-REAL-EDIT-${{ github.run_id }}
          path: |
            out/fr-legends-c/FRENCH_LEGENDS_C_SILENT_1080P.mp4
            out/fr-legends-c/first-4sec.mp4
            out/fr-legends-c/final_ffprobe.json
            out/fr-legends-c/FINAL_DECODED_FILM_CONTACT_SHEET.jpg
            out/fr-legends-c/PREVIEW_QA.md
            out/fr-legends-c/validation.json
          retention-days: 14
          if-no-files-found: warn

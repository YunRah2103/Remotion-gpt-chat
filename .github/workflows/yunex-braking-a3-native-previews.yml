name: YUNEX Braking A3 - Native Camera MP4 Proof
on:
  push:
    branches:
      - agent/braking-200kmh-001-cameras
    paths:
      - 'src/yunex/braking200/cameras/**'
      - '.github/workflows/yunex-braking-a3-native-previews.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: yunex-braking-a3-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-3d-camera-proofs:
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned packages and FFmpeg
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          npm ci --no-audit --no-fund
      - name: Verify TS, kit compatibility and A3 seek stability
        run: |
          set -euo pipefail
          npm run check
          npm run worldkit:test
          node --experimental-strip-types --test src/yunex/braking200/cameras/cameraRig.test.mjs
      - name: Render two real 3D Remotion camera previews
        run: |
          set -euo pipefail
          mkdir -p out/braking-a3/stills
          npx remotion render src/yunex/braking200/cameras/entry.tsx BrakingA3Macro \
            out/braking-a3/macro-native.mp4 --gl=swangle --codec=h264 \
            --pixel-format=yuv420p --scale=0.5 --concurrency=1
          npx remotion render src/yunex/braking200/cameras/entry.tsx BrakingA3Track \
            out/braking-a3/track-native.mp4 --gl=swangle --codec=h264 \
            --pixel-format=yuv420p --scale=0.5 --concurrency=1
      - name: Full-file decoding, metadata, frames and portrait confirmation
        shell: bash
        run: |
          set -euo pipefail
          for clip in macro track; do
            ffprobe -v error -show_entries stream=codec_name,pix_fmt,width,height,nb_frames,r_frame_rate \
              -select_streams v:0 -of json "out/braking-a3/${clip}-native.mp4" \
              > "out/braking-a3/${clip}-ffprobe.json"
            ffmpeg -v error -xerror -i "out/braking-a3/${clip}-native.mp4" -f null -
            sha256sum "out/braking-a3/${clip}-native.mp4" \
              >> out/braking-a3/SHA256SUMS.txt
          done
          python - <<'PY'
          import json
          from pathlib import Path
          for name,frames in [('macro',195),('track',240)]:
              d=json.loads(Path('out/braking-a3/'+name+'-ffprobe.json').read_text())['streams'][0]
              assert int(d['width'])==540 and int(d['height'])==960, d
              assert int(d['nb_frames'])==frames, d
              assert d['codec_name']=='h264' and d['pix_fmt']=='yuv420p', d
              assert d['r_frame_rate']=='30/1', d
              print(name,'NATIVE A3 PROOF VERIFIED',frames,'frames 540x960 30fps')
          PY
          for spec in "macro:0.4" "macro:2.2" "macro:4.7" \
                      "track:0.4" "track:2.8" "track:6.8"; do
            clip="${spec%%:*}"; t="${spec#*:}"
            ffmpeg -hide_banner -loglevel error -y \
              -ss "${t}" -i "out/braking-a3/${clip}-native.mp4" -frames:v 1 \
              "out/braking-a3/stills/${clip}-${t}.png"
          done
          npx remotion still src/yunex/braking200/cameras/entry.tsx BrakingA3Track \
            out/braking-a3/stills/track-phone-full-1080x1920.png --frame=18 --gl=swangle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: YUNEX-BRAKING-A3-NATIVE-CAMERA-PROOFS
          path: out/braking-a3/
          retention-days: 30
          if-no-files-found: warn

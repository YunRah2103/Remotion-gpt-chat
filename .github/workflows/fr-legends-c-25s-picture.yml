name: French Legends Agent C - real 25s picture recut
on:
  push:
    branches:
      - automotive-edits/french-icons-001/c-cinematic-edit
    paths:
      - '.github/workflows/fr-legends-c-25s-picture.yml'
      - 'production/videos/french-icons-001/agent-c/25S_CUT_SHOTMAP.json'
      - 'production/videos/french-icons-001/agent-c/render_25s_picture.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  render-25s:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg unzip
      - name: Get actual approved 60s muted picture
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p out/fr-legends-25/source
          curl --fail --location --retry 3 --retry-delay 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/YunRah2103/Remotion-gpt-chat/actions/artifacts/11720519374/zip" \
            -o out/fr-legends-25/source/artifact.zip
          unzip -tq out/fr-legends-25/source/artifact.zip
          unzip -q out/fr-legends-25/source/artifact.zip -d out/fr-legends-25/source/media
          find out/fr-legends-25/source/media -name '*.mp4' -type f -print
      - name: Render genuine picture-only 25s cut and check real frames
        run: |
          set -euo pipefail
          source_file=$(find out/fr-legends-25/source/media -name 'FRENCH_LEGENDS_C_MUTED_FAST_1080P.mp4' -type f -print -quit)
          test -n "$source_file"
          python3 production/videos/french-icons-001/agent-c/render_25s_picture.py "$source_file" out/fr-legends-25/delivery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FR-LEGENDS-C-25S-MUTED-PICTURE-${{ github.run_id }}
          path: |
            out/fr-legends-25/delivery/YUNEX_FR_LEGENDS_25SEC_MUTED_1080P.mp4
            out/fr-legends-25/delivery/real_decoded_contact_sheet.jpg
            out/fr-legends-25/delivery/qa_report.json
            production/videos/french-icons-001/agent-c/25S_CUT_SHOTMAP.json
          retention-days: 14
          if-no-files-found: warn

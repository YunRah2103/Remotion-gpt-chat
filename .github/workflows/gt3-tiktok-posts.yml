name: YUNEX GT3 Public TikTok Individual Racing Post Source Test
on:
  push:
    branches:
      - automotive-edits/gt3-nurburgring-multicar-001/a-footage
    paths:
      - .github/workflows/gt3-tiktok-posts.yml
      - production/videos/gt3-nurburgring-multicar-001/agent-a/probe_public_tiktok.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Install source probe tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -q requests
      - name: Test public individual race-video candidates, true 1080p
        run: python production/videos/gt3-nurburgring-multicar-001/agent-a/probe_public_tiktok.py
      - name: Upload ACTUAL MP4 only if decoded at native 1080p, plus JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GT3-TIKTOK-SOURCE-QA-INDIVIDUAL-POSTS
          path: out/gt3-tiktok-public/
          retention-days: 7
          compression-level: 0
          if-no-files-found: warn

name: GT3 Agent A V8 All Actual Native Media Plus Two Identified GT3 R 4K Angles
on:
  push:
    branches: [automotive-edits/gt3-nurburgring-multicar-001/a-footage]
    paths: [.github/workflows/gt3-a-v8-two-2026-gt3r-proof.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  complete-new-source-v8:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Video SHA and real full-decode dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Download actual V7 source film library from successful GitHub Actions artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs/v7-real-physical-media
          gh run download 38156968607 --repo YunRah2103/Remotion-gpt-chat --name GT3-MULTICAR-REAL-NATIVE-V7-ONE-ZIP-5-MAKES-19-VIEWS-PLUS-4-NEW-REAL-REVIEW-MEDIA --dir inputs/v7-real-physical-media
          find inputs/v7-real-physical-media -name COMBINED_GLOBAL_MANIFEST_V7.json -print
      - name: Preserve V7 physical media and validate two newly identified Porsche GT3 R native videos
        run: python -u production/videos/gt3-nurburgring-multicar-001/agent-a/promote_2026_verified_gt3r_4k_v8.py
      - name: Verify final V8 photo/video manifest exact newly approved SHA values
        run: |
          python - <<'PY'
          import json,hashlib,pathlib
          p=pathlib.Path('out/gt3-multicar-native-real-v8-21-approved-cameras')
          j=json.loads((p/'COMBINED_GLOBAL_MANIFEST_V8.json').read_text())
          assert j['confirmed_landscape_gt3_camera_angles_v8']==21
          assert j['landscape_confirmed_makes_count']==5
          assert len(j['approved_new_cameras'])==2
          for v in j['approved_new_cameras']:
            movie=p/v['editor_ready_approved_video_path']
            assert movie.is_file() and movie.stat().st_size>100000
            h=hashlib.sha256(movie.read_bytes()).hexdigest()
            assert h==v['approved_original_physical_video_sha256']
            assert v['native_pixels']==[3840,2160]
            print('REAL_APPROVED_GT3R_MOVIE_SHA_PASS',v['id'],h)
          print('V8_FULL_SOURCE_GATE_BLOCKED_5_OF_6_MAKES_21_OF_24_CAMERAS')
          PY
      - name: Deliver ONE byte-complete real media original package, V8
        uses: actions/upload-artifact@v4
        with:
          name: GT3-MULTICAR-REAL-NATIVE-V8-ONE-ZIP-5-MAKES-21-PROVEN-CAMERAS
          path: out/gt3-multicar-native-real-v8-21-approved-cameras/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Communicate strict unfinished footage release gate
        if: always()
        run: |
          python - <<'PY'
          import pathlib,json,os
          p=pathlib.Path('out/gt3-multicar-native-real-v8-21-approved-cameras/COMBINED_GLOBAL_MANIFEST_V8.json')
          if p.exists():
            j=json.loads(p.read_text())
            msg=f"V8 real media: {j['landscape_confirmed_makes_count']}/{j['landscape_required_makes_count']} verified GT3 landscape makes; {j['confirmed_landscape_gt3_camera_angles_v8']}/{j['landscape_required_camera_angles']} independently recognized scenes. Footage Gate A STILL BLOCKED. Two new native 4K Porsche GT3 R #24/#4 camera angles verified.\n"
          else:msg='No valid V8 media package delivered; source execution failed.\n'
          pathlib.Path(os.environ['GITHUB_STEP_SUMMARY']).write_text(msg)
          PY

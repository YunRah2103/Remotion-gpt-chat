name: YUNEX GT3 Social Post and Porsche 4K Discovery
on:
  push:
    branches:
      - automotive-edits/gt3-nurburgring-multicar-001/a-footage
    paths:
      - .github/workflows/gt3-post-search.yml
      - production/videos/gt3-nurburgring-multicar-001/agent-a/discover_actual_posts.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Install fast metadata discovery tools
        run: python -m pip install -q requests beautifulsoup4
      - name: Search actual social posts and original Porsche articles
        timeout-minutes: 12
        run: python production/videos/gt3-nurburgring-multicar-001/agent-a/discover_actual_posts.py out/gt3-discovery
      - name: Publish verifiable discovery (NOT media)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GT3-SOCIAL-POST-AND-OFFICIAL-DIRECT-URL-LEADS
          path: out/gt3-discovery/
          retention-days: 7

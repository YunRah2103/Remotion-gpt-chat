name: BMW M4 G82 Blender 360
on:
  push:
    branches: [experiments/bmw-m4-g82-blender-turntable]
    paths: ['production/experiments/bmw-m4-g82/**', '.github/workflows/m4-g82-blender.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and FFmpeg
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender ffmpeg
          blender --version | head -2
      - name: Build editable Blender model and render native orbit
        env:
          M4_RENDER: '1'
        run: |
          set -euo pipefail
          blender -b -t 4 --python production/experiments/bmw-m4-g82/scene.py | tee blender.log
          test -s out/m4-g82/BMW_M4_G82.blend
          test "$(find out/m4-g82/frames -name 'frame_*.png' | wc -l)" -eq 144
      - name: Encode and decode MP4
        run: |
          set -euo pipefail
          cd out/m4-g82
          cp frames/frame_0001.png first_frame.png
          ffmpeg -hide_banner -loglevel error -y -framerate 24 -start_number 1 -i frames/frame_%04d.png -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -movflags +faststart BMW_M4_G82_360.mp4
          ffmpeg -v error -xerror -i BMW_M4_G82_360.mp4 -f null -
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,nb_frames,avg_frame_rate -of json BMW_M4_G82_360.mp4 | tee qa.json
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=nb_frames -of csv=p=0 BMW_M4_G82_360.mp4)" -eq 144
          sha256sum BMW_M4_G82_360.mp4 BMW_M4_G82.blend > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BMW-M4-G82-BLENDER-TURNTABLE
          path: |
            out/m4-g82/BMW_M4_G82_360.mp4
            out/m4-g82/BMW_M4_G82.blend
            out/m4-g82/first_frame.png
            out/m4-g82/qa.json
            out/m4-g82/SHA256SUMS.txt
            blender.log
          if-no-files-found: warn
          retention-days: 30

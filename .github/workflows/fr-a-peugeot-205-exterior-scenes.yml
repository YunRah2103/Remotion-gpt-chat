name: FR Legends A - Peugeot 205 GTI Exact Exterior Driving Motion QA
on:
  push:
    branches: [automotive-edits/french-icons-001/a-classics-footage]
    paths:
      - 'production/videos/french-icons-001/agent_a_205_exterior_precise.py'
      - '.github/workflows/fr-a-peugeot-205-exterior-scenes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-real-car-motion:
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original source motion inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install Pillow
      - name: Fetch original Peugeot 205 GTI documentary and inspect genuine exterior follow/front source scenes at 1s intervals
        run: python production/videos/french-icons-001/agent_a_205_exterior_precise.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FR-LEGENDS-A-PEUGEOT-205-GTI-TWO-REAL-EXTERIOR-ANGLE-VIDEO-QA
          path: out/FR-A-205-GTI-TWO-EXTERIOR-ANGLE-ORIGINAL-REAL-QA.zip
          retention-days: 7
          compression-level: 0
          if-no-files-found: warn

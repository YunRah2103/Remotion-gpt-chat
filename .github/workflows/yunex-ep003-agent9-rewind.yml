name: YUNEX EP003 Agent 9 — Native Rewind Motion QA
on:
  push:
    branches: [agent/ep003-09-rewind-story]
    paths:
      - '.github/workflows/yunex-ep003-agent9-rewind.yml'
      - 'production/yunex/tyre_blowout_ep003/rewind/**'
      - 'previews/agent-9/**'
      - 'tests/agent-9/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ep003-agent9-branch-rewind
  cancel-in-progress: true
jobs:
  development-motion-proof:
    name: Agent9 real A8 impact+damage reversal and controlled original A2 restart
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install FFmpeg, pinned npm and browser runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          npm ci --no-audit --no-fund
      - name: Hydrate A1-A5 and A8 original exact pinned commits — NO branch merge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p previews/agent-9/out
          cat >/tmp/agent9pins <<'PINS'
          agent/ep003-01-mechanics mechanics 7d47746d2fc584e935b5a9766eb1150e5b3dac38 1
          agent/ep003-02-dynamics dynamics e724786fc087b080e9de19e9e26bda6a815ce276 2
          agent/ep003-03-cinema cinema 938628271f9b50d975ee55491881a8fd2d4807a5 3
          agent/ep003-04-look look a44f1b6c9c31105edd1a9b0d2de7f233d1223952 4
          agent/ep003-05-story story cd03c64f77705aa03ee5d5071e5cf18c669fa4ea 5
          agent/ep003-08-crash-vfx impact 8e703e70218e9c0b9e9b7768112f2d8388ae31c8 8
          PINS
          while read -r agent folder pin number; do
            git fetch --no-tags --depth=160 origin "refs/heads/$agent"
            git cat-file -e "$pin^{commit}" || { echo "::error::Cannot hydrate immutable source $pin"; exit 1; }
            git restore --source="$pin" --worktree -- "production/yunex/tyre_blowout_ep003/$folder/"
            if git cat-file -e "$pin:tests/agent-$number" 2>/dev/null; then
              git restore --source="$pin" --worktree -- "tests/agent-$number/"
            fi
            echo "SOURCE $number $folder $pin" | tee -a previews/agent-9/out/provenance.txt
          done </tmp/agent9pins
          echo "AGENT9 $(git rev-parse HEAD)" >>previews/agent-9/out/provenance.txt
          for file in \
            mechanics/tyreRig.ts \
            dynamics/model.ts \
            cinema/scene.tsx \
            look/world.tsx \
            story/SteadyHands3D.tsx \
            impact/model.ts \
            impact/Preview.tsx; do
              test -s "production/yunex/tyre_blowout_ep003/$file"
          done
          echo "REAL INTEGRATION: Agent8 impact SHA 8e703e70218e9c0b9e9b7768112f2d8388ae31c8 + original A1-A5 source; explicit native QA pending." \
            | tee previews/agent-9/out/approval-status.txt
      - name: TypeScript, A8 model, source restart/reverse mechanics tests
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm run worldkit:test
          npm run partskit:test
          node --experimental-strip-types --test tests/agent-9/*.test.mjs
          node --experimental-strip-types --test tests/agent-8/*.test.mjs
      - name: Render real early portrait motion inspection frames
        shell: bash
        run: |
          set -euo pipefail
          entry=production/yunex/tyre_blowout_ep003/rewind/entry.tsx
          npx --no-install remotion still "$entry" EP003Agent9ImpactRewind \
            previews/agent-9/out/impact-rewind-early.png \
            --frame=39 --scale=0.5 --gl=swangle
          npx --no-install remotion still "$entry" EP003Agent9ImpactRewind \
            previews/agent-9/out/impact-rewind-reverse.png \
            --frame=90 --scale=0.5 --gl=swangle
          npx --no-install remotion still "$entry" EP003Agent9BranchCompare \
            previews/agent-9/out/control-hands.png \
            --frame=135 --scale=0.5 --gl=swangle
      - name: Upload actual intermediate frame evidence
        uses: actions/upload-artifact@v4
        with:
          name: EP003-AGENT9-A8-EARLY-IMAGES-${{ github.run_id }}
          path: |
            previews/agent-9/out/*.png
            previews/agent-9/out/provenance.txt
            previews/agent-9/out/approval-status.txt
          retention-days: 30
          if-no-files-found: warn
      - name: Render TWO genuinely moving original-GT portrait MP4s
        shell: bash
        run: |
          set -euo pipefail
          entry=production/yunex/tyre_blowout_ep003/rewind/entry.tsx
          npx --no-install remotion render "$entry" EP003Agent9ImpactRewind \
            previews/agent-9/out/impact-rewind.mp4 --scale=0.5 --gl=swangle \
            --codec=h264 --pixel-format=yuv420p --concurrency=1
          npx --no-install remotion render "$entry" EP003Agent9BranchCompare \
            previews/agent-9/out/branch-compare.mp4 --scale=0.5 --gl=swangle \
            --codec=h264 --pixel-format=yuv420p --concurrency=1
      - name: FFprobe exact 30 FPS / full FFmpeg decoding / actual non-static movement / contact sheets
        run: |
          set -euo pipefail
          python3 previews/agent-9/verify_previews.py previews/agent-9/out
      - name: Publish two actual A8 damage-rewind and controlled-restart MP4s after verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EP003-AGENT9-REAL-A8-REWIND-${{ github.run_id }}
          path: previews/agent-9/out/
          retention-days: 30
          if-no-files-found: warn

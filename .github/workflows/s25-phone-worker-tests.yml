name: YUNEX S25 worker V2 offline QA
on:
  push:
    branches: [experiments/s25-footage-worker-v2-20261012]
    paths:
      - 'production/phone_footage/**'
      - '.github/workflows/s25-phone-worker-tests.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  validate-phone-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg and verify Node
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          node --version && ffmpeg -version | head -1
      - name: Run queue contract and real encoding tests
        run: |
          python -m unittest discover -s production/phone_footage -p test_worker.py -v
      - name: Verify queued GitHub Issue is machine-readable (no phone download)
        env:
          YUNEX_READ_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          printf '%s' "$YUNEX_READ_TOKEN" > "$RUNNER_TEMP/yunex-issue-read-token"
          chmod 600 "$RUNNER_TEMP/yunex-issue-read-token"
          YUNEX_GH_TOKEN_FILE="$RUNNER_TEMP/yunex-issue-read-token" python production/phone_footage/worker.py --once --dry-run
      - name: Syntax compile phone worker
        run: |
          python -m py_compile production/phone_footage/worker.py

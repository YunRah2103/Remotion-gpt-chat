name: STO Agent B V5 driving-first smooth outro native QA
on:
  push:
    branches:
      - automotive-edits/huracan-sto-v10-001/b-edit
    paths:
      - 'production/videos/huracan-sto-v10-001/shot-map-v5.json'
      - 'production/videos/huracan-sto-v10-001/prepare_v5_assets.py'
      - 'production/videos/huracan-sto-v10-001/edit-v5.test.cjs'
      - 'src/huracan/HuracanStoV5.tsx'
      - '.github/workflows/sto-agent-b-v5.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-candidate-picture:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: FFmpeg installed
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: node --test production/videos/huracan-sto-v10-001/edit-v5.test.cjs
      - name: Acquire publisher original already identified in user's provided ZIP and verify exact SHA
        run: |
          mkdir -p out
          python - <<'PY'
          import urllib.request,hashlib,json,time
          from pathlib import Path
          m=json.loads(Path('production/videos/huracan-sto-v10-001/shot-map-v5.json').read_text())
          url='https://format67.net/wp-content/uploads/2024/08/STO_FORMAT.mp4'
          for attempt in range(3):
              try:
                  request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(request,timeout=120) as r:payload=r.read()
                  if hashlib.sha256(payload).hexdigest()!=m['sourceSha256']:raise RuntimeError('ORIGINAL_BYTES_MISMATCH')
                  Path('out/format67-original.mp4').write_bytes(payload)
                  print('V5_ORIGINAL_FILM_SHA_PASS',len(payload))
                  break
              except Exception:
                  if attempt==2:raise
                  time.sleep(4)
          PY
      - name: Prepare user-curated moving shots without letterbox or source re-stretching
        run: |
          python production/videos/huracan-sto-v10-001/prepare_v5_assets.py --source out/format67-original.mp4
      - name: Native Remotion 1920x1080 silent candidate render
        run: |
          npx remotion render src/index.ts HuracanSTOV5Candidate out/STO-V5-NATIVE-DRIVE-FIRST-SMOOTH-END-SILENT.mp4 --codec=h264 --pixel-format=yuv420p --concurrency=2
      - name: Decode all frames, aspect, and fade ending QA
        run: |
          ffmpeg -hide_banner -v error -xerror -i out/STO-V5-NATIVE-DRIVE-FIRST-SMOOTH-END-SILENT.mp4 -f null -
          python - <<'PY'
          import json,hashlib,subprocess
          from pathlib import Path
          mp4=Path('out/STO-V5-NATIVE-DRIVE-FIRST-SMOOTH-END-SILENT.mp4')
          p=json.loads(subprocess.check_output(['ffprobe','-v','error','-count_frames','-show_entries','stream=codec_name,width,height,avg_frame_rate,nb_read_frames:format=duration','-of','json',str(mp4)]))
          v=p['streams'][0]
          assert (v['width'],v['height'],v['avg_frame_rate'],int(v['nb_read_frames']))==(1920,1080,'30/1',316),p
          p['sha256']=hashlib.sha256(mp4.read_bytes()).hexdigest()
          p['status']='B_NATIVE_PICTURE_TECHNICAL_QA_PASS__A_DISTINCT_ANGLE_GATE_UNPASSED'
          Path('out/V5-TECHNICAL-QA.json').write_text(json.dumps(p,indent=2))
          print(p['status'],p['sha256'])
          PY
          ffmpeg -v error -y -ss 0 -i out/STO-V5-NATIVE-DRIVE-FIRST-SMOOTH-END-SILENT.mp4 -frames:v 1 out/V5-FIRST-FRAME.jpg
          ffmpeg -v error -y -ss 10.2 -i out/STO-V5-NATIVE-DRIVE-FIRST-SMOOTH-END-SILENT.mp4 -frames:v 1 out/V5-FINAL-FADE-FRAME.jpg
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: STO-AGENT-B-V5-DRIVE-FIRST-SMOOTH-OUTRO-NATIVE-CANDIDATE
          path: |
            out/STO-V5-NATIVE-DRIVE-FIRST-SMOOTH-END-SILENT.mp4
            out/V5-TECHNICAL-QA.json
            out/V5-FIRST-FRAME.jpg
            out/V5-FINAL-FADE-FRAME.jpg
          retention-days: 4
          if-no-files-found: warn

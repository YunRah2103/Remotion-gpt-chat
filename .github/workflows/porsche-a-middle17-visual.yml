name: Porsche A - actual middle seventeen video motion review
on:
  push:
    branches:
      - automotive-edits/porsche-911-turbo-evolution-001/a-footage
    paths:
      - '.github/workflows/porsche-a-middle17-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  review-real-seventeen-candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Retrieve actual 17 clip frames from prior source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/11673813114/zip > /tmp/footage.zip
          MEMBER=$(unzip -Z1 /tmp/footage.zip | grep 'middle-17-contact-sheet.jpg' | head -1)
          test -n "$MEMBER"
          unzip -p /tmp/footage.zip "$MEMBER" > /tmp/middle17.jpg
          python - <<'PY'
          import base64
          from pathlib import Path
          p=Path('/tmp/middle17.jpg')
          print('MIDDLE17_PROOF_BYTES:'+str(p.stat().st_size))
          x=base64.b64encode(p.read_bytes()).decode()
          for i in range(0,len(x),4000):
              print('MIDDLE17_IMAGE_PART:'+x[i:i+4000])
          PY

name: EP003 Agent 8 - Actual Crash Video QA
on:
  push:
    branches: [agent/ep003-08-crash-vfx]
    paths:
      - 'production/yunex/tyre_blowout_ep003/impact/**'
      - 'tests/agent-8/**'
      - '.github/workflows/yunex-ep003-agent8-crash.yml'
  pull_request:
    branches: [production/yunex-ep003-base]
    paths:
      - 'production/yunex/tyre_blowout_ep003/impact/**'
      - 'tests/agent-8/**'
      - '.github/workflows/yunex-ep003-agent8-crash.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pull-requests: write
concurrency:
  group: ep003-agent8-${{ github.ref }}
  cancel-in-progress: true
jobs:
  agent8-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 155
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install FFmpeg, dependencies, Chromium for software GL
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffmpeg
          command -v ffprobe
          npm ci --no-audit --no-fund
          npx --no-install remotion browser ensure
      - name: Check entire TS repository, crash regression, original kits
        run: |
          set -euxo pipefail
          npm run check
          node --experimental-strip-types --test tests/agent-8/*.test.mjs
          npm run worldkit:test
          npm run partskit:test
      - name: Hydrate immutable actual A1 rubber, A2 physics and A4 highway
        run: |
          set -euxo pipefail
          mkdir -p out/agent-8
          cat > /tmp/agent8-pins <<'PINS'
          agent/ep003-01-mechanics mechanics 7d47746d2fc584e935b5a9766eb1150e5b3dac38
          agent/ep003-02-dynamics dynamics e724786fc087b080e9de19e9e26bda6a815ce276
          agent/ep003-04-look look a44f1b6c9c31105edd1a9b0d2de7f233d1223952
          PINS
          while read -r branch folder sha; do
            git fetch --no-tags --depth=160 origin "refs/heads/$branch"
            git cat-file -e "$sha^{commit}"
            git restore --source="$sha" --worktree -- "production/yunex/tyre_blowout_ep003/$folder/"
            printf '%s %s\n' "$folder" "$sha" >> out/agent-8/integration-pins.txt
          done < /tmp/agent8-pins
          node --experimental-strip-types production/yunex/tyre_blowout_ep003/impact/verify-hydrated.mjs \
            | tee out/agent-8/integrated-physics-proof.json
      - name: Render six authoritative contact frames, from pre-hit through bent steel
        run: |
          set -euxo pipefail
          HYDRO=production/yunex/tyre_blowout_ep003/impact/HydratedEntry.tsx
          for frame in 51 57 59 62 66 75; do
            npx --no-install remotion still "$HYDRO" EP003Agent8HydratedCrash \
              "out/agent-8/Hydrated-impact-frame-$frame.png" --frame="$frame" \
              --gl=swangle --scale=0.35 --log=error
          done
      - name: Upload EARLY visible contact stills for artistic QA
        uses: actions/upload-artifact@v4
        with:
          name: EP003-agent8-impact-stills
          path: |
            out/agent-8/Hydrated-impact-frame-*.png
            out/agent-8/integrated-physics-proof.json
            out/agent-8/integration-pins.txt
          retention-days: 30
          if-no-files-found: error
      - name: Render authoritative A1 A2 A4 integrated crash FIRST
        run: |
          set -euxo pipefail
          git rev-parse HEAD > out/agent-8/source-sha.txt
          HYDRO=production/yunex/tyre_blowout_ep003/impact/HydratedEntry.tsx
          npx --no-install remotion render "$HYDRO" EP003Agent8HydratedCrash \
            out/agent-8/EP003Agent8HydratedCrash.mp4 \
            --gl=swangle --scale=0.35 --codec=h264 --pixel-format=yuv420p \
            --concurrency=1 --log=error
          ffprobe -v error -show_entries stream=codec_name,width,height,avg_frame_rate,nb_frames \
            -of json out/agent-8/EP003Agent8HydratedCrash.mp4 > out/agent-8/hydrated-ffprobe.json
          ffmpeg -v error -xerror -i out/agent-8/EP003Agent8HydratedCrash.mp4 -f null -
      - name: Upload EARLY decoded A1 A2 A4 integrated moving H264 preview
        uses: actions/upload-artifact@v4
        with:
          name: EP003-agent8-hydrated-first
          path: |
            out/agent-8/EP003Agent8HydratedCrash.mp4
            out/agent-8/Hydrated-impact-frame-*.png
            out/agent-8/hydrated-ffprobe.json
            out/agent-8/integrated-physics-proof.json
            out/agent-8/integration-pins.txt
            out/agent-8/source-sha.txt
          retention-days: 30
          if-no-files-found: error
      - name: Render integrated original-GT close contact and bent-rail aftermath
        run: |
          set -euxo pipefail
          ENTRY=production/yunex/tyre_blowout_ep003/impact/entry.tsx
          npx --no-install remotion render "$ENTRY" EP003Agent8ImpactClose \
            out/agent-8/EP003Agent8ImpactClose.mp4 \
            --gl=swangle --scale=0.35 --codec=h264 --pixel-format=yuv420p \
            --concurrency=1 --log=error
      - name: FFprobe, full decode, time-separated frames and motion proof
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import pathlib,json,subprocess,hashlib
          root=pathlib.Path("out/agent-8")
          rows=[]
          for name,frames in [("EP003Agent8HydratedCrash",120),("EP003Agent8ImpactClose",100)]:
              path=root/(name+".mp4")
              assert path.is_file() and path.stat().st_size>20000,path
              data=json.loads(subprocess.check_output(
                  ["ffprobe","-v","error","-show_entries",
                   "stream=codec_name,pix_fmt,width,height,avg_frame_rate,nb_frames:format=duration",
                   "-of","json",str(path)],text=True))
              stream=next(v for v in data["streams"] if v.get("codec_name")=="h264")
              duration=float(data["format"]["duration"])
              assert (stream["width"],stream["height"])==(378,672),(name,data)
              assert stream["pix_fmt"] in ("yuv420p","yuvj420p"),(name,data)
              assert stream["avg_frame_rate"]=="30/1",(name,data)
              assert abs(int(stream["nb_frames"])-frames)<=1,(name,data)
              assert abs(duration-frames/30)<.1,(name,data)
              subprocess.run(["ffmpeg","-hide_banner","-loglevel","error","-xerror",
                  "-i",str(path),"-f","null","-"],check=True)
              sample_sec=[.07,duration*.20,duration*.40,duration*.60,duration*.80,duration-.08]
              hashes=[]
              for i,sec in enumerate(sample_sec):
                  png=root/(name+"-evidence-"+str(i)+".png")
                  subprocess.run(["ffmpeg","-hide_banner","-loglevel","error","-y",
                      "-ss",str(sec),"-i",str(path),"-frames:v","1",str(png)],check=True)
                  hashes.append(hashlib.sha256(png.read_bytes()).hexdigest())
              assert len(set(hashes))>=4,(name,"Only static / duplicate images")
              rows.append({"composition":name,"frames":frames,"fps":30,
                  "native_source_dimensions":[1080,1920],
                  "review_dimensions":[378,672],"codec":"h264",
                  "full_decode":"PASS","distinct_sample_frames":len(set(hashes)),
                  "duration":duration,"sha256":hashlib.sha256(path.read_bytes()).hexdigest(),
                  "source_sha":(root/"source-sha.txt").read_text().strip(),
                  "artistic_review":"PENDING","integration":"A1/A2/A4 immutable sources hydrated and exercised; Agent6 master PENDING"})
          (root/"verification.json").write_text(json.dumps(rows,indent=2))
          print(json.dumps(rows,indent=2))
          PY
      - name: Upload source SHA, real MP4s, PNGs, verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EP003-agent8-moving-crash-${{ github.run_id }}
          path: out/agent-8/
          retention-days: 30
          if-no-files-found: warn
      - name: Publish verified evidence to Issue 207 and manager 193
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s out/agent-8/verification.json
          {
            echo "### Agent 8 real native crash-video verification"
            echo "Source: ${{ github.sha }}"
            echo "Actions run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Artifact: EP003-agent8-moving-crash-${{ github.run_id }}"
            echo "Two 1080x1920 / 30fps source compositions rendered as 378x672 moving H264 MP4s: hydrated real A1 original tyre + A2 70mph trajectory + A4 roadway and a closer original-GT impact/deformation insert."
            echo "Both: FFprobe / complete FFmpeg decode / 6 time-separated PNGs with >=4 distinct images PASS."
            echo "Illustrative hypothetical crash branch; A1/A2/A4 physically hydrated for third preview, but Agent 6 final timeline integration and artistic signoff still REQUIRED."
            echo "No final picture or artistic approval claimed."
          } > out/agent-8/publish.md
          cat out/agent-8/publish.md >> "$GITHUB_STEP_SUMMARY"
          gh issue comment 207 --repo "${{ github.repository }}" --body-file out/agent-8/publish.md || true
          gh issue comment 193 --repo "${{ github.repository }}" --body-file out/agent-8/publish.md || true

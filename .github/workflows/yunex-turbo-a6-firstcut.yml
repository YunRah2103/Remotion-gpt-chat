name: YUNEX A6 First Cut Native Render
on:
  push:
    branches: ['agent/turbo-3d-001-editor']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first-cut-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Native full-film first-cut render
        run: |
          mkdir -p out/yunex/a6
          npx remotion render src/index.ts Turbo3DEpisode001 out/yunex/a6/YUNEX_TURBO_3D_EP001_A6_FIRST_CUT.mp4 --codec=h264 --pixel-format=yuv420p --gl=swangle --concurrency=1
      - name: Verify genuine video
        run: |
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames:format=duration,size -of json out/yunex/a6/YUNEX_TURBO_3D_EP001_A6_FIRST_CUT.mp4 > out/yunex/a6/ffprobe.json
          ffmpeg -v error -xerror -i out/yunex/a6/YUNEX_TURBO_3D_EP001_A6_FIRST_CUT.mp4 -f null -
          sha256sum out/yunex/a6/YUNEX_TURBO_3D_EP001_A6_FIRST_CUT.mp4 > out/yunex/a6/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: YUNEX-A6-EP001-FIRST-CUT
          path: out/yunex/a6/
          retention-days: 30

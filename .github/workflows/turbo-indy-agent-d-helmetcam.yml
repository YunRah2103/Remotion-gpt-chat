name: Turbo Indy Agent D - 2025 helmet cam native HD verify
on:
  push:
    branches:
      - automotive-edits/turbo-indy-reality-001/d-indy-cinematic
    paths:
      - 'production/videos/turbo-indy-reality-001/agent_d_helmetcam_probe.py'
      - '.github/workflows/turbo-indy-agent-d-helmetcam.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check yt-dlp pillow
      - name: Verify independent 1080p helmet-cam access and visual bytes, internal review only
        run: python production/videos/turbo-indy-reality-001/agent_d_helmetcam_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: YUNEX-D-HELMETCAM-2025-NATIVE-HD-REVIEW-ONLY
          path: out/INDY_D_2025_HELMETCAM_REVIEW_ONLY.zip
          compression-level: 0
          retention-days: 7
          if-no-files-found: warn

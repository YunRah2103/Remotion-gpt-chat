name: YUNEX GT3 Official Nürburgring Direct MP4 Probe
on:
  push:
    branches:
      - automotive-edits/gt3-nurburgring-multicar-001/a-footage
    paths:
      - .github/workflows/gt3-race-mp4-probe.yml
      - production/videos/gt3-nurburgring-multicar-001/agent-a/probe_newstv_race.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-source-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q requests beautifulsoup4
      - name: Probe publisher original filenames without downloading
        run: python production/videos/gt3-nurburgring-multicar-001/agent-a/probe_newstv_race.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GT3-NEWS-PUBLISHER-N24-DIRECT-MP4-HEAD-VERIFICATION
          path: out/gt3-porsche-n24-head/porsche-race-mp4-head-probe.json
          retention-days: 7

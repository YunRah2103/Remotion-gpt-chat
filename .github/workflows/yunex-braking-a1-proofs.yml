name: YUNEX Braking EP001 Agent 1 native proofs
on:
  pull_request:
    paths:
      - 'src/yunex/braking200/engineering/**'
      - '.github/workflows/yunex-braking-a1-proofs.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-two-moving-previews:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies and FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          npm ci --no-audit --no-fund
      - name: TypeScript and isolated mechanics tests
        run: |
          npm run check
          node --experimental-strip-types --test src/yunex/braking200/engineering/mechanics.test.mjs
      - name: Genuine native Remotion macro MP4
        run: |
          mkdir -p out/braking-a1
          npx remotion render src/yunex/braking200/engineering/entry.tsx BrakeMacroProof out/braking-a1/01-brake-mechanism.mp4 --gl=swangle --codec=h264 --pixel-format=yuv420p --concurrency=2 --scale=0.5
      - name: Genuine native Remotion GT + track MP4
        run: |
          npx remotion render src/yunex/braking200/engineering/entry.tsx BrakeTrackProof out/braking-a1/02-grand-tourer-track.mp4 --gl=swangle --codec=h264 --pixel-format=yuv420p --concurrency=2 --scale=0.5
      - name: Probe, full decode and genuinely sampled 9:16 frames
        shell: bash
        run: |
          set -euo pipefail
          for mp4 in out/braking-a1/*.mp4; do
            name="$(basename "$mp4" .mp4)"
            ffprobe -v error -show_format -show_streams -of json "$mp4" > "out/braking-a1/$name.ffprobe.json"
            ffmpeg -v error -xerror -i "$mp4" -f null -
            for timestamp in 0.30 1.90 3.50; do
              ffmpeg -y -v error -ss "$timestamp" -i "$mp4" -frames:v 1 "out/braking-a1/$name-$timestamp""s.png"
            done
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,avg_frame_rate,nb_frames -of default=noprint_wrappers=1 "$mp4"
          done
          sha256sum out/braking-a1/*.mp4 > out/braking-a1/sha256.txt
      - name: Publish review videos image samples and probes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: YUNEX-BRAKING-EP001-A1
          path: out/braking-a1/
          retention-days: 30
          if-no-files-found: warn

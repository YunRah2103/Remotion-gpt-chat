name: CYBER FUTURE Agent D Porsche Original HD

on:
  push:
    branches:
      - automotive-edits/cyber-future-prototypes-001/d-radical-footage
    paths:
      - .github/workflows/cyber-future-agent-d-porsche-hd.yml
      - production/videos/cyber-future-prototypes-001/agent_d_porsche_hd.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-porsche:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Download and decode the real Porsche 6Mbps originals
        run: |
          python production/videos/cyber-future-prototypes-001/agent_d_porsche_hd.py
          cat out/CYBER-FUTURE-001-FOOTAGE-D/QA_REPORT.json
          find out/CYBER-FUTURE-001-FOOTAGE-D -type f -printf '%P %s bytes\n' | sort
      - uses: actions/upload-artifact@v4
        with:
          name: CYBER-FUTURE-001-D-PORSCHE-HQ
          path: out/CYBER-FUTURE-001-FOOTAGE-D/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

name: RS6 Agent B dynamic creator comparison
on:
  push:
    branches: [automotive-edits/rs6-no-mercy-001/b-creator-driving]
    paths: [.github/workflows/rs6-agent-b-driving-creators.yml]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  creator-video-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: green-rs6-driving
            creator: luan_rs6
          - key: professional-rs6-films
            creator: auditographyofficial
          - key: rs6-performance
            creator: performance61.de
    steps:
      - uses: actions/checkout@v4
      - name: Install trusted QA tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -q --upgrade yt-dlp curl_cffi
      - name: Discover, download and validate creator shots (runner private)
        shell: bash
        env:
          CREATOR: ${{ matrix.creator }}
          KEY: ${{ matrix.key }}
        run: |
          set +e
          mkdir -p "reports/$KEY" "clips/$KEY"
          url="https://www.tiktok.com/@$CREATOR"
          printf 'creator=%s\nurl=%s\n' "$CREATOR" "$url" >"reports/$KEY/source.txt"
          yt-dlp --ignore-config --flat-playlist --playlist-end 9 --print '%(webpage_url)s' --socket-timeout 13 --retries 1 "$url" >"reports/$KEY/discovered.txt" 2>"reports/$KEY/discovery-errors.txt"
          grep -hE '^https://(www[.])?tiktok[.]com/(@|%40).+/video/[0-9]+' "reports/$KEY/discovered.txt" | sort -u -r | head -n 4 >"reports/$KEY/selected.txt"
          n=0
          while IFS= read -r link; do
            n=$((n+1)); name="$KEY-$n"
            printf '%s\n' "$link" >"reports/$KEY/$n-source.txt"
            yt-dlp --ignore-config --no-playlist --format 'bv*+ba/b' --download-sections '*0-6' --force-keyframes-at-cuts --merge-output-format mp4 --socket-timeout 14 --retries 1 --fragment-retries 1 --output "clips/$KEY/$name.%(ext)s" "$link" >>"reports/$KEY/$n-source.txt" 2>&1
            echo "download_exit=$?" >>"reports/$KEY/$n-source.txt"
            file="$(find "clips/$KEY" -maxdepth 1 -type f -name "$name.*" ! -name '*.part' | head -n 1)"
            [[ -n "$file" ]] || continue
            ffprobe -v error -show_entries format=duration,size:stream=codec_name,codec_type,width,height,r_frame_rate -of json "$file" >"reports/$KEY/$n-probe.json" 2>&1
            ffmpeg -hide_banner -nostdin -v error -xerror -i "$file" -f null - >>"reports/$KEY/$n-source.txt" 2>&1
            echo "decode_exit=$?" >>"reports/$KEY/$n-source.txt"
            sha256sum "$file" >>"reports/$KEY/$n-source.txt"
            mkdir -p "reports/$KEY/$n-frames"
            ffmpeg -hide_banner -nostdin -v error -y -i "$file" -vf 'fps=1/2,scale=420:-1' -frames:v 3 "reports/$KEY/$n-frames/frame_%02d.jpg" >>"reports/$KEY/$n-source.txt" 2>&1
            rm -f "$file"
          done <"reports/$KEY/selected.txt"
          echo "Media not rehosted; technical QA not publication licence" >>"reports/$KEY/source.txt"
      - name: Upload C8 aggressive driving contact sheets and technical proof only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rs6-b-${{ matrix.key }}-qa
          path: reports/${{ matrix.key }}/
          retention-days: 14

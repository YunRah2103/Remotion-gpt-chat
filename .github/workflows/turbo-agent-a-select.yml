name: YUNEX Turbo - Agent A Final Transition Cuts
on:
  push:
    branches:
      - automotive-edits/turbo-indy-reality-001/a-turbo-film
    paths:
      - production/videos/turbo-indy-reality-001/agent_a_select.py
      - .github/workflows/turbo-agent-a-select.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  focused-select-and-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Fetch actual full original movie-source footage from prior successful job
        uses: actions/download-artifact@v4
        with:
          name: yunex-turbo-agent-a-indy500-focus-38270483310
          run-id: 38270483310
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: out/agent-a-sources
      - name: Install verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check pillow
      - name: Trim hand-screened movie racing selections, FFprobe, contact, motion, SHA
        run: |
          python production/videos/turbo-indy-reality-001/agent_a_select.py
          cat out/agent-a-selected/manifest.json
      - name: Publish real playable selections as GitHub Actions ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YUNEX-Turbo-AgentA-Indy500-Selection-${{ github.run_id }}
          path: out/agent-a-selected/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
      - name: Enforce source video and QA gates
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path("out/agent-a-selected")
          m=json.loads((p/"manifest.json").read_text())
          assert len(m["selections"])==6
          assert all((p/z["file"]).stat().st_size>30000 for z in m["selections"])
          assert all((p/z["contact_sheet"]).stat().st_size>1000 for z in m["selections"])
          assert any(z["source_native_full_hd_geometry"] for z in m["selections"])
          print("Agent A six actual movie extracts verified with real decoded frame contacts")
          PY

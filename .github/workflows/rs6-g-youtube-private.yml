name: YUNEX RS6 original YouTube direct private media QA
on:
  push:
    branches: [automotive-edits/rs6-no-mercy-001/g-director-rescue]
    paths:
      - .github/workflows/rs6-g-youtube-private.yml
      - production/videos/rs6-no-mercy-001/g_youtube_private_qa.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  genuine-c8-youtube-test:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: FFmpeg and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q requests
      - name: Try direct public video streaming alternatives and require MP4 QA
        shell: bash
        run: |
          python production/videos/rs6-no-mercy-001/g_youtube_private_qa.py > rs6-youtube-qa.log 2>&1 || true
          tail -100 rs6-youtube-qa.log
      - name: Private workflow artifact (not public Release)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: YUNEX_RS6_ACTUAL_YOUTUBE_VIDEO_VERIFICATION
          path: |
            rs6-youtube-private-qa/
            rs6-youtube-qa.log
          retention-days: 1
          if-no-files-found: warn

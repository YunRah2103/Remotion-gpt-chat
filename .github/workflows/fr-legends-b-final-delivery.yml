name: FR Legends B - Final Premium Delivery Gate
on:
  push:
    branches: [automotive-edits/french-icons-001/b-modern-footage]
    paths:
      - production/videos/french-icons-001/agent-b/final_delivery.py
      - .github/workflows/fr-legends-b-final-delivery.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  approved-native-media:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Download actual 23-clip precision-cut package
        run: |
          set -euo pipefail
          mkdir -p out/premium-v4
          gh run download 38153132701 --repo "${{ github.repository }}" -n FR-LEGENDS-001-B-REAL-MODERN-PREMIUM-V4 -D out/premium-v4
          test -s out/premium-v4/manifest.json
      - name: Independently hash-check and deliver only quality-selected clips
        run: python production/videos/french-icons-001/agent-b/final_delivery.py
      - name: Upload single final approved modern performance footage ZIP
        uses: actions/upload-artifact@v4
        with:
          name: FR-LEGENDS-001-AGENT-B-MODERN-22-APPROVED-NATIVE
          path: out/FR-LEGENDS-B-MODERN-FINAL/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

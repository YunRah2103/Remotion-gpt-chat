name: STO Official YouTube original native source test
on:
  push:
    branches: [automotive-edits/huracan-sto-v10-001/a-footage]
    paths:
      - production/videos/huracan-sto-v10-001/footage/probe_official_youtube.py
      - .github/workflows/sto-official-youtube-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  originals:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg + updated extractor
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check -U Pillow yt-dlp
          python -m py_compile production/videos/huracan-sto-v10-001/footage/probe_official_youtube.py
      - name: Load optional YouTube session cookies securely
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, binascii, os, pathlib, stat
          encoded = os.environ.get('YOUTUBE_COOKIES_B64', '').strip()
          if not encoded:
              print('YOUTUBE_COOKIES_B64 secret missing; YouTube downloads will be skipped.')
          else:
              try:
                  raw = base64.b64decode(encoded, validate=True)
              except (ValueError, binascii.Error):
                  raise SystemExit('Invalid base64 in YOUTUBE_COOKIES_B64')
              raw = raw.replace(b'\r\n', b'\n').replace(b'\r', b'\n')
              header = raw.split(b'\n', 1)[0].strip()
              if header not in (b'# Netscape HTTP Cookie File', b'# HTTP Cookie File'):
                  raise SystemExit('Invalid cookies.txt header; use Netscape/Mozilla format.')
              if b'youtube.com' not in raw.lower():
                  raise SystemExit('Cookie file must contain YouTube cookies.')
              if len(raw) > 250000:
                  raise SystemExit('Cookie file too large; export only YouTube cookies.')
              target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'sto-youtube-cookies.txt'
              target.write_bytes(raw)
              target.chmod(stat.S_IRUSR | stat.S_IWUSR)
              with open(os.environ['GITHUB_ENV'], 'a') as env:
                  env.write('YOUTUBE_COOKIES_FILE=' + str(target) + '\n')
              print('YouTube cookie file loaded in temporary runner directory; not logged or uploaded.')
          PY
      - name: Probe native FullHD playable versions of original STO driving films
        run: python production/videos/huracan-sto-v10-001/footage/probe_official_youtube.py
      - name: Delete temporary YouTube cookie file
        if: always()
        run: |
          rm -f -- "$RUNNER_TEMP/sto-youtube-cookies.txt"
      - name: Report actual acquired source quality
        if: always()
        run: |
          python - <<'PY'
          import pathlib,json,os
          f=pathlib.Path('out/sto-youtube-hd/manifest.json')
          if f.exists():
           rows=json.loads(f.read_text())['sources']
           with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as o:
            o.write('## Huracán STO — actual original 1080p test\n')
            for r in rows:o.write('- '+r['id']+': '+r['status']+' '+str(r.get('actual_probe',{}).get('width',''))+' '+r.get('error','')[-260:]+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: STO-ORIGINAL-REAL-1080P-PUBLIC-VIDEO-TEST
          path:
            out/STO_PUBLIC_YOUTUBE_ORIGINALS_RESEARCH.zip
          if-no-files-found: warn
          retention-days: 5
          compression-level: 0

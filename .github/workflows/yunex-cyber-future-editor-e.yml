name: YUNEX CYBER FUTURE 001 Agent E Visual Render
on:
  workflow_dispatch:
  push:
    branches:
      - automotive-edits/cyber-future-prototypes-001/e-cinematic-editor
    paths:
      - ".github/workflows/yunex-cyber-future-editor-e.yml"
      - "production/videos/cyber-future-prototypes-001/agent-e/**"
permissions:
  contents: read
  actions: read
jobs:
  render-real-prototype-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg on runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Verify FFmpeg and download original A/B/C/D Actions ZIPs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT=production/videos/cyber-future-prototypes-001/agent-e
          mkdir -p "$ROOT/assets/"{A,B,C,D} /tmp/cyber-B-outer /tmp/cyber-C-outer
          download () {
            curl -fSL --retry 4 --retry-delay 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/artifacts/$2/zip" \
              -o "/tmp/cyber-$1.zip"
            unzip -tq "/tmp/cyber-$1.zip" | tail -1
          }
          download A 11720534410
          download B 11720329638
          download C 11746231515
          download D 11722461153
          unzip -q /tmp/cyber-A.zip -d "$ROOT/assets/A"
          unzip -q /tmp/cyber-B.zip -d /tmp/cyber-B-outer
          unzip -q /tmp/cyber-B-outer/CYBER-FUTURE-001-FOOTAGE-B.zip -d "$ROOT/assets/B"
          unzip -q /tmp/cyber-C.zip -d /tmp/cyber-C-outer
          unzip -q /tmp/cyber-C-outer/CYBER-FUTURE-001-C-TWO-REAL-MODELS.zip -d "$ROOT/assets/C"
          unzip -q /tmp/cyber-D.zip -d "$ROOT/assets/D"
          ffmpeg -version | head -1
      - name: Render 1080x1920 632-frame proof from SHA-matched real source clips
        run: |
          set -euo pipefail
          mkdir -p dist
          python production/videos/cyber-future-prototypes-001/agent-e/render_visual.py --size master --out dist/CYBER-FUTURE-001-E-VISUAL-1080x1920.mp4
          ffmpeg -nostdin -v error -xerror -i dist/CYBER-FUTURE-001-E-VISUAL-1080x1920.mp4 -f null -
          python production/videos/cyber-future-prototypes-001/agent-e/render_visual.py --size landscape --out dist/CYBER-FUTURE-001-E-WIDESCREEN-1920x1080.mp4
          ffmpeg -nostdin -v error -xerror -i dist/CYBER-FUTURE-001-E-WIDESCREEN-1920x1080.mp4 -f null -
          sha256sum dist/CYBER-FUTURE-001-E-VISUAL-1080x1920.mp4 dist/CYBER-FUTURE-001-E-WIDESCREEN-1920x1080.mp4 | tee dist/SHA256SUMS.txt
          cp production/videos/cyber-future-prototypes-001/agent-e/shotmap.json dist/shotmap.json
          ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height,r_frame_rate -of json dist/CYBER-FUTURE-001-E-VISUAL-1080x1920.mp4 > dist/ffprobe.json
          ffmpeg -nostdin -hide_banner -loglevel error -y -i dist/CYBER-FUTURE-001-E-VISUAL-1080x1920.mp4 -vf 'fps=0.74,scale=216:384,tile=4x4:padding=3:margin=5' -frames:v 1 dist/visual-contact.jpg
      - name: Publish real decoded playable film proof and editorial evidence
        uses: actions/upload-artifact@v4
        with:
          name: CYBER-FUTURE-001-EDITOR-E-1080P-VISUAL
          path: dist/
          if-no-files-found: error
          retention-days: 10

name: YUNEX Agent B IndyCar Match Footage
on:
  push:
    branches:
      - automotive-edits/turbo-indy-reality-001/b-indy-matches
    paths:
      - production/videos/turbo-indy-reality-001/agent_b_acquire.py
      - .github/workflows/yunex-agent-b-indy-matches.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire_and_verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout assigned branch
        uses: actions/checkout@v4
      - name: Install FFmpeg and Python
        run: |
          python3 --version
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffprobe -version | head -n 1
          ffmpeg -version | head -n 1
      - name: Fetch real video; decode, crop and validate
        id: acquire
        run: |
          set -o pipefail
          python3 production/videos/turbo-indy-reality-001/agent_b_acquire.py | tee agent-b-run.log
      - name: Upload actual source media and QA ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yunex-turbo-indy-agent-b-real-footage-${{ github.run_id }}
          path: |
            out/agent-b-indy-matches-real-footage.zip
            agent-b-run.log
          compression-level: 0
          retention-days: 7
          if-no-files-found: warn

name: YUNEX Agent B IndyCar Match Footage
on:
  push:
    branches:
      - automotive-edits/turbo-indy-reality-001/b-indy-matches
    paths:
      - production/videos/turbo-indy-reality-001/agent_b_acquire.py
      - production/videos/turbo-indy-reality-001/agent_b_dvids_acquire.py
      - production/videos/turbo-indy-reality-001/agent_b_stock_acquire.py
      - production/videos/turbo-indy-reality-001/agent_b_wikimedia_acquire.py
      - .github/workflows/yunex-agent-b-indy-matches.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire_and_verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout assigned branch
        uses: actions/checkout@v4
      - name: Install FFmpeg and Python
        run: |
          python3 --version
          python3 -m pip install --disable-pip-version-check requests pillow yt-dlp
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffprobe -version | head -n 1
          ffmpeg -version | head -n 1
      - name: Fetch real video; decode, crop and validate
        id: acquire
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          set -o pipefail
          python3 -u production/videos/turbo-indy-reality-001/agent_b_wikimedia_acquire.py | tee agent-b-run.log
      - name: Upload verified playable footage ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: yunex-turbo-indy-agent-b-verified-video-${{ github.run_id }}
          path: |
            out/YUNEX_TURBO_INDY_AGENT_B_MATCHES.zip
            agent-b-run.log
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Upload blocked-download diagnostics only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: yunex-agent-b-FAILED-download-DIAGNOSTICS-${{ github.run_id }}
          path: |
            out/turbo-indy-agent-b/manifest.json
            out/turbo-indy-agent-b/acquisition_log.json
            agent-b-run.log
          retention-days: 7
          if-no-files-found: warn

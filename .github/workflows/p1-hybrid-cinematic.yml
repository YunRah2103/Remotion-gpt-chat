name: P1 - Real Model Cinematic Film
on:
  push:
    branches:
      - film/mclaren-p1-hybrid-cinematic
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install video dependencies
        run: npm ci
      - name: Download the actual McLaren P1 GLB (source pinned)
        run: |
          mkdir -p public/p1-hybrid out/p1-hybrid
          curl --fail --location --retry 5 --retry-delay 3 --silent --show-error \
            https://raw.githubusercontent.com/pedrosoandre/carros/2d18dfd9db96bbf0d9cffa949deaf7f571388cbf/assets/mclaren-p1.glb \
            --output public/p1-hybrid/mclaren-p1.glb
          test "$(head -c 4 public/p1-hybrid/mclaren-p1.glb)" = "glTF"
          test "$(stat -c %s public/p1-hybrid/mclaren-p1.glb)" -gt 1000000
          sha256sum public/p1-hybrid/mclaren-p1.glb > out/p1-hybrid/MODEL-SHA256.txt
      - name: Render cinema film from original geometry
        run: |
          npx remotion render production/p1-hybrid/entry.tsx P1HybridCinematic out/p1-hybrid/p1-video-silent.mp4 \
            --gl=swangle --codec=h264 --pixel-format=yuv420p --concurrency=2
      - name: Install ffmpeg for video verification
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Verify video and generate contact sheet
        run: |
          ffprobe -v error -show_entries format=duration,size -show_entries stream=width,height,avg_frame_rate,nb_frames \
            -of default=noprint_wrappers=1 out/p1-hybrid/p1-video-silent.mp4 | tee out/p1-hybrid/video-report.txt
          ffmpeg -v error -i out/p1-hybrid/p1-video-silent.mp4 -f null -
          ffmpeg -y -v error -i out/p1-hybrid/p1-video-silent.mp4 -vf "fps=1/2,scale=320:-1,tile=3x2" -frames:v 1 out/p1-hybrid/contact-sheet.jpg
      - name: Preserve source, attribution and cinematic brief
        if: always()
        run: |
          cat > out/p1-hybrid/README.txt <<'EOF'
          P1 HYBRID CINEMATIC / ORIGINAL MESH
          A 12-second, four-shot conceptual explainer video made using the real imported McLaren P1 GLB.
          Source collection: https://github.com/pedrosoandre/carros
          Original model author: vecarz
          Original model: https://sketchfab.com/3d-models/none-adae2edc721e4ce7b31c1d06a581e30a
          Reported model licence: CC Attribution 4.0.
          Rendering source: production/p1-hybrid/entry.tsx
          Fact source: https://www.mclaren.com/cars/gl_en/ultimate-models/mclaren-p1
          Car body geometry is not recreated, modified or replaced by procedural shapes.
          Only the studio floor/lights/graphics are procedurally generated.
          Audio not embedded in the raw GitHub render. Original custom audio is added at final delivery.
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-original-3d-cinematic-video
          path: out/p1-hybrid/
          retention-days: 14

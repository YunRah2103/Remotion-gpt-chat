name: YUNEX V3 authoring proofs
on:
  pull_request:
    paths:
      - 'src/yunex/modelling-kit/**'
      - 'scripts/modelling-kit/**'
      - 'tests/modelling-kit/**'
      - '.github/workflows/yunex-studio-v3.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: yunex-v3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Install native media test dependency
        run: bash scripts/modelling-kit/install-native-media.sh
      - run: npm run check
      - run: node --experimental-strip-types --test tests/modelling-kit/*.test.mjs tests/world-kit/*.test.mjs tests/parts-kit/*.test.mjs
      - run: python -m unittest discover -s tests/modelling-kit -p 'test_*.py'
  proof:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        id: [turbo, sports, formula, environment]
        orientation: [portrait, landscape]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: bash scripts/modelling-kit/install-native-media.sh
      - run: python -m pip install pillow
      - run: node --experimental-strip-types scripts/modelling-kit/v3-proof.mjs --id=${{ matrix.id }} ${{ matrix.orientation == 'landscape' && '--landscape' || '' }}
      - run: python scripts/modelling-kit/v3-verify.py out/v3/${{ matrix.id }}${{ matrix.orientation == 'landscape' && '-landscape' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: YUNEX-V3-${{ matrix.id }}-${{ matrix.orientation }}
          path: out/v3
          retention-days: 30
  demo-shot:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {project: twin-turbo-complete, script: complete-demo, shot: hook}
          - {project: twin-turbo-complete, script: complete-demo, shot: exhaust}
          - {project: twin-turbo-complete, script: complete-demo, shot: shaft}
          - {project: twin-turbo-complete, script: complete-demo, shot: charge}
          - {project: twin-turbo-complete, script: complete-demo, shot: combustion}
          - {project: twin-turbo-complete, script: complete-demo, shot: installed}
          - {project: twin-turbo-complete, script: complete-demo, shot: payoff}
          - {project: ev-regeneration-proof, script: regeneration-demo, shot: decelerate}
          - {project: ev-regeneration-proof, script: regeneration-demo, shot: recover}
          - {project: ev-regeneration-proof, script: regeneration-demo, shot: generator}
          - {project: ev-regeneration-proof, script: regeneration-demo, shot: continue}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --experimental-strip-types scripts/modelling-kit/${{ matrix.script }}.mjs
      - run: npm run kit:inspect -- ${{ matrix.project }}
      - run: npm run kit:scene -- ${{ matrix.project }} --shot=${{ matrix.shot }}
      - uses: actions/upload-artifact@v4
        with:
          name: YUNEX-V3-${{ matrix.project }}-shot-${{ matrix.shot }}
          path: out/studio/${{ matrix.project }}/
          retention-days: 30
  complete-demo:
    needs: demo-shot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {project: twin-turbo-complete, script: complete-demo}
          - {project: ev-regeneration-proof, script: regeneration-demo}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: bash scripts/modelling-kit/install-native-media.sh
      - run: node --experimental-strip-types scripts/modelling-kit/${{ matrix.script }}.mjs
      - uses: actions/download-artifact@v4
        with:
          pattern: YUNEX-V3-${{ matrix.project }}-shot-*
          path: out/studio/${{ matrix.project }}
          merge-multiple: true
      - run: npm run kit:assemble -- ${{ matrix.project }}
      - run: npm run kit:handoff -- ${{ matrix.project }}
      - run: |
          cp -r src/yunex/studio-projects/${{ matrix.project }} out/studio/${{ matrix.project }}/editable-project
          ffmpeg -v error -i out/studio/${{ matrix.project }}/complete-silent.mp4 -vf "fps=2,scale=270:480,tile=5x10" -frames:v 1 out/studio/${{ matrix.project }}/timeline.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: YUNEX-V3-${{ matrix.project }}-SILENT-1080p30
          path: out/studio/${{ matrix.project }}
          retention-days: 30

name: YUNEX EP003 Agent 6 Native Full-Resolution Picture
on:
  push:
    branches: [agent/ep003-06-editor-vo]
    paths: ['.github/workflows/yunex-ep003-agent6-picture.yml', 'production/yunex/tyre_blowout_ep003/editor/**', 'tests/agent-6/**', 'src/Root.tsx']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ep003-agent6-picture-${{ github.sha }}
  cancel-in-progress: false
jobs:
  render:
    name: Remotion native 1080p segment ${{ matrix.part }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {part: 0, frames: "0-199"}
          - {part: 1, frames: "200-399"}
          - {part: 2, frames: "400-599"}
          - {part: 3, frames: "600-799"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install FFmpeg and pinned npm
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          npm ci --no-audit --no-fund
      - name: Hydrate immutable department sources (NO PR MERGES)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/agent6
          cat >/tmp/ep003-pins <<'PINS'
          agent/ep003-01-mechanics mechanics 7d47746d2fc584e935b5a9766eb1150e5b3dac38 1
          agent/ep003-02-dynamics dynamics e724786fc087b080e9de19e9e26bda6a815ce276 2
          agent/ep003-03-cinema cinema 938628271f9b50d975ee55491881a8fd2d4807a5 3
          agent/ep003-04-look look a44f1b6c9c31105edd1a9b0d2de7f233d1223952 4
          agent/ep003-05-story story cd03c64f77705aa03ee5d5071e5cf18c669fa4ea 5
          agent/ep003-08-crash-vfx impact 8e703e70218e9c0b9e9b7768112f2d8388ae31c8 8
          agent/ep003-09-rewind-story rewind 6884664e265c680e314b3d44b81d33b6d6439977 9
          agent/ep003-10-action-cameras action 8b00be7b1546ff3a5a17d1ea73a6ab36d57800c3 10
          PINS
          while read -r agent folder pin number; do
            git fetch --no-tags --depth=1 origin "refs/heads/$agent"
            actual=$(git rev-parse FETCH_HEAD)
            [[ "$actual" == "$pin" ]] || { echo "::error::Source moved $agent $actual vs $pin"; exit 1; }
            git restore --source="$pin" --worktree -- "production/yunex/tyre_blowout_ep003/$folder/"
            if git cat-file -e "$pin:tests/agent-$number" 2>/dev/null; then
              git restore --source="$pin" --worktree -- "tests/agent-$number/"
            fi
            echo "$number $folder $pin" | tee -a out/agent6/sources.txt
            # One Agent10 regression reads its own workflow metadata. Stage
            # that immutable source workflow ONLY in ephemeral CI checkout.
            if [[ "$number" == "10" ]]; then
              git show "$pin:.github/workflows/yunex-ep003-agent10-action.yml" >.github/workflows/yunex-ep003-agent10-action.yml
            fi
          done </tmp/ep003-pins
          echo "EDITOR $(git rev-parse HEAD)" >>out/agent6/sources.txt
          for p in mechanics/tyreRig.ts dynamics/model.ts cinema/scene.tsx look/world.tsx story/SteadyHands3D.tsx impact/model.ts rewind/branchReplay.ts action/cameras.ts; do
            test -f "production/yunex/tyre_blowout_ep003/$p"
          done
      - name: All mandatory source checks and editor regressions
        if: matrix.part == 0
        run: |
          set -euo pipefail
          npm run check
          npm run worldkit:test
          npm run partskit:test
          node --experimental-strip-types --test tests/agent-6/*.test.mjs
          node --experimental-strip-types --test tests/agent-2/*.test.mjs
          node --experimental-strip-types --test tests/agent-8/*.test.mjs
          node --experimental-strip-types --test tests/agent-9/*.test.mjs
          node --experimental-strip-types --test tests/agent-10/*.test.mjs
      - name: Render actual moving 1080x1920 30FPS segment
        run: |
          set -euo pipefail
          npx --no-install remotion render \
            production/yunex/tyre_blowout_ep003/editor/entry.tsx EP003PictureOnly \
            "out/agent6/part-${{ matrix.part }}.mp4" \
            --frames="${{ matrix.frames }}" --gl=swangle \
            --codec=h264 --pixel-format=yuv420p --concurrency=1
      - name: Full decode each 200-frame segment
        run: |
          set -euo pipefail
          f="out/agent6/part-${{ matrix.part }}.mp4"
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,avg_frame_rate,nb_frames -of default=nw=1 "$f" | tee out/agent6/part-${{ matrix.part }}.txt
          echo "::group::Explicit native segment probe"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,avg_frame_rate,nb_frames,codec_name -of json "$f" | tee "out/agent6/part-${{ matrix.part }}-probe.json"
          python3 - "$f" <<'PY'
          import json,subprocess,sys
          f=sys.argv[1]
          data=json.loads(subprocess.check_output(['ffprobe','-v','error','-select_streams','v:0','-show_entries','stream=codec_name,width,height,avg_frame_rate,nb_frames','-of','json',f],text=True))
          video=data['streams'][0]
          expected={'codec_name':'h264','width':1080,'height':1920,'avg_frame_rate':'30/1','nb_frames':'200'}
          print('Actual video:',repr(video),flush=True)
          for field,value in expected.items():
              assert str(video.get(field)) == str(value),f'{field}: actual {video.get(field)!r}, expected {value!r}'
          print('PASS exact 200-frame 1080×1920/30fps/H264 probe',flush=True)
          PY
          echo "::endgroup::"
          echo "::group::True FFmpeg full decode"
          ffmpeg -hide_banner -v warning -xerror -i "$f" -f null -
          echo "PASS: decoded all 200 native frames"
          echo "::endgroup::"
          sha256sum "$f" >out/agent6/part-${{ matrix.part }}.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ep003-agent6-native-part-${{ matrix.part }}
          path: out/agent6/
          retention-days: 30
          if-no-files-found: error

  assemble:
    name: Concat / FFprobe / 800-frame full decode / contact sheet
    needs: render
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - uses: actions/download-artifact@v4
        with:
          pattern: ep003-agent6-native-part-*
          path: out/segments
          merge-multiple: true
      - name: Assemble and independently verify 1080x1920 complete picture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/ep003
          cd out/segments
          : >concat.txt
          for i in 0 1 2 3; do
            test -s "part-$i.mp4"
            printf "file '%s'\n" "part-$i.mp4" >>concat.txt
          done
          ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i concat.txt -c copy ../ep003/EP003_PICTURE_NATIVE_1080x1920.mp4
          cd ../ep003
          f=EP003_PICTURE_NATIVE_1080x1920.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=index,codec_type,codec_name,width,height,r_frame_rate,nb_frames -of json "$f" | tee ffprobe.json
          python3 - "$f" <<'PY'
          import json,subprocess,sys
          d=json.loads(subprocess.check_output(['ffprobe','-v','error','-select_streams','v:0','-show_entries','stream=codec_name,width,height,avg_frame_rate,nb_frames','-of','json',sys.argv[1]],text=True))['streams'][0]
          print('Final native full film probe:',d,flush=True)
          assert (d.get('width'),d.get('height'),d.get('avg_frame_rate'),d.get('nb_frames')) == (1080,1920,'30/1','800'), 'Expected 1080×1920, 30fps, 800 frames'
          PY
          ffmpeg -hide_banner -v warning -xerror -i "$f" -f null -
          echo "PASS full 800-frame native decode"
          ffmpeg -hide_banner -loglevel error -y -i "$f" \
            -vf "select='not(mod(n,50))',scale=270:480,tile=4x4" -frames:v 1 -update 1 contact-sheet.png
          ffmpeg -hide_banner -loglevel error -y -ss 0.30 -i "$f" -frames:v 1 frame-0p30.png
          ffmpeg -hide_banner -loglevel error -y -ss 0.77 -i "$f" -frames:v 1 frame-0p77.png
          ffmpeg -hide_banner -loglevel error -y -ss 26.20 -i "$f" -frames:v 1 frame-26p2.png
          sha256sum "$f" > SHA256SUMS.txt
          cp ../../production/yunex/tyre_blowout_ep003/editor/VOICEOVER_PROVENANCE.json .
          cp ../segments/sources.txt ./SOURCES-V2.txt
          echo "V3 IMPROVED FULL 1080p PICTURE ONLY, exact A8/A9/A10. Original Cedar 26.664s voice is muxed independently for user approval, not silently replaced." >README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: EP003-AGENT6-FULL-PICTURE-${{ github.run_id }}
          path: out/ep003/
          retention-days: 30
          if-no-files-found: error

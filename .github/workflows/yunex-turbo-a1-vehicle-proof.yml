name: YUNEX Turbo EP001 - A1 vehicle native moving proof
on:
  push:
    branches: [agent/turbo-3d-001-vehicle]
    paths:
      - 'src/yunex/turbo3d/vehicle/**'
      - '.github/workflows/yunex-turbo-a1-vehicle-proof.yml'
      - 'production/yunex/turbo_3d_001/agents/vehicle/check-model.mjs'
  workflow_dispatch:
concurrency:
  group: yunex-turbo-a1-vehicle-branch
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npm run check
      - name: Model and camera-contract checks
        run: node production/yunex/turbo_3d_001/agents/vehicle/check-model.mjs
      - name: Validate truthful pending-review handoff schema
        run: python3 production/tools/handoff.py production/yunex/turbo_3d_001/agents/vehicle/handoff.json
      - name: Install FFmpeg and FFprobe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Render four actual moving 3D closeup shots using software WebGL
        run: |
          mkdir -p out
          npx remotion render src/yunex/turbo3d/vehicle/inspection/index.ts A1VehicleCloseupInspection out/a1-vehicle-v4-inspection.mp4 --gl=swangle --codec=h264 --pixel-format=yuv420p --concurrency=1 --frames=0-119 --scale=0.8
      - name: FFprobe, 120-frame movement and full FFmpeg decode validation
        run: |
          ffprobe -v error -show_entries stream=codec_name,width,height,nb_frames,r_frame_rate -show_entries format=duration -of json out/a1-vehicle-v4-inspection.mp4 | tee out/a1-v4-ffprobe.json
          ffmpeg -v error -i out/a1-vehicle-v4-inspection.mp4 -f null -
          ffmpeg -hide_banner -loglevel error -i out/a1-vehicle-v4-inspection.mp4 -f framemd5 out/a1-v4-frames.md5
          sha256sum out/a1-vehicle-v4-inspection.mp4 | tee out/a1-v4-sha256.txt
          python3 - <<'PY'
          from pathlib import Path
          import json
          d=json.loads(Path('out/a1-v4-ffprobe.json').read_text())
          v=[s for s in d['streams'] if s['codec_name']=='h264']
          assert len(v)==1 and v[0]['width']==432 and v[0]['height']==768,d
          assert v[0]['r_frame_rate']=='30/1' and int(v[0]['nb_frames'])==120,d
          assert abs(float(d['format']['duration'])-4.0)<.1,d
          hashes=[line.rsplit(',',1)[-1].strip() for line in Path('out/a1-v4-frames.md5').read_text().splitlines() if not line.startswith('#')]
          assert len(hashes)==120 and len(set(hashes))>=105,(len(hashes),len(set(hashes)))
          print('A1_V4_MOVING_MEDIA_PASS',len(set(hashes)), 'unique frames / 120')
          PY
      - name: Render new moving V6 front-three-quarter hero through native Remotion
        run: |
          npx remotion render src/yunex/turbo3d/vehicle/inspection/index.ts A1V6FrontThreeQuarterHero out/a1-v6-front-three-quarter.mp4 --gl=swangle --codec=h264 --pixel-format=yuv420p --concurrency=1 --frames=0-119 --scale=0.8
      - name: Validate actual V6 moving MP4, independent of existing V5 reel
        run: |
          ffprobe -v error -show_entries stream=codec_name,width,height,nb_frames,r_frame_rate -show_entries format=duration -of json out/a1-v6-front-three-quarter.mp4 | tee out/a1-v6-ffprobe.json
          ffmpeg -v error -i out/a1-v6-front-three-quarter.mp4 -f null -
          ffmpeg -hide_banner -loglevel error -i out/a1-v6-front-three-quarter.mp4 -f framemd5 out/a1-v6-frames.md5
          sha256sum out/a1-v6-front-three-quarter.mp4 | tee out/a1-v6-sha256.txt
          python3 - <<'PY'
          from pathlib import Path
          import json
          d=json.loads(Path('out/a1-v6-ffprobe.json').read_text())
          v=[s for s in d['streams'] if s['codec_name']=='h264']
          assert len(v)==1 and v[0]['width']==432 and v[0]['height']==768,d
          assert v[0]['r_frame_rate']=='30/1' and int(v[0]['nb_frames'])==120,d
          assert abs(float(d['format']['duration'])-4.0)<.1,d
          hashes=[line.rsplit(',',1)[-1].strip() for line in Path('out/a1-v6-frames.md5').read_text().splitlines() if not line.startswith('#')]
          assert len(hashes)==120 and len(set(hashes))>=105,(len(hashes),len(set(hashes)))
          print('A1_V6_MOVING_HERO_PASS',len(set(hashes)), 'unique frames / 120')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yunex-turbo-a1-v6-front-three-quarter-hero
          path: |
            out/a1-v6-front-three-quarter.mp4
            out/a1-v6-ffprobe.json
            out/a1-v6-frames.md5
            out/a1-v6-sha256.txt
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yunex-turbo-a1-v4-closeups
          path: |
            out/a1-vehicle-v4-inspection.mp4
            out/a1-v4-ffprobe.json
            out/a1-v4-frames.md5
            out/a1-v4-sha256.txt
          retention-days: 14

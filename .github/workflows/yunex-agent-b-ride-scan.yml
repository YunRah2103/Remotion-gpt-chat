name: YUNEX B IndyCar Historical Ride - Authenticated Moving Footage Scan
on:
  push:
    branches: [automotive-edits/turbo-indy-reality-001/b-indy-matches]
    paths:
      - production/videos/turbo-indy-reality-001/agent_b_indy_ride_scan.py
      - .github/workflows/yunex-agent-b-ride-scan.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -U yt-dlp pillow
      - name: Inspect genuine moving source before accepting
        run: python -u production/videos/turbo-indy-reality-001/agent_b_indy_ride_scan.py
      - name: Upload source timecode contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YUNEX-AgentB-IndyCar-Ride-SourceQA-${{ github.run_id }}
          path: out/agent-b-ride-contact-scans.zip
          retention-days: 7
          if-no-files-found: warn
          compression-level: 0

name: YUNEX V5 terrain and camera refinement proof
on:
  push:
    branches: [feat/yunex-v5-verge-review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm}
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: node --experimental-strip-types --test tests/studio-v5/*.test.mjs
      - run: bash scripts/modelling-kit/install-native-media.sh
      - run: npx remotion render src/yunex/studio-v5/Film.tsx V5-rally out/v5/rally-refined.mp4 --gl=swangle --codec=h264 --pixel-format=yuv420p --color-space=bt709 --crf=18 --concurrency=2 --timeout=120000
      - name: Verify actual native moving rally refinement
        run: |
          ffmpeg -v error -xerror -i out/v5/rally-refined.mp4 -f null -
          ffprobe -v error -count_frames -show_entries stream=width,height,avg_frame_rate,nb_read_frames -of json out/v5/rally-refined.mp4 > out/v5/probe.json
          python3 -c 'import json; s=json.load(open("out/v5/probe.json"))["streams"][0]; assert (s["width"],s["height"],s["avg_frame_rate"],s["nb_read_frames"])==(1080,1920,"30/1","240")'
          ffmpeg -v error -i out/v5/rally-refined.mp4 -f framemd5 out/v5/frame-hashes.txt
          python3 -c 'from pathlib import Path; h=[s.rsplit(",",1)[-1].strip() for s in Path("out/v5/frame-hashes.txt").read_text().splitlines() if s and not s.startswith("#")]; assert len(h)==240 and len(set(h))>=230'
          sha256sum out/v5/rally-refined.mp4 docs/yunex-v5-preserved-baseline.json > out/v5/sha256.txt
          git rev-parse HEAD > out/v5/source-sha.txt
          git rev-parse HEAD^{tree} > out/v5/source-tree.txt
      - uses: actions/upload-artifact@v4
        with:
          name: YUNEX-V5-rally-refined-native
          path: out/v5/

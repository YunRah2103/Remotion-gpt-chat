name: YUNEX GT3 2026 Nürburgring Actual Full-Resolution Source Footage
on:
  push:
    branches:
      - automotive-edits/gt3-nurburgring-multicar-001/a-footage
    paths:
      - .github/workflows/gt3-2026-n24-originals.yml
      - production/videos/gt3-nurburgring-multicar-001/agent-a/download_2026_race.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg and PIL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -q Pillow
      - name: Download authentic originals, native QA and contact sheets
        run: python production/videos/gt3-nurburgring-multicar-001/agent-a/download_2026_race.py
      - name: Upload one original-footage archive (not a 30-shot pass)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GT3-2026-NURBURGRING-ACTUAL-ORIGINAL-FOOTAGE
          path: out/gt3-porsche-n24-2026/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Report QA without falsely clearing make/shot gate
        if: always()
        run: |
          if test -f out/gt3-porsche-n24-2026/manifest.json; then
            cat out/gt3-porsche-n24-2026/manifest.json
          fi

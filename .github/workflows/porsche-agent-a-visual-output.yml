name: Porsche Agent A - scene review visual output

on:
  push:
    branches:
      - automotive-edits/porsche-911-turbo-evolution-001/a-footage
    paths:
      - '.github/workflows/porsche-agent-a-visual-output.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
jobs:
  emit-authentic-source-scene-sheet:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Retrieve real 25-candidate-contact artifact and expose its actual image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/11672382328/zip > /tmp/source-contact.zip
          unzip -Z1 /tmp/source-contact.zip
          IMAGE=$(unzip -Z1 /tmp/source-contact.zip | grep 'scene-contact-page-01.jpg' | head -1)
          test -n "$IMAGE"
          unzip -p /tmp/source-contact.zip "$IMAGE" > /tmp/scene-contact.jpg
          python - <<'PY'
          import base64
          from pathlib import Path
          content=base64.b64encode(Path('/tmp/scene-contact.jpg').read_bytes()).decode()
          print('SCENE_IMAGE_BASE64_START')
          for i in range(0,len(content),4000):print('SCENE_IMAGE_PART:'+content[i:i+4000])
          print('SCENE_IMAGE_BASE64_END')
          PY

name: French Legends C - inspect real combined footage
on:
  push:
    branches:
      - automotive-edits/french-icons-001/c-cinematic-edit
    paths:
      - '.github/workflows/fr-legends-c-inspect.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  inspect-real-media:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg unzip
          pip install --quiet Pillow
      - name: Fetch verified 42-clip Actions source archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p out/fr-legends-c/outer
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/YunRah2103/Remotion-gpt-chat/actions/artifacts/11713925779/zip" \
            -o out/fr-legends-c/outer/artifact_outer.zip
          unzip -tq out/fr-legends-c/outer/artifact_outer.zip
          mkdir -p out/fr-legends-c/outer/inner
          unzip -q out/fr-legends-c/outer/artifact_outer.zip -d out/fr-legends-c/outer/inner
          rm out/fr-legends-c/outer/artifact_outer.zip
          find out/fr-legends-c/outer/inner -maxdepth 2 -type f -printf '%s %p\n'
      - name: Decode, verify, and make actual source contact sheets
        run: python production/videos/french-icons-001/agent-c/inspect_media.py
      - name: Commit inspection evidence (not media)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production/videos/french-icons-001/agent-c/clip_inventory.json
          git add production/videos/french-icons-001/agent-c/CONTACT_SHEET_CLASSICS.jpg
          git add production/videos/french-icons-001/agent-c/CONTACT_SHEET_MODERN.jpg
          git add production/videos/french-icons-001/agent-c/INSPECTION_STATUS.md
          git commit -m "qa(fr-legends-c): verify real source bytes and commit decoded shot contact sheets"
          git push origin HEAD:automotive-edits/french-icons-001/c-cinematic-edit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FR-LEGENDS-C-INSPECTION-${{ github.run_id }}
          path: |
            production/videos/french-icons-001/agent-c/clip_inventory.json
            production/videos/french-icons-001/agent-c/CONTACT_SHEET_CLASSICS.jpg
            production/videos/french-icons-001/agent-c/CONTACT_SHEET_MODERN.jpg
            production/videos/french-icons-001/agent-c/INSPECTION_STATUS.md
          retention-days: 14
          if-no-files-found: warn

name: YUNEX reusable world kit
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/yunex/world-kit/**'
      - 'tests/world-kit/**'
      - 'scripts/world-kit/**'
      - '.github/workflows/yunex-world-kit.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run worldkit:test
      - run: npm run worldkit:export
      - run: node scripts/world-kit/validate-glb.mjs
      - run: npm run worldkit:export-props
      - name: Native model and environment review
        run: npm run worldkit:review-v3
      - name: Reusable prop stills
        run: npm run worldkit:environments -- --props-only --stills-only
      - uses: actions/upload-artifact@v4
        with:
          name: YUNEX-WORLD-KIT-V3
          path: |
            out/world-kit
            out/world-kit-v2
            out/world-kit-v3
          retention-days: 30

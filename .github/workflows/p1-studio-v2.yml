name: P1 Studio V2 - Real model and kit
on:
  push:
    branches: [film/mclaren-p1-studio-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download actual McLaren P1 source GLB
        run: |
          mkdir -p public/p1-hybrid out/p1-hybrid-v2
          curl --fail --location --retry 4 --silent --show-error \
            https://raw.githubusercontent.com/pedrosoandre/carros/2d18dfd9db96bbf0d9cffa949deaf7f571388cbf/assets/mclaren-p1.glb \
            -o public/p1-hybrid/mclaren-p1.glb
          test "$(head -c 4 public/p1-hybrid/mclaren-p1.glb)" = glTF
          sha256sum public/p1-hybrid/mclaren-p1.glb > out/p1-hybrid-v2/model-sha256.txt
      - name: Verify Remotion composition exists
        run: npx remotion compositions production/p1-hybrid-v2/entry.tsx --gl=swangle
      - name: Render complete V2 film
        run: |
          npx remotion render production/p1-hybrid-v2/entry.tsx P1StudioV2 \
            out/p1-hybrid-v2/P1-STUDIO-V2-SILENT.mp4 --gl=swangle --codec=h264 --pixel-format=yuv420p --concurrency=2
      - name: Video probe and contact sheet
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ffprobe -v error -show_entries format=duration,size -show_entries stream=width,height,avg_frame_rate,nb_frames -of default=noprint_wrappers=1 out/p1-hybrid-v2/P1-STUDIO-V2-SILENT.mp4 | tee out/p1-hybrid-v2/validation.txt
          ffmpeg -v error -i out/p1-hybrid-v2/P1-STUDIO-V2-SILENT.mp4 -f null -
          ffmpeg -y -v error -i out/p1-hybrid-v2/P1-STUDIO-V2-SILENT.mp4 -vf "fps=1/2,scale=280:-1,tile=3x2" -frames:v 1 out/p1-hybrid-v2/contact-sheet.jpg
      - name: Attribution
        if: always()
        run: |
          cat > out/p1-hybrid-v2/README.txt <<'EOF'
          YUNEX P1 STUDIO V2 (silent visual master)
          Original 3D car by vecarz, source pedrosoandre/carros, licensed CC BY.
          Model: https://sketchfab.com/3d-models/none-adae2edc721e4ce7b31c1d06a581e30a
          Car geometry stays source-authentic; factory procedural surfaces are not used as a vehicle replacement.
          Lighting/reflections and garage/showroom environment from YUNEX world-kit.
          Illustrative V8 and electric drive props from YUNEX parts-kit, NOT OEM McLaren drivetrain scans.
          The car is stationary for studio shots; camera motion is not driving simulation.
          Remotion source: production/p1-hybrid-v2/entry.tsx.
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-studio-v2-video
          path: out/p1-hybrid-v2/
          retention-days: 14

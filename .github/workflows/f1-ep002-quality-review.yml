name: YUNEX F1 EP002 - cross-agent quality review
on:
  push:
    branches: [review/f1-ep002-quality-hardening]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Reproducible dependencies
        run: npm ci
      - name: TypeScript compatibility
        run: npm run check
      - name: Existing world-kit regression
        run: npm run worldkit:test
      - name: All five agents plus cross-agent regression
        run: |
          node --experimental-strip-types --test \
            tests/f1-line-ep002/agent-1.test.mjs \
            tests/f1-line-ep002/agent-2.test.mjs \
            tests/f1-line-ep002/agent-3.cinema.test.mjs \
            tests/f1-line-ep002/agent-4.test.mjs \
            tests/f1-line-ep002/agent-5.test.mjs \
            tests/f1-line-ep002/integration-review.test.mjs
      - name: Install native video verification
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p out/f1-ep002-review
      - name: Render native 5.5-second multi-agent QC reel
        run: npx remotion render src/yunex/f1-line-ep002/review-preview/entry.tsx F1EP002IntegratedReview out/f1-ep002-review/combined-review.mp4 --gl=swangle --codec=h264 --pixel-format=yuv420p --concurrency=1 --log=error
      - name: Full decode, metadata and motion QC
        run: |
          set -euo pipefail
          movie=out/f1-ep002-review/combined-review.mp4
          ffprobe -v error -show_entries stream=codec_name,pix_fmt,width,height,r_frame_rate,nb_frames -show_entries format=duration -of json "$movie" | tee out/f1-ep002-review/ffprobe.json
          ffmpeg -nostdin -v error -xerror -i "$movie" -f null -
          ffmpeg -nostdin -v error -i "$movie" -vf "fps=1" -f framemd5 out/f1-ep002-review/motion.md5
          ffmpeg -nostdin -v error -y -i "$movie" -vf "fps=1,scale=270:480,tile=3x2" -frames:v 1 out/f1-ep002-review/contact-sheet.jpg
          python3 - <<'PY'
          import json
          j=json.load(open('out/f1-ep002-review/ffprobe.json'))
          s=j['streams'][0]
          assert s['codec_name']=='h264',s
          assert s['pix_fmt']=='yuv420p',s
          assert (s['width'],s['height'])==(540,960),s
          assert s['r_frame_rate']=='30/1',s
          assert abs(float(j['format']['duration'])-5.5)<.06,j
          hashes=[line.rsplit(',',1)[-1].strip() for line in
                  open('out/f1-ep002-review/motion.md5') if line and not line.startswith('#')]
          assert len(hashes)>=6 and len(set(hashes))>=4,hashes
          print('Native 5.5s QC reel decodes; unique sampled frames:',len(set(hashes)))
          PY
      - name: Store native technical review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f1-ep002-multi-agent-review-QC
          path: out/f1-ep002-review/
          if-no-files-found: warn
          retention-days: 30

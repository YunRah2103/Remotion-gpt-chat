name: Carbon Ceramic 001 - Polish05 fast pad native recovery
on:
  push:
    branches: ['automotive-brakes-001/f-render']
    paths: ['.github/workflows/carbon-ceramic-001-f-polish05-fast-pad.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rapid-pad-01:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a8553b2c1af11d15eb0b8f6c96e0c3e53142f9aa
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install only required renderer modules
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a8553b2c1af11d15eb0b8f6c96e0c3e53142f9aa"
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -n 1
          npm ci --prefer-offline --no-audit --no-fund --maxsockets=3
          if ! node -e "require('@rspack/binding')" >/dev/null 2>&1; then
            version="$(node -p "require('./node_modules/@rspack/binding/package.json').version")"
            npm install --no-save --no-package-lock --no-audit --no-fund "@rspack/binding-linux-x64-gnu@${version}"
          fi
      - name: Render full native Polish05 frames 75-149, not old media
        run: |
          set -euo pipefail
          mkdir -p out/p05
          npx --no-install remotion render src/index.ts CarbonCeramic001 out/p05/part-01.mp4 --frames=75-149 --gl=swangle --codec=h264 --pixel-format=yuv420p --concurrency=1 --log=error
          python production/tools/quality.py video out/p05/part-01.mp4 --width 1080 --height 1920 --fps 30 --frames 75 --report out/p05/part-01-qa.json
          sha256sum out/p05/part-01.mp4 > out/p05/part-01.sha256
          echo "a8553b2c1af11d15eb0b8f6c96e0c3e53142f9aa" > out/p05/immutable-e-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polish05-fast-pad-part-01-${{ github.run_id }}
          path: out/p05/
          if-no-files-found: warn
          retention-days: 30

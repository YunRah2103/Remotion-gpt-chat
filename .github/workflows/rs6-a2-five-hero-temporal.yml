name: RS6 A2 selected five UHD hero shots temporal visual QA
on:
  push:
    branches:
      - automotive-edits/rs6-no-mercy-001/a2-hero-cinema
    paths:
      - production/videos/rs6-no-mercy-001/agent-a2/a2_hero_temporal.py
      - .github/workflows/rs6-a2-five-hero-temporal.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  a2-five-actual-hero-motion-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg and Python visual analysis
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check pillow numpy
      - name: Decode five actual 2.4s RS6 shots from 4K original, make 9x16 temporal QA contact frames
        run: |
          python production/videos/rs6-no-mercy-001/agent-a2/a2_hero_temporal.py | tee a2-five-hero-summary.json
      - name: Upload QA contact JPEGs and metadata only, no Audi source video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rs6-a2-five-native-4k-temporal-QA-${{ github.run_id }}
          path: |
            a2_hero_temporal/*.jpg
            a2_hero_temporal/report.json
            a2-five-hero-summary.json
          if-no-files-found: warn
          retention-days: 7

name: GT3 Agent A Visual Inspect Five Physical 1080 HRT GT3 Movies
on:
  push:
    branches: [automotive-edits/gt3-nurburgring-multicar-001/a-footage]
    paths: [.github/workflows/gt3-a-hrt-five-real-films-contact-qa.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  full-native-video-sha-make-review:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Image review dependency
        run: python -m pip install --break-system-packages -q Pillow
      - name: Download physically acquired 53MB HRT native 1080 video sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs/hrt_gt3_actual_zip
          gh run download 38160120679 --repo YunRah2103/Remotion-gpt-chat --name GT3-AGENT-A-HRT-FORD-NURBURGRING-ACTUAL-NATIVE-1080-OR-DIAGNOSTICS --dir inputs/hrt_gt3_actual_zip
          find inputs/hrt_gt3_actual_zip -type f -printf '%p %s bytes\n'
      - name: Byte-for-byte SHA prove five original HRT videos, show 40 actual video frames
        run: python -u production/videos/gt3-nurburgring-multicar-001/agent-a/display_hrt_ford_five_real_native_films.py
      - name: Deliver verified visual original proof
        uses: actions/upload-artifact@v4
        with:
          name: GT3-A-HRT-FORD-1080-FIVE-ORIGINALS-ACTUAL-40-FRAME-VISUAL-PROOF
          path: out/gt3-a-hrt-5-native-film-contact-qa/
          compression-level: 0
          retention-days: 7

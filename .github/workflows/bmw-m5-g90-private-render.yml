name: BMW M5 G90 - Private Footage Render
on:
  push:
    branches:
      - 'automotive-edits/bmw-m5-g90-001/b-editor-master'
    paths:
      - 'src/bmw-m5-g90-beat/**'
      - '.github/workflows/bmw-m5-g90-private-render.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  render-private-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Fetch actual 39-clip G90 private working media (run 38009881261)
        uses: actions/download-artifact@v4
        with:
          name: G90-PRIVATE-39-SHOTS
          run-id: 38009881261
          github-token: ${{ github.token }}
          path: public/bmw-m5-g90-beat
      - name: Strict binary source preflight - 39 hashes, 600 frames, single 720p format
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          root=pathlib.Path('public/bmw-m5-g90-beat')
          m=json.loads((root/'manifest.json').read_text())
          a=m['sourceSelections']
          assert len(a)==39 and m['vehicle']=='BMW M5 G90 saloon'
          assert m['publicPublishingApproved'] is False
          assert sum(x['exportFrames'] for x in a)==600
          for i,clip in enumerate(a,1):
              assert clip['index']==i
              p=root/clip['file']
              assert p.is_file(),str(p)
              assert hashlib.sha256(p.read_bytes()).hexdigest()==clip['clipSha256'],str(p)
              j=json.loads(subprocess.check_output(['ffprobe','-v','error','-select_streams','v:0',
                  '-show_entries','stream=codec_name,width,height,avg_frame_rate,nb_frames','-of','json',str(p)]))
              s=j['streams'][0]
              assert (s['codec_name'],s['width'],s['height'],s['avg_frame_rate'],int(s['nb_frames']))==(
                 'h264',1280,720,'30/1',clip['exportFrames']),(p,s)
          print('PASS: authentic BMW G90 source identity declared, 39 G90 MOVING video files checksum+probed, exact 600 frames')
          PY
      - name: Dependencies / TypeScript
        run: |
          npm ci --no-audit --no-fund
          npm run check
      - name: Native Remotion MP4 - visual only, no watermark or text
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          npx remotion render src/index.ts BmwM5G90Beat001 out/BMW_M5_G90_PRIVATE_VISUAL_20s.mp4 \
            --codec h264 --pixel-format yuv420p --crf 19 --gl swangle --concurrency 2
      - name: Decode all frames and verify 1080x1920 600f 30fps 20s
        shell: bash
        run: |
          set -euo pipefail
          F=out/BMW_M5_G90_PRIVATE_VISUAL_20s.mp4
          ffmpeg -nostdin -v error -xerror -i "$F" -f null -
          ffprobe -v error -select_streams v:0 -count_frames -show_entries stream=codec_name,width,height,avg_frame_rate,nb_read_frames -of json "$F" > out/ffprobe-qa.json
          python3 - <<'PY'
          import json
          s=json.load(open('out/ffprobe-qa.json'))['streams'][0]
          assert (s['codec_name'],s['width'],s['height'],s['avg_frame_rate'],int(s['nb_read_frames']))==('h264',1080,1920,'30/1',600),s
          print('PASS: 1080x1920, 30fps, 600 fully decoded frames, H.264')
          PY
      - name: Retain visual master ONLY for personal review
        uses: actions/upload-artifact@v4
        with:
          name: G90-PRIVATE-REMOTION-VISUAL-20S
          path: |
            out/BMW_M5_G90_PRIVATE_VISUAL_20s.mp4
            out/ffprobe-qa.json
          retention-days: 1
          if-no-files-found: error

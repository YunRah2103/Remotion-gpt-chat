name: Carbon Ceramic 001 - G exact source part04 rescue
on:
  push:
    branches: ['automotive-brakes-001/g-wheel-reveal']
    paths:
      - '.github/workflows/carbon-ceramic-001-g-part04-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover-exact-300-374:
    runs-on: ubuntu-22.04
    timeout-minutes: 125
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8000fb8f5d59fae7901c4c1be9482a8a3bc5a771
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install required native Remotion dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '8000fb8f5d59fae7901c4c1be9482a8a3bc5a771'
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          npm ci --prefer-offline --no-audit --no-fund --maxsockets=3
          if ! node -e "require('@rspack/binding')" >/dev/null 2>&1; then
            ver="$(node -p "require('./node_modules/@rspack/binding/package.json').version")"
            npm install --no-save --no-package-lock --no-audit --no-fund "@rspack/binding-linux-x64-gnu@${ver}"
          fi
      - name: Render exact 75 native frames 300-374 from immutable G source
        run: |
          set -euo pipefail
          mkdir -p out/carbon-ceramic-g/parts
          npx --no-install remotion render src/index.ts CarbonCeramic001             out/carbon-ceramic-g/parts/part-04.mp4             --frames=300-374 --gl=swangle --codec=h264 --pixel-format=yuv420p             --concurrency=1 --log=error
          python production/tools/quality.py video out/carbon-ceramic-g/parts/part-04.mp4             --width 1080 --height 1920 --fps 30 --frames 75             --report out/carbon-ceramic-g/parts/part-04-qa.json
          sha256sum out/carbon-ceramic-g/parts/part-04.mp4             > out/carbon-ceramic-g/parts/part-04.sha256
          git rev-parse HEAD > out/carbon-ceramic-g/parts/source-04.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brakes001-g-recovered-part-04-${{ github.run_id }}
          path: out/carbon-ceramic-g/parts/
          retention-days: 30
          if-no-files-found: warn

name: Porsche Turbo Agent D - master code and diagnostic proof
on:
  push:
    branches:
      - automotive-edits/porsche-911-turbo-evolution-001/d-master
    paths:
      - src/porsche-turbo-evolution/**
      - src/Root.tsx
      - production/videos/porsche-911-turbo-evolution-001/integration/**
      - .github/workflows/porsche-d-master-ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  master-code:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --no-audit --no-fund
      - name: Typecheck real registered scene and FX integration
        run: npm run check
      - name: Install native FFmpeg for actual media probes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Real Agent A/B/C integration code tests (synthetic fixtures, not footage)
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s production/videos/porsche-911-turbo-evolution-001/footage -p test_audit_footage.py -v
          python -m unittest discover -s production/videos/porsche-911-turbo-evolution-001/integration -p test_ingest_bridge.py -v
          python -m unittest discover -s production/videos/porsche-911-turbo-evolution-001/integration -p test_ingest_official_porsche.py -v
          python -m unittest discover -s production/videos/porsche-911-turbo-evolution-001/integration -p test_verify_official_excerpts.py -v
          python -m unittest discover -s production/tests -p test_yt_dlp_ingest.py -v
          node production/videos/porsche-911-turbo-evolution-001/edit/test_timeline.mjs
          node production/videos/porsche-911-turbo-evolution-001/qa/test_polish.mjs
      - name: Explicit live YouTube metadata check (manual only, fail on blocked access)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r production/footage/requirements.txt
          mkdir -p out/porsche-d-proof
          set +e
          timeout 150s python -m yt_dlp --ignore-config --no-playlist \
            --js-runtimes node --skip-download --dump-single-json --no-warnings \
            'https://www.youtube.com/watch?v=gbnBo2Au-uA' \
            > out/porsche-d-proof/source-metadata.json \
            2> out/porsche-d-proof/source-metadata.stderr
          result=$?
          set -e
          STATUS_CODE="$result" python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path('out/porsche-d-proof')
          raw=root/'source-metadata.json'
          err_file=root/'source-metadata.stderr'
          message=err_file.read_text(errors='replace')
          outcome=int(os.environ['STATUS_CODE'])
          summary={'probe':'PUBLIC_METADATA_ONLY_NO_DOWNLOAD',
                   'verifiedPorscheClips':0,'exitCode':outcome}
          if outcome:
              summary['sourceAccess']='BOT_CHALLENGE' if 'not a bot' in message.lower() else 'UNAVAILABLE'
              summary['result']='FAIL'
          else:
              try:
                  data=json.loads(raw.read_text())
                  videos=[f for f in data.get('formats',[]) if f.get('vcodec','none')!='none']
                  if not videos: raise ValueError('no accessible video formats')
                  summary.update(result='PASS',sourceAccess='FORMAT_METADATA_AVAILABLE',
                                 videoFormats=len(videos),
                                 heights=sorted({int(f.get('height') or 0) for f in videos}))
              except (ValueError,OSError) as exc:
                  summary.update(result='FAIL',sourceAccess='INVALID_RESPONSE',errorType=type(exc).__name__)
          (root/'metadata-probe-summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          raw.unlink(missing_ok=True)
          err_file.unlink(missing_ok=True)
          print(json.dumps(summary,indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as report:
              report.write('YouTube metadata check: **'+summary['result']+'** ('+summary['sourceAccess']+'). No media downloaded.\n')
          if summary['result']!='PASS':raise SystemExit(2)
          PY
      - name: Validate beat map and reject incomplete media release
        shell: bash
        run: |
          set -euo pipefail
          python production/videos/porsche-911-turbo-evolution-001/validate_setup.py
          python -m compileall -q production/videos/porsche-911-turbo-evolution-001/integration
          if python production/videos/porsche-911-turbo-evolution-001/integration/verify_master.py; then
            echo "ERROR: Release gate falsely accepted missing source media" >&2
            exit 1
          fi
          echo "Fail-closed release gate correctly rejects missing real media" >> "$GITHUB_STEP_SUMMARY"
      - name: Native diagnostic proof frame — NOT FINAL PORSCHE FOOTAGE
        shell: bash
        run: |
          mkdir -p out/porsche-d-proof
          npx remotion still src/index.ts PorscheTurboEvolution001 out/porsche-d-proof/DIAGNOSTIC_frame-70.png --frame=70 --scale=0.35 --gl=swangle
          test -s out/porsche-d-proof/DIAGNOSTIC_frame-70.png
          echo "A/B/C integrated diagnostic scene rendered. It is watermarked and has no source footage; do not distribute as movie." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: Porsche-D-DIAGNOSTIC-NOT-FINAL
          path: out/porsche-d-proof/
          retention-days: 7

name: YUNEX GT3 A2 Vimeo Player Facebook Ferrari Native Probe
on:
  push:
    branches:
      - automotive-edits/gt3-nurburgring-multicar-001/a2-ferrari-aston-mclaren
    paths:
      - .github/workflows/gt3-a2-vimeo-player-ferrari-team-video.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-video-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install browser and ffmpeg native source inspector
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -q --break-system-packages playwright yt-dlp requests pillow
          python -m playwright install chromium
      - name: Capture real iframe player/network URLs and download native-HD racing originals
        run: python -u production/videos/gt3-nurburgring-multicar-001/agent-a2/vimeo_iframe_and_ferrari_facebook.py
      - name: Verify files physically in ZIP and original SHA256
        if: always()
        run: |
          python - <<'PY'
          import pathlib,zipfile,json,hashlib
          p=pathlib.Path("out/gt3-a2-vimeo-iframe-direct/GT3_A2_BROWSER_ORIGINALS_AND_QA.zip")
          if not p.is_file():print("No zip: actual footage gate still blocked");raise SystemExit()
          with zipfile.ZipFile(p) as z:
            assert z.testzip() is None
            m=json.loads(z.read("SOURCE_MANIFEST.json"))
            count=0
            for row in m["sources"]:
              if row["status"]=="REAL_NATIVE_HD_FULL_DECODE_MODEL_REVIEW_PENDING":
                assert hashlib.sha256(z.read(row["file"])).hexdigest()==row["sha256"]
                count+=1
          assert count==m["native_hd_media_file_count"]
          print("PHYSICAL_NATIVE_ORIGINAL_VIDEO_COUNT",count,"EDITORIAL_QA_PENDING")
          PY
      - name: Upload one actual-media-or-diagnostic ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GT3-A2-VIMEO-IFRAME-FERRARI-FACEBOOK-REAL-VIDEO-REVIEW
          path: out/gt3-a2-vimeo-iframe-direct/GT3_A2_BROWSER_ORIGINALS_AND_QA.zip
          compression-level: 0
          retention-days: 7
          if-no-files-found: warn

name: YUNEX GT3 BMW M6 Nürburgring Original Native 4K Extraction
on:
  push:
    branches:
      - automotive-edits/gt3-nurburgring-multicar-001/a-footage
    paths:
      - .github/workflows/gt3-falken-bmw.yml
      - production/videos/gt3-nurburgring-multicar-001/agent-a/acquire_falken_bmw_gt3.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  footage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install original HDR video processors
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -q pillow
      - name: Download real GT3 4K source excerpt and QA contact
        run: python production/videos/gt3-nurburgring-multicar-001/agent-a/acquire_falken_bmw_gt3.py
      - name: Publish both real 4K video files and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GT3-BMW-M6-FALKEN-N24-REAL-4K-SOURCE-EXCERPTS
          path: out/gt3-falken-bmw4k/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
